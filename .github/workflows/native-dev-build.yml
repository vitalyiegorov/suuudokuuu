name: Build Development build

on:
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: development-build-release
    cancel-in-progress: false

jobs:
    dev-release:
        uses: rnw-community/mobile-ci/.github/workflows/native-dev-release.yml@0d82cf6287e64151cb16859732929cf39a0910dc # v1.4.2
        with:
            enable-ios: true
            enable-android: true
            ios-runner-labels: '["self-hosted","macOS","ARM64","macos-builder"]'
            android-runner-labels: '["self-hosted","macOS","ARM64","macos-builder"]'
            app-dir: packages/app
            eas-cli-version: 20.5.1
            build-profile: development
            tag-prefix: development
            keep-releases: '5'
            publish-env: |
                EXPO_APPLE_TEAM_ID=3R8589YV24
                EXPO_APPLE_TEAM_TYPE=INDIVIDUAL
                EXPO_USE_PRECOMPILED_MODULES=1
                RCT_USE_PREBUILT_RNCORE=1
                RCT_USE_RN_DEP=1
            build-command: |
                if [ "$GITHUB_JOB" = "ios-dev-release" ]; then
                  {
                    echo "$HOME/.rbenv/shims"
                    echo "/opt/homebrew/bin"
                    echo "/opt/homebrew/sbin"
                  } >> "$GITHUB_PATH"
                  export PATH="$HOME/.rbenv/shims:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
                  pod --version
                  fastlane --version

                  if [ -d /Applications/Xcode_26.4.1.app ]; then
                    xcode_app=/Applications/Xcode_26.4.1.app
                  elif [ -d /Applications/Xcode.app ]; then
                    xcode_app=/Applications/Xcode.app
                  else
                    echo "::error::Xcode is not installed on this runner."
                    find /Applications -maxdepth 1 -iname '*xcode*' -print
                    exit 1
                  fi
                  xcodebuild -version

                  echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"

                  (
                    cd packages/app || exit 1
                    node --input-type=module -e "
                      import { readFileSync, writeFileSync } from 'node:fs';
                      const easConfiguration = JSON.parse(readFileSync('eas.json', 'utf8'));
                      easConfiguration.cli.appVersionSource = 'local';
                      writeFileSync('eas.json', JSON.stringify(easConfiguration, null, 4) + '\n');
                    "
                  )
                fi

                if [ "$GITHUB_JOB" = "android-dev-release" ]; then
                  android_sdk_root=/Users/admin/Library/Android/sdk
                  test -x "$android_sdk_root/platform-tools/adb" || {
                    echo "::error::The guest image lacks the Android SDK; rebuild the base with prewarm-android-buildsdk-macos.sh."
                    exit 1
                  }
                  {
                    echo "ANDROID_SDK_ROOT=$android_sdk_root"
                    echo "ANDROID_HOME=$android_sdk_root"
                    echo "JAVA_HOME=/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home"
                  } >> "$GITHUB_ENV"
                fi
        secrets:
            EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
            ASC_API_KEY: ${{ secrets.EXPO_IOS_ASC_API_KEY }}
            ASC_KEY_ID: LD57UK43J9
            ASC_ISSUER_ID: 76e76b40-770a-4a81-bcdc-1f8346aeed02
