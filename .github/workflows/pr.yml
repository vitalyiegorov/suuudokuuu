name: Pull Request
env:
    MAESTRO_VERSION: '2.6.1'
    MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
    TURBO_TEAM: vitalyiegorov
    TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    PR_NUMBER: ${{ github.event.pull_request.number }}
    MAESTRO_CLI_NO_ANALYTICS: true
    MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true
    RCT_USE_PREBUILT_RNCORE: 1
    RCT_USE_RN_DEP: 1

concurrency:
    group: pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]

jobs:
    changes:
        name: Detect mobile changes
        runs-on: [self-hosted, linux-portable-2x4]
        permissions:
            contents: read
        outputs:
            mobile: ${{ steps.mobile.outputs.mobile }}
            app_tests: ${{ steps.mobile.outputs.app_tests }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Classify changed paths
              id: mobile
              shell: bash
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  set -euo pipefail
                  mobile=true
                  app_tests=true
                  base_sha="$BASE_SHA"
                  head_sha="$GITHUB_SHA"

                  if [ -z "$base_sha" ] || [ -z "$head_sha" ]; then
                    echo '::warning::Missing pull request base or head SHA; Maestro remains required.'
                  elif changed_paths=$(git diff --name-only --no-renames "$base_sha" "$head_sha"); then
                    echo 'Changed paths:'
                    if [ -z "$changed_paths" ]; then
                      echo '(none)'
                      echo '::warning::Diff is empty; Maestro remains required.'
                    else
                      printf '%s\n' "$changed_paths"
                      only_documentation_changes=true
                      app_tests=false
                      while IFS= read -r changed_path; do
                        case "$changed_path" in
                          tests/app-tests/*)
                            app_tests=true
                            only_documentation_changes=false
                            ;;
                          docs/*)
                            ;;
                          */*)
                            only_documentation_changes=false
                            ;;
                          *.md)
                            ;;
                          *)
                            only_documentation_changes=false
                            ;;
                        esac
                      done <<< "$changed_paths"

                      if [ "$only_documentation_changes" = true ]; then
                        mobile=false
                      fi
                    fi
                  else
                    echo '::warning::Unable to compare pull request base to head; Maestro remains required.'
                  fi

                  echo "Mobile impact: $mobile"
                  echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
                  echo "App tests impact: $app_tests"
                  echo "app_tests=$app_tests" >> "$GITHUB_OUTPUT"

    app-tests-scripts:
        name: App test script self-tests
        if: ${{ needs.changes.outputs.app_tests == 'true' }}
        needs: [changes]
        runs-on: [self-hosted, linux-portable-2x4]
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x

            - name: Run app test script self-tests
              shell: bash
              run: |
                  set -euo pipefail
                  for test_script in tests/app-tests/scripts/test-*.sh; do
                    bash "$test_script"
                  done

    code-quality:
        name: Code quality checks
        # 4x8: the workspace grew to 7 packages and turbo's parallel lint/test
        # fan-out OOM-kills 4 GiB guests (exit 137, 'runner has received a
        # shutdown signal'), so this job needs the 8 GiB shape, not the 4 GiB one.
        runs-on: [self-hosted, linux-portable-4x8]
        timeout-minutes: 30
        permissions:
            pull-requests: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22.x
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Ruby
              run: command -v ruby || (sudo apt-get update -qq && sudo apt-get -o DPkg::Lock::Timeout=300 install -y -qq --no-install-recommends ruby)

            - name: Maestro selector checks
              run: pnpm --filter @suuudokuuu/app-tests selectors:check

            - name: Maestro seed fixtures are current
              run: pnpm --filter @suuudokuuu/app-tests seed:check

            - name: Lingui catalogs are up to date
              run: pnpm i18n:check

            - name: Formatting checks
              run: pnpm format:check

            - name: Typescript checks
              run: pnpm ts

            - name: Effect diagnostics
              run: pnpm effect:check

            - name: Lint checks
              run: pnpm lint

            - name: Deadcode detection
              env:
                  KNIP_DISABLE_RAW_TRANSFER: '1'
              run: pnpm deadcode

            - name: Copy/Paste detection
              run: pnpm cpd

            - name: Unit tests
              run: pnpm test:coverage

            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v7

    mobile-e2e:
        if: ${{ needs.changes.outputs.mobile == 'true' && needs.code-quality.result == 'success' }}
        needs: [changes, code-quality]
        # Each nesting level can only narrow the token, so the scopes mobile-ci's
        # plan job needs to read a published base binary have to be granted here
        # as well as on the jobs inside mobile-e2e.yml. Granting them only there
        # leaves the token at contents: read and every pull request silently
        # compiles native code instead of repacking.
        permissions:
            contents: read
            packages: write
            actions: read
        uses: ./.github/workflows/mobile-e2e.yml

    web-e2e:
        if: ${{ needs.changes.outputs.mobile == 'true' }}
        needs: [changes]
        permissions:
            contents: read
        uses: ./.github/workflows/web-e2e.yml
        secrets: inherit

    web-preview:
        name: Vercel preview Web
        if: ${{ needs.changes.outputs.mobile == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
        needs: [changes]
        runs-on: [self-hosted, linux-portable-4x8]
        timeout-minutes: 30
        permissions:
            contents: read
            deployments: write
            pull-requests: write
        environment:
            name: preview-web-pr-${{ github.event.number }}
            url: ${{ steps.deploy.outputs.preview_url }}
        env:
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22.x
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build expo web
              working-directory: packages/app
              run: pnpm exec expo export --platform=web

            - name: Build landing export
              run: pnpm turbo run build --filter=@suuudokuuu/landing

            - name: Pull Vercel project settings
              working-directory: packages/app
              run: pnpm dlx vercel@latest pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

            - name: Build Vercel output
              working-directory: packages/app
              run: pnpm build:vercel

            - name: Deploy Vercel preview
              id: deploy
              working-directory: packages/app
              shell: bash
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              run: |
                  set -euo pipefail
                  preview_url=$(pnpm dlx vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN" 2>vercel-deploy.log | tail -n1)
                  if [[ "$preview_url" != https://* ]]; then
                    echo "::error::Vercel deploy did not return a preview URL. Got: $preview_url"
                    cat vercel-deploy.log
                    exit 1
                  fi
                  echo "Preview URL: $preview_url"
                  echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

            - name: Comment preview URL
              uses: actions/github-script@v9
              env:
                  PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
              with:
                  script: |
                      const marker = '<!-- suuudokuuu-web-preview -->';
                      const body = [
                          marker,
                          '### Web preview',
                          '',
                          `${process.env.PREVIEW_URL} (commit ${context.payload.pull_request.head.sha.slice(0, 7)})`
                      ].join('\n');
                      const { data: comments } = await github.rest.issues.listComments({
                          ...context.repo,
                          issue_number: context.issue.number
                      });
                      const existingComment = comments.find(comment => comment.body?.startsWith(marker));
                      if (existingComment) {
                          await github.rest.issues.updateComment({ ...context.repo, comment_id: existingComment.id, body });
                      } else {
                          await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
                      }

    eas-preview:
        name: EAS Update preview
        if: ${{ needs.changes.outputs.mobile == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
        needs: [changes]
        runs-on: [self-hosted, trf-linux-amd64-4x8]
        timeout-minutes: 30
        permissions:
            contents: read
            deployments: write
            pull-requests: write
        environment:
            name: preview-eas-pr-${{ github.event.number }}
            url: ${{ steps.publish.outputs.link }}
        env:
            EAS_CLI_VERSION: '20.5.1'
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22.x
                  cache: pnpm

            - name: Setup Expo and EAS
              uses: expo/expo-github-action@v9
              with:
                  packager: npm
                  eas-version: ${{ env.EAS_CLI_VERSION }}
                  token: ${{ secrets.EXPO_TOKEN }}

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Publish EAS Update preview
              id: publish
              uses: expo/expo-github-action/preview@v9
              env:
                  APP_VARIANT: preview
              with:
                  command: eas update --branch pr-${{ github.event.number }} --message pr-${{ github.event.number }}-${{ github.event.pull_request.head.sha }} --non-interactive
                  working-directory: packages/app

    required-ci:
        if: ${{ always() }}
        needs: [changes, code-quality, app-tests-scripts, mobile-e2e, web-e2e]
        name: Required CI
        permissions:
            contents: read
        runs-on: [self-hosted, linux-portable-2x4]
        timeout-minutes: 5
        steps:
            - name: Verify required jobs
              env:
                  CHANGES_RESULT: ${{ needs.changes.result }}
                  MOBILE_RESULT: ${{ needs.changes.outputs.mobile }}
                  CODE_QUALITY_RESULT: ${{ needs.code-quality.result }}
                  APP_TESTS_RESULT: ${{ needs.app-tests-scripts.result }}
                  APP_TESTS_IMPACT: ${{ needs.changes.outputs.app_tests }}
                  MOBILE_E2E_RESULT: ${{ needs.mobile-e2e.result }}
                  WEB_E2E_RESULT: ${{ needs.web-e2e.result }}
              run: |
                  set -euo pipefail
                  summary="changes=$CHANGES_RESULT, code-quality=$CODE_QUALITY_RESULT, app-tests-scripts=$APP_TESTS_RESULT, mobile=$MOBILE_RESULT, mobile-e2e=$MOBILE_E2E_RESULT, web-e2e=$WEB_E2E_RESULT"
                  echo "CI summary: $summary"
                  if [ "$CHANGES_RESULT" != 'success' ] || [ "$CODE_QUALITY_RESULT" != 'success' ]; then
                    echo "Required jobs did not pass: $summary"
                    exit 1
                  fi

                  if [ "$APP_TESTS_IMPACT" = 'true' ] && [ "$APP_TESTS_RESULT" != 'success' ]; then
                    echo "Required jobs did not pass: $summary"
                    exit 1
                  fi

                  if [ "$APP_TESTS_IMPACT" = 'false' ] && [ "$APP_TESTS_RESULT" != 'skipped' ]; then
                    echo "Required jobs did not pass: $summary"
                    exit 1
                  fi

                  if [ "$MOBILE_RESULT" = 'true' ] && [ "$MOBILE_E2E_RESULT" = 'success' ] && [ "$WEB_E2E_RESULT" = 'success' ]; then
                    exit 0
                  fi

                  if [ "$MOBILE_RESULT" = 'false' ] && [ "$MOBILE_E2E_RESULT" = 'skipped' ] && [ "$WEB_E2E_RESULT" = 'skipped' ]; then
                    exit 0
                  fi

                  echo "Required jobs did not pass: $summary"
                  exit 1
