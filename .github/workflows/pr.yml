name: Pull Request
env:
  MAESTRO_DRIVER_STARTUP_TIMEOUT: "120000"
  TURBO_TEAM: vitalyiegorov
  TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_TITLE: ${{ github.event.pull_request.title }}
  MAESTRO_CLI_NO_ANALYTICS: false
  RCT_USE_PREBUILT_RNCORE: 1
  RCT_USE_RN_DEP: 1

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  code-quality:
    name: Code quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Lint the PR Title
        run: echo "${{env.PR_TITLE}}" | node_modules/.bin/commitlint

      - name: Typescript checks
        run: yarn turbo ts

      - name: ESLint checks
        run: yarn turbo lint

      - name: Deadcode detection
        run: yarn turbo deadcode

      - name: Copy/Paste detection
        run: yarn turbo cpd

      - name: Unit tests
        run: yarn test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3

  e2e-ios:
    needs: code-quality
    name: E2E Tests on iOS
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: |
          yarn install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Expo Prebuild
        working-directory: packages/app
        run: npx expo prebuild -p ios --clean

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-deriveddata-${{ runner.os }}-${{ github.sha }}
          restore-keys: xcode-deriveddata-${{ runner.os }}-

      - name: Cache iOS dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
            /packages/app/ios/Pods
          key: pods-${{ runner.os }}-${{ github.sha }}
          restore-keys: pods-${{ runner.os }}-

      - name: Start iOS Simulator
        uses: futureware-tech/simulator-action@v4
        with:
          model: 'iPhone 17 Pro'

      - name: Build and install app
        working-directory: packages/app
        run: |
          eas build --profile=e2e --platform ios --non-interactive --local --output app.ios.tar.gz
          rm -rf ios-build
          mkdir -p ios-build
          tar -xzf app.ios.tar.gz -C ios-build
          app_path="$(find ios-build -maxdepth 3 -name '*.app' -type d | head -n 1)"
          test -n "$app_path"
          xcrun simctl bootstatus booted -b
          xcrun simctl install booted "$app_path"
          xcrun simctl launch booted com.vitalyiegorov.suuudokuuu.preview

      - name: Install Maestro
        run: |
          export MAESTRO_VERSION=2.0.3; curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro UI tests
        working-directory: tests/app-tests
        run: |
          maestro test flows -e APP_ID=com.vitalyiegorov.suuudokuuu.preview --format junit  --config config.yaml --debug-output ./

      - name: Upload Maestro artifacts (report, logs, videos, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-artifacts
          include-hidden-files: true
          path: |
            tests/app-tests/.maestro/**
            tests/app-tests/*.mp4

  e2e-android:
    needs: code-quality
    name: E2E Tests on Android
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          yarn install

      - name: Expo Prebuild
        working-directory: packages/app
        run: npx expo prebuild -p android --clean

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('packages/app/android/**/*.gradle*', 'packages/app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34

      - name: Build app
        working-directory: packages/app
        run: |
          eas build --profile=e2e --platform android --non-interactive --local --output app.android.apk

      - name: Install Maestro
        run: |
          export MAESTRO_VERSION=2.0.3; curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Сreate AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          channel: canary
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Start emulator and run Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          channel: canary
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: tests/app-tests
          script: |
            cd ../../packages/app && eas build:run --platform android --path app.android.apk
            maestro test flows -e APP_ID=com.vitaliiyehorov.suuudokuuu.preview --config config.yaml --format junit --output ./report.xml --debug-output ./ && killall -INT crashpad_handler

      - name: Upload Maestro artifacts (report, logs, videos, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-artifacts
          include-hidden-files: true
          path: |
            tests/app-tests/.maestro/**
            tests/app-tests/*.mp4
