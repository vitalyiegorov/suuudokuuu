name: Pull Request
env:
  MAESTRO_VERSION: '2.6.1'
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
  TURBO_TEAM: vitalyiegorov
  TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_TITLE: ${{ github.event.pull_request.title }}
  MAESTRO_CLI_NO_ANALYTICS: true
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true
  RCT_USE_PREBUILT_RNCORE: 1
  RCT_USE_RN_DEP: 1

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  code-quality:
    name: Code quality checks
    runs-on: [self-hosted, linux-tiered, linux-medium]
    timeout-minutes: 20
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Lingui catalogs are up to date
        run: yarn i18n:check

      - name: Lint the PR Title
        run: printf '%s\n' "$PR_TITLE" | node_modules/.bin/commitlint

      - name: Typescript checks
        run: yarn ts

      - name: ESLint checks
        run: yarn lint

      - name: Deadcode detection
        env:
          KNIP_DISABLE_RAW_TRANSFER: '1'
        run: yarn deadcode

      - name: Copy/Paste detection
        run: yarn cpd

      - name: Unit tests
        run: yarn test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5

  ios-maestro:
    needs: code-quality
    uses: ./.github/workflows/ios-maestro.yml
    secrets: inherit

  required-ci:
    if: ${{ always() }}
    needs: [code-quality, ios-maestro]
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          CODE_QUALITY_RESULT: ${{ needs.code-quality.result }}
          IOS_MAESTRO_RESULT: ${{ needs.ios-maestro.result }}
        run: |
          if [ "$CODE_QUALITY_RESULT" != 'success' ] || [ "$IOS_MAESTRO_RESULT" != 'success' ]; then
            echo "Required jobs did not pass: code-quality=$CODE_QUALITY_RESULT, ios-maestro=$IOS_MAESTRO_RESULT"
            exit 1
          fi
