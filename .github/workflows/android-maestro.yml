name: Android Maestro

# Runs the Maestro suite against Redroid (Android-in-container) on the LINUX
# runners, via rnw-community/mobile-ci's run-maestro-android-redroid action —
# a hardened extraction of the Redroid lifecycle this repo pioneered (see the
# adoption PR for the exact hardening gained). Google ships no emulator for
# arm64 linux and nested-KVM boots are unstable on the host, so Android runs
# as a privileged container at native arm64 speed over the binder kernel
# module — no virtualization inside the guest at all. Requires the linux
# guest image to carry docker + the pulled redroid image + the prewarmed
# /data volume (prewarm-redroid-linux.sh). Tests only: the APK is produced by
# mobile-build.yml (see mobile-e2e.yml).
on:
    workflow_call:

jobs:
    test:
        name: Maestro Android
        # One job, all flows, on linux-xl (6 cpu / 12 GiB). Android can't run two
        # 12 GiB VMs on the 24 GiB host, so sharding gained nothing here — a single
        # job lets the Redroid container claim generous resources (6 GiB / 4 CPU)
        # for stable boot and snappy interaction (the timed challenge flows race a
        # fixed opponent time, so app speed matters).
        runs-on: [self-hosted, linux-tiered, linux-xl]
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v5

            - uses: actions/download-artifact@v6
              with:
                  name: android-e2e-app
                  path: .ci-artifacts/android-e2e-app

            - name: run-maestro-android-redroid
              uses: rnw-community/mobile-ci/actions/run-maestro-android-redroid@e32fa57b154d09b4b328ccf276e365467b788f3f # rnw-community/mobile-ci#16
              with:
                  container-name: redroid-e2e
                  apk-path: .ci-artifacts/android-e2e-app/suuudokuuu-e2e.apk
                  app-id: com.vitaliiyehorov.suuudokuuu.e2e
                  flows-dir: tests/app-tests/flows
                  shard-index: '0'
                  shard-count: '1'
                  maestro-version: '2.6.1'
                  memory: 6g
                  cpus: '4'
                  prewarm-manifest-path: $HOME/.sudoku-ci/android-emulator.json
                  boot-timeout-seconds: '300'
                  artifacts-dir: ${{ github.workspace }}/tests/app-tests/artifacts/maestro-android
                  artifact-name: maestro-android
