name: Android build diagnostics

on:
    push:
        branches: [dependabot/npm_and_yarn/npm-minor-and-patch-8ddb0b59f1]
        paths:
            - .github/workflows/android-build-diagnostics.yml
            - .github/scripts/android-native-memory.init.gradle

permissions:
    contents: read

jobs:
    build:
        runs-on: [self-hosted, trf-linux-amd64-4x8]
        timeout-minutes: 60
        env:
            APP_VARIANT: e2e
            ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
            DIAGNOSTICS_DIR: ${{ github.workspace }}/.ci-diagnostics/android-build-diagnostics
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: 22.x
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Prebuild Android
              working-directory: packages/app
              run: pnpm exec expo prebuild -p android --clean --no-install

            - name: Record pre-build diagnostics
              shell: bash
              run: |
                  mkdir -p "$DIAGNOSTICS_DIR"
                  date -u +'%Y-%m-%d %H:%M:%S UTC' > "$DIAGNOSTICS_DIR/start.txt"
                  set +e
                  cat /proc/self/cgroup > "$DIAGNOSTICS_DIR/before-cgroup.txt" 2>&1
                  cat /proc/self/mountinfo > "$DIAGNOSTICS_DIR/before-mountinfo.txt" 2>&1
                  find /sys/fs/cgroup -type f \( -name memory.events -o -name memory.events.local -o -name memory.current -o -name memory.peak -o -name memory.max \) \
                    -print -exec cat {} \; > "$DIAGNOSTICS_DIR/before-memory.txt" 2>&1
                  exit 0

            - name: Build Android
              uses: rnw-community/mobile-ci/actions/build-android-app@3e9afaf1888bce8a3e4a70818d457ffa9de11d8d
              with:
                  app-dir: packages/app
                  cmdline-tools-version: '12266719'
                  gradle-task: ':app:assembleRelease'
                  gradle-args: '--init-script ../../../.github/scripts/android-native-memory.init.gradle --max-workers=1 -x lint -x lintVitalAnalyzeRelease -x lintAnalyzeRelease -PreactNativeArchitectures=x86_64'
                  output-dir: .ci-cache/android-native-app/e2e
                  gradle-cache-key: gradle-e2e-${{ runner.os }}-${{ hashFiles('packages/app/android/gradle/wrapper/gradle-wrapper.properties', 'packages/app/android/**/*.gradle*', 'packages/app/android/gradle/*.versions.toml', 'yarn.lock', 'pnpm-lock.yaml', 'package-lock.json', 'npm-shrinkwrap.json') }}
                  gradle-cache-restore-keys: |
                      gradle-e2e-${{ runner.os }}-

            - name: Collect post-build diagnostics
              if: always()
              shell: bash
              run: |
                  mkdir -p "$DIAGNOSTICS_DIR/files"
                  set +e
                  date -u +'%Y-%m-%d %H:%M:%S UTC' > "$DIAGNOSTICS_DIR/end.txt"
                  cat /proc/self/cgroup > "$DIAGNOSTICS_DIR/after-cgroup.txt" 2>&1
                  cat /proc/self/mountinfo > "$DIAGNOSTICS_DIR/after-mountinfo.txt" 2>&1
                  find /sys/fs/cgroup -type f \( -name memory.events -o -name memory.events.local -o -name memory.current -o -name memory.peak -o -name memory.max \) \
                    -print -exec cat {} \; > "$DIAGNOSTICS_DIR/after-memory.txt" 2>&1
                  journalctl --kernel --since "$(cat "$DIAGNOSTICS_DIR/start.txt")" --no-pager > "$DIAGNOSTICS_DIR/kernel-journal.txt" 2>&1
                  sudo -n journalctl --kernel --since "$(cat "$DIAGNOSTICS_DIR/start.txt")" --no-pager 2>&1 | cat > "$DIAGNOSTICS_DIR/kernel-journal-sudo.txt"
                  dmesg --time-format iso > "$DIAGNOSTICS_DIR/dmesg.txt" 2>&1
                  sudo -n dmesg --time-format iso 2>&1 | cat > "$DIAGNOSTICS_DIR/dmesg-sudo.txt"
                  find "$GITHUB_WORKSPACE" "${GRADLE_USER_HOME:-$HOME/.gradle}" /tmp \
                    -path "$DIAGNOSTICS_DIR" -prune -o -type f \( -name 'daemon-*.out.log' -o -name 'hs_err_pid*.log' \) \
                    -exec cp --parents -- {} "$DIAGNOSTICS_DIR/files" \; 2> "$DIAGNOSTICS_DIR/jvm-collection-errors.txt"
                  find "$GITHUB_WORKSPACE/packages/app/android" "$GITHUB_WORKSPACE/node_modules/.pnpm" \
                    -type f \( -path '*/.cxx/*' -o -path '*/build/intermediates/cxx/*' \) \
                    \( -name '*.log' -o -name '*.json' -o -name '*.txt' -o -name '*.yaml' -o -name '*.yml' -o -name '*.ninja' \) \
                    -exec cp --parents -- {} "$DIAGNOSTICS_DIR/files" \; 2> "$DIAGNOSTICS_DIR/native-collection-errors.txt"
                  exit 0

            - name: Upload build diagnostics
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: android-build-diagnostics
                  path: ${{ env.DIAGNOSTICS_DIR }}
                  include-hidden-files: true
                  if-no-files-found: error
