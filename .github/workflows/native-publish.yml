name: Build and Publish to Stores
env:
  EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
  EXPO_NO_TELEMETRY: '1'
  EAS_CLI_VERSION: '20.5.1'
  EXPO_USE_PRECOMPILED_MODULES: '1'
  RCT_USE_PREBUILT_RNCORE: '1'
  RCT_USE_RN_DEP: '1'
  TURBO_TEAM: vitalyiegorov
  TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suuudokuuu-native-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & Submit iOS to App Store
    runs-on: [self-hosted, macOS, ARM64, macos-builder]
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: yarn

      - name: Configure macOS toolchain
        run: |
          echo "$HOME/.rbenv/shims" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/sbin" >> "$GITHUB_PATH"

          export PATH="$HOME/.rbenv/shims:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
          pod --version
          fastlane --version

      - name: Verify release credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY: ${{ secrets.EXPO_IOS_ASC_API_KEY }}
        run: |
          test -n "$EXPO_TOKEN" || {
            echo "::error::EXPO_TOKEN is not configured."
            exit 1
          }
          test -n "$ASC_API_KEY" || {
            echo "::error::EXPO_IOS_ASC_API_KEY is not configured."
            exit 1
          }

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.4.1.app ]; then
            XCODE_APP=/Applications/Xcode_26.4.1.app
          elif [ -d /Applications/Xcode.app ]; then
            XCODE_APP=/Applications/Xcode.app
          else
            echo "::error::Xcode is not installed on this runner."
            ls -1 /Applications | grep -i Xcode || true
            exit 1
          fi

          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: ${{ env.EAS_CLI_VERSION }}
          token: ${{ secrets.EXPO_TOKEN }}

      - name: ASC API Key file creation
        uses: MobileDevOps/secret-to-file-action@v1.0.0
        with:
          base64-encoded-secret: ${{ secrets.EXPO_IOS_ASC_API_KEY }}
          filename: 'packages/app/asc_api_key.p8'

      - name: Install dependencies
        run: yarn install

      - name: Build iOS app locally
        working-directory: packages/app
        env:
          EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/packages/app/asc_api_key.p8
          EXPO_ASC_KEY_ID: LD57UK43J9
          EXPO_ASC_ISSUER_ID: 76e76b40-770a-4a81-bcdc-1f8346aeed02
        run: |
          mkdir -p ../../artifacts
          eas build --platform ios --profile production --local --non-interactive --output ../../artifacts/suuudokuuu-production.ipa

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: suuudokuuu-production-ios
          path: artifacts/suuudokuuu-production.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Submit iOS app
        working-directory: packages/app
        run: eas submit --platform ios --profile production --path ../../artifacts/suuudokuuu-production.ipa --non-interactive

      - name: Remove App Store Connect key
        if: always()
        run: rm -f packages/app/asc_api_key.p8
