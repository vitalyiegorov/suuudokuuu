name: Build and Publish to Stores

on:
    workflow_dispatch:
        inputs:
            push_screenshots:
                description: 'Also upload the committed store screenshots'
                type: boolean
                default: false
            platforms:
                description: 'Stores to build and upload for'
                type: choice
                options:
                    - ios,android
                    - ios
                    - android
                default: ios,android

permissions:
    contents: read

concurrency:
    group: suuudokuuu-native-publish
    cancel-in-progress: false

jobs:
    release-tag:
        name: Resolve the release tag
        runs-on: [self-hosted, trf-linux-amd64-2x4]
        timeout-minutes: 5
        outputs:
            tag: ${{ steps.version.outputs.tag }}
        steps:
            - name: Checkout the app manifest
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  sparse-checkout: packages/app/package.json
                  sparse-checkout-cone-mode: false

            - name: Read the app version
              id: version
              run: echo "tag=v$(jq -r .version packages/app/package.json)" >> "$GITHUB_OUTPUT"

            - name: Require the release tag
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.version.outputs.tag }}
              run: |
                  if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --silent; then
                    echo "::error::Tag ${TAG} does not exist, and the store build record is written to its release. Release the version before publishing."
                    exit 1
                  fi

    publish:
        name: Build and submit
        needs: [release-tag]
        permissions:
            contents: write
        uses: rnw-community/mobile-ci/.github/workflows/native-publish.yml@f90309c791283d6e2dd1e35eb2ae6c5aee2151cd # v4.7.0
        with:
            control-runner-labels: '["self-hosted","trf-linux-amd64-2x4"]'
            install-command: pnpm install --frozen-lockfile
            app-dir: packages/app
            enable-ios: ${{ contains(inputs.platforms, 'ios') }}
            enable-android: ${{ contains(inputs.platforms, 'android') }}
            android-lint-gate: true
            lint-timeout-minutes: 60
            android-lint-gate-gradle-cache: false
            # An all-ABI lint run OOMs D8; scope the gate to the shipping variant.
            android-lint-gate-gradle-args: '-PreactNativeArchitectures=arm64-v8a --no-daemon'
            ios-runner-labels: '["self-hosted","macOS","ARM64","macos-maestro"]'
            # The release AAB builds on a 16 GiB hosted runner: the 8 GiB self-hosted pool is too tight for the Gradle, Kotlin and R8 JVMs.
            android-runner-labels: '["ubuntu-latest"]'
            node-version: 22.x
            build-profile: production
            submit-profile: production
            write-store-record: true
            release-tag: ${{ needs.release-tag.outputs.tag }}
            eas-cli-version: '20.5.1'
            required-android-abi: arm64-v8a
            # eas.json submit.production.ios.ascApiKeyPath resolves relative to app-dir.
            asc-key-path: asc_api_key.p8
            # eas.json submit.production.android.serviceAccountKeyPath resolves
            # relative to app-dir; the key is written post-build, so it never
            # enters the eas build archive.
            google-key-path: google-service-account.json
            publish-env: |
                NATIVE_COMPILE_JOBS=2
                EXPO_NO_TELEMETRY=1
                LANG=en_US.UTF-8
                LC_ALL=en_US.UTF-8
                APP_VARIANT=production
                EXPO_APPLE_TEAM_ID=3R8589YV24
                EXPO_APPLE_TEAM_TYPE=INDIVIDUAL
                EXPO_USE_PRECOMPILED_MODULES=1
                RCT_USE_PREBUILT_RNCORE=1
                RCT_USE_RN_DEP=1
                EXPO_ASC_KEY_ID=LD57UK43J9
                EXPO_ASC_ISSUER_ID=76e76b40-770a-4a81-bcdc-1f8346aeed02
                PUSH_SCREENSHOTS=${{ inputs.push_screenshots }}
            ios-pre-submit-command: |
                export PATH="$HOME/.rbenv/shims:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
                fastlane store_preflight
            ios-post-submit-command: |
                export PATH="$HOME/.rbenv/shims:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
                node scripts/generate-store-release-notes.ts --check
                fastlane ios ios_metadata
                if [ "$PUSH_SCREENSHOTS" = 'true' ]; then
                  fastlane ios ios_screenshots
                fi
            # fastlane is pinned by packages/app/Gemfile.lock and installed into the job's
            # temp dir, outside the EAS build archive; Ruby comes from the runner image,
            # or from apt on an image that predates it.
            android-pre-submit-command: |
                if ! command -v bundle >/dev/null; then
                  sudo apt-get update -qq
                  sudo apt-get -o DPkg::Lock::Timeout=300 install -y -qq --no-install-recommends ruby ruby-dev ruby-bundler
                fi
                export BUNDLE_PATH="$RUNNER_TEMP/bundle"
                BUNDLE_JOBS=4 bundle install --quiet
                bundle exec fastlane store_preflight
            android-post-submit-command: |
                export BUNDLE_PATH="$RUNNER_TEMP/bundle"
                node scripts/generate-store-release-notes.ts --check
                bundle exec fastlane android android_metadata
                if [ "$PUSH_SCREENSHOTS" = 'true' ]; then
                  bundle exec fastlane android android_screenshots
                fi
        secrets:
            EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
            ASC_API_KEY: ${{ secrets.EXPO_IOS_ASC_API_KEY }}
            ASC_KEY_ID: ${{ secrets.EXPO_IOS_ASC_KEY_ID }}
            ASC_ISSUER_ID: ${{ secrets.EXPO_IOS_ASC_ISSUER_ID }}
            GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
