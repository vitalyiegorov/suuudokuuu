name: Build and Publish to Stores

on:
    workflow_dispatch:
        inputs:
            push_screenshots:
                description: 'Also upload the committed store screenshots'
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: suuudokuuu-native-publish
    cancel-in-progress: false

jobs:
    publish:
        uses: rnw-community/mobile-ci/.github/workflows/native-publish.yml@e6360047cd92fbf524d99a7ddc352fa566d3638a # v1.3.0
        with:
            enable-ios: true
            enable-android: true
            ios-runner-labels: '["self-hosted","macOS","ARM64","macos-builder"]'
            android-runner-labels: '["self-hosted","macOS","ARM64","macos-builder"]'
            app-dir: packages/app
            eas-cli-version: 20.5.1
            build-profile: production
            submit-profile: production
            android-lint-gate: true
            required-android-abi: arm64-v8a
            asc-key-path: asc_api_key.p8
            build-command: echo "APP_VARIANT=production" >> "$GITHUB_ENV"
            publish-env: |
                EXPO_APPLE_TEAM_ID=3R8589YV24
                EXPO_APPLE_TEAM_TYPE=INDIVIDUAL
                EXPO_USE_PRECOMPILED_MODULES=1
                RCT_USE_PREBUILT_RNCORE=1
                RCT_USE_RN_DEP=1
            ios-pre-submit-command: |
                {
                  echo "$HOME/.rbenv/shims"
                  echo "/opt/homebrew/bin"
                  echo "/opt/homebrew/sbin"
                } >> "$GITHUB_PATH"
                export PATH="$HOME/.rbenv/shims:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
                pod --version
                fastlane --version
                fastlane store_preflight

                if [ -d /Applications/Xcode_26.4.1.app ]; then
                  xcode_app=/Applications/Xcode_26.4.1.app
                elif [ -d /Applications/Xcode.app ]; then
                  xcode_app=/Applications/Xcode.app
                else
                  echo "::error::Xcode is not installed on this runner."
                  find /Applications -maxdepth 1 -iname '*xcode*' -print
                  exit 1
                fi
                xcodebuild -version

                echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"
            ios-post-submit-command: |
                node scripts/generate-store-release-notes.ts --check

                asc_api_key_path="$(pwd)/asc_api_key.p8"
                EXPO_ASC_API_KEY_PATH="$asc_api_key_path" \
                  EXPO_ASC_KEY_ID=LD57UK43J9 \
                  EXPO_ASC_ISSUER_ID=76e76b40-770a-4a81-bcdc-1f8346aeed02 \
                  fastlane ios ios_metadata

                if [ "${{ inputs.push_screenshots }}" = "true" ]; then
                  EXPO_ASC_API_KEY_PATH="$asc_api_key_path" \
                    EXPO_ASC_KEY_ID=LD57UK43J9 \
                    EXPO_ASC_ISSUER_ID=76e76b40-770a-4a81-bcdc-1f8346aeed02 \
                    fastlane ios ios_screenshots
                fi
            android-pre-submit-command: |
                {
                  echo "$HOME/.rbenv/shims"
                  echo "/opt/homebrew/bin"
                  echo "/opt/homebrew/sbin"
                } >> "$GITHUB_PATH"
                export PATH="$HOME/.rbenv/shims:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
                fastlane --version
                fastlane store_preflight

                android_sdk_root=/Users/admin/Library/Android/sdk
                test -x "$android_sdk_root/platform-tools/adb" || {
                  echo "::error::The guest image lacks the Android SDK; rebuild the base with prewarm-android-buildsdk-macos.sh."
                  exit 1
                }
                {
                  echo "ANDROID_SDK_ROOT=$android_sdk_root"
                  echo "ANDROID_HOME=$android_sdk_root"
                  echo "JAVA_HOME=/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home"
                } >> "$GITHUB_ENV"
            android-post-submit-command: |
                node scripts/generate-store-release-notes.ts --check

                google_service_account_key_path="$RUNNER_TEMP/android-publish/google-service-account.json"
                GOOGLE_SERVICE_ACCOUNT_KEY_PATH="$google_service_account_key_path" fastlane android android_metadata

                if [ "${{ inputs.push_screenshots }}" = "true" ]; then
                  GOOGLE_SERVICE_ACCOUNT_KEY_PATH="$google_service_account_key_path" fastlane android android_screenshots
                fi
        secrets:
            EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
            ASC_API_KEY: ${{ secrets.EXPO_IOS_ASC_API_KEY }}
            GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
