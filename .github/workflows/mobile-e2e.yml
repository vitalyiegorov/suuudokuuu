name: Android Emulator Benchmark

on:
    workflow_dispatch:
        inputs:
            image-target:
                description: Android 34 system image target
                type: choice
                required: true
                default: google_apis
                options:
                    - google_apis
                    - google_atd
                    - aosp_atd
            worker-envelope:
                description: Benchmark runner cgroup envelope
                type: choice
                required: true
                default: 4x8
                options:
                    - 4x8
                    - 4x6
                    - 2x6
                    - 2x4
            test-scope:
                description: Maestro flows to run
                type: choice
                required: true
                default: compatibility
                options:
                    - compatibility
                    - full

permissions:
    contents: read
    actions: read

jobs:
    android-benchmark:
        name: Android emulator benchmark
        runs-on: [self-hosted, trf-linux-amd64-4x8]
        timeout-minutes: 60
        env:
            ANDROID_AVD_HOME: /tmp/android-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
            JAVA_TOOL_OPTIONS: -Xmx2g
        steps:
            - name: Gate worker envelope
              shell: bash
              env:
                  ENVELOPE_CHOICE: ${{ inputs.worker-envelope }}
                  RUN_ID: ${{ github.run_id }}
                  RUN_ATTEMPT: ${{ github.run_attempt }}
                  HEAD_SHA: ${{ github.sha }}
                  REPOSITORY: ${{ github.repository }}
                  RUNNER_NAME: ${{ runner.name }}
              run: |
                  set -euo pipefail
                  python3 - <<'ENVELOPE_PY'
                  import json
                  import os
                  import signal
                  import sys
                  import time
                  from pathlib import Path

                  limits = {
                      '4x8': (4, 8 * 1024**3),
                      '4x6': (4, 6 * 1024**3),
                      '2x6': (2, 6 * 1024**3),
                      '2x4': (2, 4 * 1024**3),
                  }

                  def fail(message):
                      print(f'::error::{message}', file=sys.stderr)
                      raise SystemExit(1)

                  def actual_limits():
                      try:
                          quota, period = Path('/sys/fs/cgroup/cpu.max').read_text().split()
                          memory = Path('/sys/fs/cgroup/memory.max').read_text().strip()
                          swap = Path('/sys/fs/cgroup/memory.swap.max').read_text().strip()
                          memory_bytes = int(memory)
                          if quota == 'max':
                              fail('Runner CPU limit is unbounded')
                          quota_value, period_value = int(quota), int(period)
                      except (OSError, ValueError, ZeroDivisionError) as error:
                          fail(f'Could not read bounded cgroup-v2 CPU/memory limits: {error}')
                      if quota_value <= 0 or period_value <= 0 or quota_value % period_value or memory_bytes <= 0 or swap != '0':
                          fail('Runner cgroup-v2 limits are invalid or not integer CPU limits')
                      return quota_value // period_value, memory_bytes

                  choice = os.environ['ENVELOPE_CHOICE']
                  if choice not in limits:
                      fail('Unsupported worker-envelope choice')
                  expected = limits[choice]
                  if choice == '4x8':
                      if actual_limits() != expected:
                          fail('Default 4x8 runner cgroup does not match 4 CPU / 8 GiB')
                      with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                          summary.write('Worker envelope verified: 4 CPU / 8 GiB (no mutation requested).\n')
                      raise SystemExit(0)

                  runner_temp = Path(os.environ['RUNNER_TEMP'])
                  request_path = runner_temp / 'android-benchmark-envelope-request.json'
                  confirmation_path = runner_temp / 'android-benchmark-envelope-confirmation.json'
                  runner_temp.mkdir(parents=True, exist_ok=True)
                  if request_path.exists():
                      try:
                          previous = json.loads(request_path.read_text(encoding='utf-8'))
                      except (OSError, json.JSONDecodeError) as error:
                          fail(f'Existing envelope request is invalid: {error}')
                      if previous.get('phase') not in ('released', 'expired'):
                          fail('An earlier worker-envelope request is still active')
                      request_path.unlink()
                      confirmation_path.unlink(missing_ok=True)
                  elif confirmation_path.exists():
                      fail('An orphaned worker-envelope confirmation exists')

                  request = {
                      'schema': 1,
                      'phase': 'waiting',
                      'repo': os.environ['REPOSITORY'],
                      'run_id': int(os.environ['RUN_ID']),
                      'attempt': int(os.environ['RUN_ATTEMPT']),
                      'head_sha': os.environ['HEAD_SHA'],
                      'runner_name': os.environ['RUNNER_NAME'],
                      'target': choice,
                      'cpus': expected[0],
                      'memory_bytes': expected[1],
                      'deadline_epoch': time.time() + 180,
                  }

                  def write_request():
                      temporary = request_path.with_name('.android-benchmark-envelope-request.json.tmp')
                      temporary.write_text(json.dumps(request, sort_keys=True) + '\n', encoding='utf-8')
                      temporary.replace(request_path)

                  def expire(message):
                      request['phase'] = 'expired'
                      write_request()
                      fail(message)

                  def on_cancel(_signum, _frame):
                      expire('Worker-envelope wait was cancelled')

                  signal.signal(signal.SIGTERM, on_cancel)
                  signal.signal(signal.SIGINT, on_cancel)
                  write_request()
                  deadline = time.monotonic() + 180
                  while time.monotonic() < deadline:
                      if confirmation_path.is_file() and not confirmation_path.is_symlink():
                          try:
                              confirmation = json.loads(confirmation_path.read_text(encoding='utf-8'))
                          except (OSError, json.JSONDecodeError) as error:
                              expire(f'Worker-envelope confirmation is invalid: {error}')
                          fields = ('schema', 'repo', 'run_id', 'attempt', 'head_sha', 'runner_name', 'target', 'cpus', 'memory_bytes')
                          if not isinstance(confirmation, dict) or any(confirmation.get(key) != request[key] for key in fields):
                              expire('Worker-envelope confirmation does not match this run and target')
                          container_id = confirmation.get('container_id')
                          if not isinstance(container_id, str) or len(container_id) != 64 or any(ch not in '0123456789abcdefABCDEF' for ch in container_id):
                              expire('Worker-envelope confirmation has no valid immutable container id')
                          if not confirmation.get('container_name'):
                              expire('Worker-envelope confirmation has no container name')
                          if confirmation.get('actual_cpus') != expected[0] or confirmation.get('actual_memory_bytes') != expected[1]:
                              expire('Worker-envelope helper did not confirm target cgroup limits')
                          if actual_limits() != expected:
                              expire('Actual runner cgroup limits do not match the confirmed envelope')
                          request['phase'] = 'released'
                          write_request()
                          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                              summary.write(f'Worker envelope verified: {expected[0]} CPU / {expected[1] // 1024**3} GiB.\n')
                          raise SystemExit(0)
                      time.sleep(1)
                  expire('Timed out waiting 180 seconds for matching worker-envelope confirmation')
                  ENVELOPE_PY

            - name: Checkout benchmark harness
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1
                  persist-credentials: false

            - name: Download accepted E2E APK
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  artifact-ids: 12105604104
                  run-id: 39047053473
                  github-token: ${{ github.token }}
                  path: benchmark-apk

            - name: Validate APK and record its digest
              shell: bash
              run: |
                  set -euo pipefail
                  mapfile -d '' apks < <(find benchmark-apk -type f -name '*.apk' -print0)
                  if [ "${#apks[@]}" -ne 1 ]; then
                    echo "::error::Expected exactly one APK, found ${#apks[@]}"
                    exit 1
                  fi
                  mkdir -p benchmark-evidence
                  apk_path="${apks[0]}"
                  if [ "$apk_path" != benchmark-apk/app.apk ]; then
                    cp "$apk_path" benchmark-apk/app.apk
                  fi
                  apk_path=benchmark-apk/app.apk
                  printf '%s\n' "$apk_path" > benchmark-evidence/apk-path.txt
                  apk_sha256="$(sha256sum "$apk_path" | cut -d ' ' -f 1)"
                  printf '%s  %s\n' "$apk_sha256" "$apk_path" | tee benchmark-evidence/apk-sha256.txt
                  {
                    printf 'apk_path=%s\n' "$apk_path"
                    printf 'apk_sha256=%s\n' "$apk_sha256"
                    printf 'artifact_id=12105604104\nsource_run_id=39047053473\n'
                  } > benchmark-evidence/apk-metadata.txt
                  {
                    printf '## Android benchmark inputs\n\n'
                    printf -- '- APK SHA-256: %s\n' "$apk_sha256"
                    printf -- '- Source artifact: 12105604104 from run 39047053473\n'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Install selected Android system image and record runner limits
              shell: bash
              env:
                  IMAGE_TARGET: ${{ inputs.image-target }}
                  TEST_SCOPE: ${{ inputs.test-scope }}
              run: |
                  set -euo pipefail
                  sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
                  if [ -z "$sdk_root" ] || [ ! -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager" ]; then
                    echo "::error::Android SDK with cmdline-tools/latest/bin/sdkmanager is required"
                    exit 1
                  fi
                  sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
                  image_package="system-images;android-34;${IMAGE_TARGET};x86_64"
                  case "$IMAGE_TARGET" in
                    google_apis) expected_revision=14 ;;
                    google_atd) expected_revision=1 ;;
                    aosp_atd) expected_revision=2 ;;
                    *) echo "::error::Unsupported system image target: $IMAGE_TARGET"; exit 1 ;;
                  esac
                  image_directory="$sdk_root/system-images/android-34/$IMAGE_TARGET/x86_64"
                  if [ ! -f "$image_directory/source.properties" ]; then
                    "$sdkmanager" --install "$image_package"
                  fi
                  if [ ! -f "$image_directory/source.properties" ]; then
                    echo "::error::Requested system image is unavailable after installation: $image_directory"
                    exit 1
                  fi
                  mkdir -p benchmark-evidence/metadata
                  cp "$image_directory/source.properties" benchmark-evidence/metadata/image-source.properties
                  if [ ! -f "$image_directory/package.xml" ]; then
                    echo "::error::Installed system image has no package.xml: $image_directory"
                    exit 1
                  fi
                  cp "$image_directory/package.xml" benchmark-evidence/metadata/image-package.xml
                  actual_revision="$(python3 -c 'import sys, xml.etree.ElementTree as ET; root=ET.parse(sys.argv[1]).getroot(); node=next((item for item in root.iter() if item.tag.rsplit("}", 1)[-1] == "major"), None); print((node.text or "") if node is not None else "")' "$image_directory/package.xml")"
                  if [ "$actual_revision" != "$expected_revision" ]; then
                    echo "::error::System image package.xml revision drift: expected $expected_revision, got $actual_revision"
                    exit 1
                  fi
                  system_image="$image_directory/system.img"
                  if [ ! -f "$system_image" ]; then
                    echo "::error::System image payload missing: $system_image"
                    exit 1
                  fi
                  sha256sum "$system_image" > benchmark-evidence/metadata/system-image-sha256.txt
                  emulator_bin="$sdk_root/emulator/emulator"
                  if [ ! -x "$emulator_bin" ]; then
                    echo "::error::Android emulator binary missing: $emulator_bin"
                    exit 1
                  fi
                  "$emulator_bin" -version > benchmark-evidence/metadata/emulator-version.txt 2>&1
                  java -XshowSettings:vm -version > benchmark-evidence/metadata/java-vm-settings.txt 2>&1
                  {
                    printf 'recorded_at_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                    printf 'image_package=%s\n' "$image_package"
                    printf 'image_directory=%s\n' "$image_directory"
                    printf 'image_revision=%s\nexpected_image_revision=%s\n' "$actual_revision" "$expected_revision"
                    printf 'api_level=34\narch=x86_64\nprofile=Nexus 4\nram_mb=2048\ncores=2\n'
                    printf 'test_scope=%s\n' "$TEST_SCOPE"
                    printf 'kernel='; uname -a
                    printf '\nself_cgroup:\n'; cat /proc/self/cgroup
                    printf '\nself_limits:\n'
                    for file in /sys/fs/cgroup/memory.max /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.swap.max; do
                      if [ -r "$file" ]; then printf '%s=' "$file"; cat "$file"; fi
                    done
                  } > benchmark-evidence/metadata/runner-and-image.txt
                  {
                    printf -- '- Android image: %s\n' "$image_package"
                    printf -- '- Test scope: %s\n\n' "$TEST_SCOPE"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Validate harness revision and cold AVD state
              shell: bash
              env:
                  APP_BASELINE: c2d9f16137596940d997e686b171f48f57d77560
              run: |
                  set -euo pipefail
                  git fetch --no-tags --depth=1 origin "$APP_BASELINE"
                  if ! git diff --quiet "$APP_BASELINE" HEAD -- packages tests/app-tests \
                    ':(exclude)tests/app-tests/scripts/android-benchmark-collect.py' \
                    ':(exclude)tests/app-tests/scripts/android-benchmark-collect_test.py'; then
                    echo "::error::App and flow harness differ from accepted baseline $APP_BASELINE outside the benchmark collector scripts"
                    git diff --stat "$APP_BASELINE" HEAD -- packages tests/app-tests \
                      ':(exclude)tests/app-tests/scripts/android-benchmark-collect.py' \
                      ':(exclude)tests/app-tests/scripts/android-benchmark-collect_test.py'
                    exit 1
                  fi
                  revision="$(git rev-parse HEAD)"
                  mkdir -p benchmark-evidence/metadata
                  {
                    printf 'harness_revision=%s\napp_baseline=%s\n' "$revision" "$APP_BASELINE"
                    printf 'checked_at_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  } > benchmark-evidence/metadata/revision-validation.txt
                  avd_home="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
                  if [ -e "$avd_home/test.avd" ] || [ -e "$avd_home/test.ini" ]; then
                    echo "::error::Default AVD 'test' already exists; refusing to mix snapshot or persisted AVD state into this run"
                    exit 1
                  fi
                  printf 'avd_home=%s\navd_name=test\nexisting_default_avd=false\n' "$avd_home" > benchmark-evidence/metadata/cold-avd-check.txt

            - name: Start resource collector
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p benchmark-evidence
                  collector="$(pwd)/tests/app-tests/scripts/android-benchmark-collect.py"
                  output="$(pwd)/benchmark-evidence/resources.jsonl"
                  stop_file="$(pwd)/benchmark-evidence/collector.stop"
                  log="$(pwd)/benchmark-evidence/collector.log"
                  rm -f "$stop_file" "$output" "${output%.jsonl}.status.json" "$log"
                  nohup python3 "$collector" --output "$output" --stop-file "$stop_file" --duration 3300 --interval 1 > "$log" 2>&1 < /dev/null &
                  collector_pid=$!
                  printf '%s\n' "$collector_pid" > benchmark-evidence/collector.pid
                  sleep 2
                  if ! kill -0 "$collector_pid" 2>/dev/null || ! tr '\0' ' ' < "/proc/$collector_pid/cmdline" | grep -F -- "$collector" >/dev/null; then
                    cat "$log"
                    echo "::error::Resource collector failed to start"
                    exit 1
                  fi
                  printf 'collector_started_at_utc=%s\ncollector_pid=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$collector_pid" > benchmark-evidence/metadata/collector-start.txt

            - name: Run Android Maestro benchmark
              id: maestro
              uses: rnw-community/mobile-ci/actions/run-maestro-android@v4.0.0 # v4.0.0
              with:
                  apk-path: benchmark-apk/app.apk
                  app-id: com.vitaliiyehorov.suuudokuuu.e2e
                  flows-dir: tests/app-tests/flows
                  flows-max-depth: '1'
                  flows-name-pattern: ${{ inputs.test-scope == 'full' && '*.flow.yaml' || '06.resume-game.flow.yaml 07.background-foreground-game.flow.yaml 10.themes-screen.flow.yaml 24.store-intent-landing.flow.yaml' }}
                  shard-index: '0'
                  shard-count: '1'
                  pre-run-flow: tests/app-tests/flows/setup/prime-deep-links.flow.yaml
                  flow-recovery-flow: tests/app-tests/flows/setup/recover-after-failed-flow.flow.yaml
                  pre-test-command: |
                      set -euo pipefail
                      mkdir -p benchmark-evidence/metadata
                      {
                        printf 'capability_capture_at_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                        printf 'app_id=%s\n' "$APP_ID"
                        printf '\npackages:\n'
                        timeout 15s adb -s "$ANDROID_SERIAL" shell pm list packages "$APP_ID"
                        printf '\nlauncher_resolution:\n'
                        timeout 15s adb -s "$ANDROID_SERIAL" shell cmd package resolve-activity --brief "$APP_ID"
                        printf '\nbuild_fingerprint:\n'
                        timeout 15s adb -s "$ANDROID_SERIAL" shell getprop ro.build.fingerprint
                        printf '\nwindow_size:\n'
                        timeout 15s adb -s "$ANDROID_SERIAL" shell wm size
                        printf '\nwindow_density:\n'
                        timeout 15s adb -s "$ANDROID_SERIAL" shell wm density
                      } > benchmark-evidence/metadata/device-capabilities.txt
                  pre-flow-command: tests/app-tests/scripts/seed-flow-fixture.sh
                  maestro-config: tests/app-tests/config.yaml
                  flow-retries: '1'
                  maestro-version: '2.6.1'
                  api-level: '34'
                  target: ${{ inputs.image-target }}
                  arch: x86_64
                  profile: Nexus 4
                  ram-size: '2048'
                  cores: '2'
                  emulator-slots-dir: /var/lib/mobile-ci/emulator-slots
                  shard-manifest-dir: ''
                  artifacts-dir: benchmark-evidence/maestro
                  artifact-name: android-emulator-benchmark-maestro
                  retention-days: '7'

            - name: Record benchmark phase end
              if: always()
              shell: bash
              env:
                  ACTION_OUTCOME: ${{ steps.maestro.outcome }}
              run: |
                  mkdir -p benchmark-evidence/metadata
                  printf 'maestro_finished_at_utc=%s\nmaestro_outcome=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$ACTION_OUTCOME" > benchmark-evidence/metadata/maestro-finish.txt

            - name: Stop resource collector
              if: always()
              shell: bash
              run: |
                  set -euo pipefail
                  stop_file="$(pwd)/benchmark-evidence/collector.stop"
                  output="$(pwd)/benchmark-evidence/resources.jsonl"
                  log="$(pwd)/benchmark-evidence/collector.log"
                  pid_file="benchmark-evidence/collector.pid"
                  if [ ! -f "$pid_file" ]; then
                    echo "::error::Collector PID file is missing"
                    exit 1
                  fi
                  collector_pid="$(cat "$pid_file")"
                  case "$collector_pid" in
                    ''|*[!0-9]*) echo "::error::Invalid collector PID"; exit 1 ;;
                  esac
                  touch "$stop_file"
                  if kill -0 "$collector_pid" 2>/dev/null; then
                    if ! tr '\0' ' ' < "/proc/$collector_pid/cmdline" | grep -F -- "$(pwd)/tests/app-tests/scripts/android-benchmark-collect.py" >/dev/null; then
                      echo "::error::Refusing to signal an unverified collector PID"
                      exit 1
                    fi
                    exited=false
                    for _ in $(seq 1 30); do
                      if ! kill -0 "$collector_pid" 2>/dev/null; then exited=true; break; fi
                      sleep 1
                    done
                    if [ "$exited" != true ]; then
                      echo "::error::Resource collector did not exit after stop-file request"
                      exit 1
                    fi
                  fi
                  status="$(pwd)/benchmark-evidence/resources.status.json"
                  if [ ! -s "$output" ] || [ ! -s "$status" ]; then
                    cat "$log" 2>/dev/null || true
                    echo "::error::Resource collector samples or status file are missing/empty"
                    exit 1
                  fi
                  python3 - "$status" <<'STATUS_PY'
                  import json
                  import sys
                  from pathlib import Path

                  status = json.loads(Path(sys.argv[1]).read_text())
                  if status.get('exit_code') != 0 or status.get('stop_reason') != 'stop_file' or status.get('samples', 0) < 1:
                      raise SystemExit(f"collector did not stop cleanly on request: {status!r}")
                  STATUS_PY
                  if grep -q 'android-benchmark-collect:' "$log"; then
                    cat "$log"
                    echo "::error::Resource collector reported an error"
                    exit 1
                  fi
                  printf 'collector_stopped_at_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > benchmark-evidence/metadata/collector-stop.txt

            - name: Upload benchmark evidence
              if: always()
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: android-emulator-benchmark-evidence
                  path: benchmark-evidence
                  if-no-files-found: error
                  retention-days: 7
