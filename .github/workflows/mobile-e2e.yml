name: Mobile E2E

# iOS and Android each run as an independent rnw-community/mobile-ci reusable
# pipeline (detect -> plan -> build -> test -> status), so the build-before-test
# ordering the fleet needs is enforced inside each pipeline instead of by a
# shared build workflow here.
#
# From mobile-ci v3 the normal outcome of a pull request is that NOTHING
# compiles native code. The plan job computes the target's native key on the
# x86_64 Linux pool, fetches the base binary published for that key from GHCR,
# repacks it with this commit's JavaScript, and hands the result to the Maestro
# shards. Only a key with no published base reaches the macOS builder or
# Gradle - and when that happens on main, the binary it produces is published
# as the base for the next run. seed-native-cache.yml is the warm-up that keeps
# that from ever being a pull request's problem.
#
# iOS still belongs to the Macs when it does build: the single `macos-builder`
# VM, with its Maestro shards on `macos-maestro`. Android has left them
# entirely - both its APK build and its Maestro run happen on node-b's x86_64
# Linux `trf-linux-amd64-4x8` containers, against a KVM-accelerated Google AVD.
on:
    workflow_call:
    workflow_dispatch:
    push:
        branches: [main]
        # The app's dependency closure: every workspace package except the two
        # only the website uses (landing, field-dom), the Maestro suite and its
        # test-kit, and the root inputs every build reads. Negations keep a new
        # package in by default - an over-wide filter costs one run, a missed
        # path ships an untested app. Docs, reports and agent files never run it.
        paths:
            - 'packages/**'
            - '!packages/landing/**'
            - '!packages/field-dom/**'
            - 'tests/app-tests/**'
            - 'tests/test-kit/**'
            - 'patches/**'
            - 'types/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'tsconfig*.json'
            - 'turbo.json'
            - '.github/workflows/mobile-e2e.yml'

permissions:
    contents: read

concurrency:
    group: mobile-e2e-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    ios:
        name: iOS Maestro E2E
        # A reusable workflow can only narrow the token its caller grants, never
        # widen it. Without these three scopes the plan job cannot read the base
        # binary and a main run cannot publish one, so every run silently falls
        # back to a full native build. pr.yml grants the same three on the job
        # that calls this workflow - both levels are required.
        permissions:
            contents: read
            packages: write
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/ios-maestro.yml@d53b2b9aaffd398735fb176c12f172bac7d8ec72 # ci/diagnose-node-exec-failure
        with:
            install-command: pnpm install --frozen-lockfile
            # Gate pull requests on the turbo graph: Maestro runs only when the
            # app, its workspace dependencies or the Maestro suite changed, so a
            # landing-only PR does not wait on the Macs. Non-PR events still
            # always run (mobile-ci forces always-affected off pull_request).
            exempt-paths: |
                docs/**
                **/*.md
            target-packages: |
                @suuudokuuu/app
                @suuudokuuu/app-tests
            targets: >-
                [{"name":"e2e","appDir":"packages/app","workspace":"suuudokuuuE2E.xcworkspace","scheme":"suuudokuuuE2E","appId":"com.vitalyiegorov.suuudokuuu.e2e","prebuildCommand":"npx expo prebuild -p ios --clean --no-install"}]
            flows-dir: tests/app-tests/flows
            pre-run-flow: tests/app-tests/flows/setup/prime-deep-links.flow.yaml
            maestro-config: tests/app-tests/config.yaml
            flow-recovery-flow: tests/app-tests/flows/setup/recover-after-failed-flow.flow.yaml
            pre-flow-command: tests/app-tests/scripts/seed-flow-fixture.sh
            flow-retries: 1
            shard-count: 1
            pre-test-command: echo "Intentional failure to verify Node diagnostics"; exit 1
            shard-manifest-dir: tests/app-tests/shards
            simulator-device: iPhone 17 Pro
            simulator-reduce-motion: 'true'
            xcode-version: '26.4.1'
            xcode-build: '17E202'
            build-runner-labels: '["self-hosted","macOS","ARM64","macos-builder"]'
            test-runner-labels: '["self-hosted","macOS","ARM64","macos-maestro"]'
            rct-use-prebuilt-rncore: true
            rct-use-rn-dep: true
            # app.config.js branches on APP_VARIANT for the app name, the bundle
            # identifier and updates.enabled, so the fingerprint has to be taken
            # with exactly the variable the build exports - a key computed under
            # a different environment describes a native surface no build
            # produces. This block is byte-identical to seed-native-cache.yml's,
            # which is the only way the warm-up and this workflow address the
            # same base.
            fingerprint-env: |
                APP_VARIANT=e2e
            # Exported for the re-bundle, so the repacked binary's embedded
            # app.config carries the e2e identity rather than the production one.
            repack-env: |
                APP_VARIANT=e2e
            # Every identity value the repack rewrites, asserted. A config
            # rewrite nobody checked is a repack nobody can trust.
            expect-config: |
                name=suuudokuuu (E2E)
                ios.bundleIdentifier=com.vitalyiegorov.suuudokuuu.e2e
            build-env: |
                APP_VARIANT=e2e
            build-strategy: repack
