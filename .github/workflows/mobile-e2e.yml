name: Mobile E2E

# iOS and Android each run as an independent rnw-community/mobile-ci reusable
# pipeline (detect -> plan -> build -> test -> status), so the build-before-test
# ordering the fleet needs is enforced inside each pipeline instead of by a
# shared build workflow here.
#
# From mobile-ci v3 the normal outcome of a pull request is that NOTHING
# compiles native code. The plan job computes the target's native key on the
# x86_64 Linux pool, fetches the base binary published for that key from GHCR,
# repacks it with this commit's JavaScript, and hands the result to the test
# job. Only a key with no published base reaches the macOS builder or
# Gradle - and when that happens on main, the binary it produces is published
# as the base for the next run. seed-native-cache.yml is the warm-up that keeps
# that from ever being a pull request's problem.
#
# Both platforms run one tester-army e2e suite (e2e/) from Linux against
# devices leased from the simlock farm: iOS simulators and arm64 Android
# emulators. A native build, when one is needed, runs on the 4 CPU/7 GB
# `macos-maestro` VMs for iOS and on node-b's `trf-linux-amd64-4x8`
# containers for Android.
on:
    workflow_call:
        secrets:
            SIMLOCK_TOKEN:
                required: true
    workflow_dispatch:
    push:
        branches: [main]
        # The app's dependency closure: every workspace package except the two
        # only the website uses (landing, field-dom), the e2e suite and its fixtures, the
        # test-kit, and the root inputs every build reads. Negations keep a new
        # package in by default - an over-wide filter costs one run, a missed
        # path ships an untested app. Docs, reports and agent files never run it.
        paths:
            - 'packages/**'
            - '!packages/landing/**'
            - '!packages/field-dom/**'
            - 'tests/app-tests/**'
            - 'tests/test-kit/**'
            - 'e2e/**'
            - 'patches/**'
            - 'types/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'tsconfig*.json'
            - 'turbo.json'
            - '.github/workflows/mobile-e2e.yml'

permissions:
    contents: read

concurrency:
    group: mobile-e2e-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    ios:
        name: iOS E2E
        # A reusable workflow can only narrow the token its caller grants, never
        # widen it. Without these three scopes the plan job cannot read the base
        # binary and a main run cannot publish one, so every run silently falls
        # back to a full native build. pr.yml grants the same three on the job
        # that calls this workflow - both levels are required.
        permissions:
            contents: read
            packages: write
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/ios-maestro.yml@7ee29bef4965a29e10f20396ec7b56da15218f45 # v4.11.0
        with:
            control-runner-labels: '["self-hosted","linux-portable-2x4"]'
            install-command: pnpm install --frozen-lockfile
            # Gate pull requests on the turbo graph: the suite runs only when the
            # app, its workspace dependencies or the e2e suite changed, so a
            # landing-only PR does not wait on the farm. Non-PR events still
            # always run (mobile-ci forces always-affected off pull_request).
            exempt-paths: |
                docs/**
                **/*.md
            trigger-paths: |
                .github/workflows/mobile-e2e.yml
                .github/workflows/pr.yml
                patches/**
                e2e/**
            target-packages: |
                @suuudokuuu/app
                @suuudokuuu/app-tests
            targets: >-
                [{"name":"e2e","appDir":"packages/app","workspace":"suuudokuuuE2E.xcworkspace","scheme":"suuudokuuuE2E","appId":"com.vitalyiegorov.suuudokuuu.e2e","prebuildCommand":"npx expo prebuild -p ios --clean --no-install"}]
            xcode-version: '26.4.1'
            xcode-build: '17E202'
            build-runner-labels: '["self-hosted","macOS","ARM64","macos-maestro"]'
            rct-use-prebuilt-rncore: true
            rct-use-rn-dep: true
            # app.config.js branches on APP_VARIANT for the app name, the bundle
            # identifier and updates.enabled, so the fingerprint has to be taken
            # with exactly the variable the build exports - a key computed under
            # a different environment describes a native surface no build
            # produces. This block is byte-identical to seed-native-cache.yml's,
            # which is the only way the warm-up and this workflow address the
            # same base.
            fingerprint-env: |
                APP_VARIANT=e2e
            # Exported for the re-bundle, so the repacked binary's embedded
            # app.config carries the e2e identity rather than the production one.
            repack-env: |
                APP_VARIANT=e2e
            # Every identity value the repack rewrites, asserted. A config
            # rewrite nobody checked is a repack nobody can trust.
            expect-config: |
                name=suuudokuuu (E2E)
                ios.bundleIdentifier=com.vitalyiegorov.suuudokuuu.e2e
            build-env: |
                APP_VARIANT=e2e
            # The tester-army e2e suite (e2e/), run from Linux against simulators
            # leased from the Mac Studio simlock farm: no macOS test runner is used.
            test-framework: e2e
            e2e-dir: e2e
            e2e-runner-labels: '["self-hosted","linux-portable-4x8"]'
            e2e-workers: '8'
            e2e-retries: '1'
            e2e-timeout-minutes: 45
            # The public gateway: only one Linux host shares the farm's LAN.
            simlock-url: https://simlock.vitaliiyehorov.dev
        secrets:
            simlock-token: ${{ secrets.SIMLOCK_TOKEN }}

    android:
        name: Android E2E
        permissions:
            contents: read
            packages: write
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/android-maestro.yml@7ee29bef4965a29e10f20396ec7b56da15218f45 # v4.11.0
        with:
            control-runner-labels: '["self-hosted","linux-portable-2x4"]'
            install-command: pnpm install --frozen-lockfile
            exempt-paths: |
                docs/**
                **/*.md
            trigger-paths: |
                .github/workflows/mobile-e2e.yml
                .github/workflows/pr.yml
                patches/**
                e2e/**
            target-packages: |
                @suuudokuuu/app
                @suuudokuuu/app-tests
            targets: >-
                [{"name":"e2e","appDir":"packages/app","appId":"com.vitaliiyehorov.suuudokuuu.e2e","prebuildCommand":"npx expo prebuild -p android --clean --no-install"}]
            # The APK builds on Linux, and 8 GiB is what keeps D8 from being OOM-killed.
            build-runner-labels: '["self-hosted","trf-linux-amd64-4x8"]'
            gradle-task: ':app:assembleRelease'
            gradle-args: '-x lint -x lintVitalAnalyzeRelease -x lintAnalyzeRelease'
            # The farm's emulators are arm64-v8a. Part of the native key, so
            # seed-native-cache.yml builds the same ABI.
            android-abis: arm64-v8a
            # Byte-identical to the iOS lane above and to seed-native-cache.yml.
            fingerprint-env: |
                APP_VARIANT=e2e
            repack-env: |
                APP_VARIANT=e2e
            expect-config: |
                name=suuudokuuu (E2E)
                android.package=com.vitaliiyehorov.suuudokuuu.e2e
            build-env: |
                APP_VARIANT=e2e
            # The same e2e suite as iOS, against Pixel 6 emulators leased from
            # the simlock farm.
            test-framework: e2e
            e2e-dir: e2e
            e2e-runner-labels: '["self-hosted","linux-portable-4x8"]'
            e2e-workers: '2'
            e2e-retries: '1'
            e2e-timeout-minutes: 45
            simlock-url: https://simlock.vitaliiyehorov.dev
        secrets:
            simlock-token: ${{ secrets.SIMLOCK_TOKEN }}

    android-capture-smoke:
        name: Android store capture smoke
        needs: android
        if: github.event_name == 'workflow_dispatch'
        runs-on: [self-hosted, trf-linux-amd64-4x8]
        timeout-minutes: 45
        permissions:
            contents: read
            actions: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.x
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: android-e2e-app-e2e
                  path: .ci-artifacts/android-e2e-app-e2e

            - run: sudo apt-get update && sudo apt-get -o DPkg::Lock::Timeout=300 install -y imagemagick

            - name: Start the Android capture emulator
              id: emulator
              uses: rnw-community/mobile-ci/actions/android-emulator@7ee29bef4965a29e10f20396ec7b56da15218f45 # v4.11.0
              with:
                  mode: start
                  api-level: 34
                  target: google_apis
                  arch: x86_64
                  profile: Nexus 4
                  avd-name: store-capture-smoke
                  emulator-slots-dir: /var/lib/mobile-ci/emulator-slots

            - name: Capture seeded Android scenes
              shell: bash
              env:
                  ANDROID_SERIAL: ${{ steps.emulator.outputs.android-serial }}
              run: |
                  adb install -r .ci-artifacts/android-e2e-app-e2e/app-release.apk
                  adb shell am start -n com.vitaliiyehorov.suuudokuuu.e2e/.MainActivity
                  sleep 20
                  adb shell am force-stop com.vitaliiyehorov.suuudokuuu.e2e
                  start=$(date +%s); trap 'echo "Capture-only duration: $(($(date +%s) - ${start}))s"' EXIT; timeout 300s pnpm --filter @suuudokuuu/app-tests screenshots:capture --platform=android --serial="$ANDROID_SERIAL" --app-id=com.vitaliiyehorov.suuudokuuu.e2e --locales=en --appearances=dark --scenes=hero-board,hell,themes,editor,rival,replay,settings,home,stats,scoring,history,challenge-live,infinity --status-bar=real --verify --output-dir=artifacts/store-capture-smoke/raw --report-dir=artifacts/store-capture-smoke

            - name: Stop the Android capture emulator
              if: always()
              uses: rnw-community/mobile-ci/actions/android-emulator@7ee29bef4965a29e10f20396ec7b56da15218f45 # v4.11.0
              with:
                  mode: stop

            - name: Upload capture diagnostics
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: android-store-capture-smoke
                  path: tests/app-tests/artifacts/store-capture-smoke
                  if-no-files-found: error
