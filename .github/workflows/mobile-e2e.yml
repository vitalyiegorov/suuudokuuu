name: Mobile CI simulator benchmark

on:
    workflow_dispatch:
        inputs:
            simulator-count:
                description: Simulators per VM (1 for baseline, 2 for experiment)
                type: number
                default: 1
            shard-count:
                description: VMs (2 for baseline, 1 for experiment)
                type: number
                default: 2

permissions:
    contents: read

jobs:
    ios:
        name: Simulator benchmark
        permissions:
            contents: read
            packages: write
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/ios-maestro.yml@f05274f20190706a34d688cc9e7050482f0e0e45 # perf/multi-simulator-lanes
        with:
            install-command: pnpm install --frozen-lockfile
            exempt-paths: 'docs/**

                **/*.md

                '
            target-packages: '@suuudokuuu/app

                @suuudokuuu/app-tests

                '
            targets: '[{"name":"e2e","appDir":"packages/app","workspace":"suuudokuuuE2E.xcworkspace","scheme":"suuudokuuuE2E","appId":"com.vitalyiegorov.suuudokuuu.e2e","prebuildCommand":"npx
                expo prebuild -p ios --clean --no-install"}]'
            flows-dir: tests/app-tests/flows
            pre-run-flow: tests/app-tests/flows/setup/prime-deep-links.flow.yaml
            maestro-config: tests/app-tests/config.yaml
            flow-recovery-flow: tests/app-tests/flows/setup/recover-after-failed-flow.flow.yaml
            pre-flow-command: tests/app-tests/scripts/seed-flow-fixture.sh
            flow-retries: 1
            shard-count: ${{ inputs.shard-count }}
            shard-manifest-dir: ''
            simulator-device: iPhone 17 Pro
            simulator-reduce-motion: 'true'
            xcode-version: 26.4.1
            xcode-build: 17E202
            build-runner-labels: '["self-hosted","macOS","ARM64","macos-builder"]'
            test-runner-labels: '["self-hosted","trf-macos-arm64-6x12"]'
            rct-use-prebuilt-rncore: true
            rct-use-rn-dep: true
            fingerprint-env: 'APP_VARIANT=e2e

                '
            repack-env: 'APP_VARIANT=e2e

                '
            expect-config: 'name=suuudokuuu (E2E)

                ios.bundleIdentifier=com.vitalyiegorov.suuudokuuu.e2e

                '
            build-env: 'APP_VARIANT=e2e

                '
            build-strategy: repack
            simulator-count: ${{ inputs.simulator-count }}
