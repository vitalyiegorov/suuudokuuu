name: Mobile E2E

# iOS and Android each run as an independent rnw-community/mobile-ci reusable
# pipeline (detect -> plan -> build -> test -> status), so the build-before-test
# ordering the fleet needs is enforced inside each pipeline instead of by a
# shared build workflow here.
#
# From mobile-ci v3 the normal outcome of a pull request is that NOTHING
# compiles native code. The plan job computes the target's native key on the
# x86_64 Linux pool, fetches the base binary published for that key from GHCR,
# repacks it with this commit's JavaScript, and hands the result to the Maestro
# shards. Only a key with no published base reaches the macOS builder or
# Gradle - and when that happens on main, the binary it produces is published
# as the base for the next run. seed-native-cache.yml is the warm-up that keeps
# that from ever being a pull request's problem.
#
# iOS still belongs to the Macs when it does build: its native build and its
# Maestro shards both run on the 4 CPU/7 GB `macos-maestro` VMs. Android has left them
# entirely - both its APK build and its Maestro run happen on node-b's x86_64
# Linux `trf-linux-amd64-4x8` containers, against a KVM-accelerated Google AVD.
on:
    workflow_call:
    workflow_dispatch:
    push:
        branches: [main]
        # The app's dependency closure: every workspace package except the two
        # only the website uses (landing, field-dom), the Maestro suite and its
        # test-kit, and the root inputs every build reads. Negations keep a new
        # package in by default - an over-wide filter costs one run, a missed
        # path ships an untested app. Docs, reports and agent files never run it.
        paths:
            - 'packages/**'
            - '!packages/landing/**'
            - '!packages/field-dom/**'
            - 'tests/app-tests/**'
            - 'tests/test-kit/**'
            - 'patches/**'
            - 'types/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'tsconfig*.json'
            - 'turbo.json'
            - '.github/workflows/mobile-e2e.yml'

permissions:
    contents: read

concurrency:
    group: mobile-e2e-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    ios:
        name: iOS Maestro E2E
        # A reusable workflow can only narrow the token its caller grants, never
        # widen it. Without these three scopes the plan job cannot read the base
        # binary and a main run cannot publish one, so every run silently falls
        # back to a full native build. pr.yml grants the same three on the job
        # that calls this workflow - both levels are required.
        permissions:
            contents: read
            packages: write
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/ios-maestro.yml@240cad0f6ba43da17e42f9aefc8637567941cb58 # v4.3.0
        with:
            install-command: pnpm install --frozen-lockfile
            # Gate pull requests on the turbo graph: Maestro runs only when the
            # app, its workspace dependencies or the Maestro suite changed, so a
            # landing-only PR does not wait on the Macs. Non-PR events still
            # always run (mobile-ci forces always-affected off pull_request).
            exempt-paths: |
                docs/**
                **/*.md
            trigger-paths: |
                .github/workflows/mobile-e2e.yml
                .github/workflows/pr.yml
                patches/**
            target-packages: |
                @suuudokuuu/app
                @suuudokuuu/app-tests
            targets: >-
                [{"name":"e2e","appDir":"packages/app","workspace":"suuudokuuuE2E.xcworkspace","scheme":"suuudokuuuE2E","appId":"com.vitalyiegorov.suuudokuuu.e2e","prebuildCommand":"npx expo prebuild -p ios --clean --no-install"}]
            flows-dir: tests/app-tests/flows
            pre-run-flow: tests/app-tests/flows/setup/prime-deep-links.flow.yaml
            maestro-config: tests/app-tests/config.yaml
            flow-recovery-flow: tests/app-tests/flows/setup/recover-after-failed-flow.flow.yaml
            pre-flow-command: tests/app-tests/scripts/seed-flow-fixture.sh
            flow-retries: 1
            shard-count: 2
            shard-manifest-dir: tests/app-tests/shards
            simulator-device: iPhone 17 Pro
            simulator-reduce-motion: 'true'
            xcode-version: '26.4.1'
            xcode-build: '17E202'
            build-runner-labels: '["self-hosted","macOS","ARM64","macos-maestro"]'
            test-runner-labels: '["self-hosted","macOS","ARM64","macos-maestro"]'
            rct-use-prebuilt-rncore: true
            rct-use-rn-dep: true
            # app.config.js branches on APP_VARIANT for the app name, the bundle
            # identifier and updates.enabled, so the fingerprint has to be taken
            # with exactly the variable the build exports - a key computed under
            # a different environment describes a native surface no build
            # produces. This block is byte-identical to seed-native-cache.yml's,
            # which is the only way the warm-up and this workflow address the
            # same base.
            fingerprint-env: |
                APP_VARIANT=e2e
            # Exported for the re-bundle, so the repacked binary's embedded
            # app.config carries the e2e identity rather than the production one.
            repack-env: |
                APP_VARIANT=e2e
            # Every identity value the repack rewrites, asserted. A config
            # rewrite nobody checked is a repack nobody can trust.
            expect-config: |
                name=suuudokuuu (E2E)
                ios.bundleIdentifier=com.vitalyiegorov.suuudokuuu.e2e
            build-env: |
                APP_VARIANT=e2e

    android:
        name: Android Maestro E2E
        permissions:
            contents: read
            packages: write
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/android-maestro.yml@240cad0f6ba43da17e42f9aefc8637567941cb58 # v4.3.0
        with:
            install-command: pnpm install --frozen-lockfile
            # Gate pull requests on the turbo graph: Maestro runs only when the
            # app, its workspace dependencies or the Maestro suite changed, so a
            # landing-only PR does not wait on the Macs. Non-PR events still
            # always run (mobile-ci forces always-affected off pull_request).
            exempt-paths: |
                docs/**
                **/*.md
            trigger-paths: |
                .github/workflows/mobile-e2e.yml
                .github/workflows/pr.yml
                patches/**
            target-packages: |
                @suuudokuuu/app
                @suuudokuuu/app-tests
            targets: >-
                [{"name":"e2e","appDir":"packages/app","appId":"com.vitaliiyehorov.suuudokuuu.e2e","prebuildCommand":"npx expo prebuild -p android --clean --no-install"}]
            flows-dir: tests/app-tests/flows
            pre-run-flow: tests/app-tests/flows/setup/prime-deep-links.flow.yaml
            maestro-config: tests/app-tests/config.yaml
            flow-recovery-flow: tests/app-tests/flows/setup/recover-after-failed-flow.flow.yaml
            pre-flow-command: tests/app-tests/scripts/seed-flow-fixture.sh
            flow-retries: 1
            # One emulator job at a time: node-b budgets 8 CPU / 16 GiB to
            # containers, a `trf-linux-amd64-4x8` container is 4 CPU / 8 GiB, and
            # the AVD alone measured ~4.2 GiB RSS. One emulator shard alongside the
            # APK build is what the host actually fits; a second shard would only
            # queue behind the first while starving both.
            shard-count: 1
            maestro-version: '2.6.1'
            # Both legs on node-b: the APK builds on Linux now (Google does ship an
            # x86_64-linux NDK), and 8 GiB is what keeps D8 from being OOM-killed.
            # The plan/repack job defaults to trf-linux-amd64-2x4 (no KVM, mobile-ci
            # v3.2.0), so it never queues behind emulator shards on this pool.
            build-runner-labels: '["self-hosted","trf-linux-amd64-4x8"]'
            # `trf-linux-amd64-4x8` is the ONLY node-b profile granted /dev/kvm, so
            # this label is a hard requirement of the avd driver, not a preference.
            test-runner-labels: '["self-hosted","trf-linux-amd64-4x8"]'
            # Google's own emulator instead of Redroid. api-level 34 / google_apis /
            # x86_64 are the reusable workflow's defaults and are exactly the system
            # image baked into the runner container, so they stay unset here rather
            # than being restated in two places that could drift apart.
            android-driver: avd
            emulator-slots-dir: /var/lib/mobile-ci/emulator-slots
            # The container is 4 CPU / 8 GiB. Since mobile-ci v3.2.0 the emulator's
            # RAM and cores are derived from the container's cgroup (memory.max
            # 8 GiB -> 2048 MB, cpu.max 4 -> 2 cores), and the fleet injects
            # JAVA_TOOL_OPTIONS=-XX:MaxRAM=8192m so Maestro's JVM sizes its heap
            # from the container rather than the host's 27 GiB. Neither bound is
            # restated here (fleet-validated in run 38692037603).
            # Nexus 4 is 768x1280 @ 320dpi - within a whisker of the 720x1280 @
            # 320dpi Redroid presented, which is the geometry every flow here was
            # calibrated against. pixel_6 (1080x2400 @ 420dpi) is both a
            # different dp viewport and a materially larger software-rendered
            # framebuffer: measured on this runner, the swap costs 450 MB of
            # unreclaimable memory for a device the flows were never written for.
            emulator-profile: Nexus 4
            gradle-task: ':app:assembleRelease'
            # android-abis: auto builds only the AVD's x86_64 ABI. The lint skips
            # stay - lint is a separate PR gate, not this pipeline's job.
            gradle-args: '-x lint -x lintVitalAnalyzeRelease -x lintAnalyzeRelease'
            # Byte-identical to the iOS lane above and to seed-native-cache.yml.
            fingerprint-env: |
                APP_VARIANT=e2e
            repack-env: |
                APP_VARIANT=e2e
            expect-config: |
                name=suuudokuuu (E2E)
                android.package=com.vitaliiyehorov.suuudokuuu.e2e
            # The repacked APK is re-signed with the React Native debug keystore
            # `expo prebuild` ships and Gradle signs its release build with, which
            # is what android-keystore-path already defaults to. The emulator
            # refuses to install a repack signed with anything else, so the
            # defaults are correct here and stay unstated.
            #
            # No JAVA_HOME line: the runner image ships OpenJDK 17 and exports
            # JAVA_HOME itself, unlike the macOS builder this job came from.
            build-env: |
                APP_VARIANT=e2e

    android-capture-smoke:
        name: Android store capture smoke
        needs: android
        if: github.event_name == 'workflow_dispatch'
        runs-on: [self-hosted, trf-linux-amd64-4x8]
        timeout-minutes: 45
        permissions:
            contents: read
            actions: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.x
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: android-e2e-app-e2e
                  path: .ci-artifacts/android-e2e-app-e2e

            - run: sudo apt-get update && sudo apt-get -o DPkg::Lock::Timeout=300 install -y imagemagick

            - name: Start the Android capture emulator
              id: emulator
              uses: rnw-community/mobile-ci/actions/android-emulator@240cad0f6ba43da17e42f9aefc8637567941cb58 # v4.3.0
              with:
                  mode: start
                  api-level: 34
                  target: google_apis
                  arch: x86_64
                  profile: Nexus 4
                  avd-name: store-capture-smoke
                  emulator-slots-dir: /var/lib/mobile-ci/emulator-slots

            - name: Capture seeded Android scenes
              shell: bash
              env:
                  ANDROID_SERIAL: ${{ steps.emulator.outputs.android-serial }}
              run: |
                  adb install -r .ci-artifacts/android-e2e-app-e2e/app-release.apk
                  adb shell am start -n com.vitaliiyehorov.suuudokuuu.e2e/.MainActivity
                  sleep 20
                  adb shell am force-stop com.vitaliiyehorov.suuudokuuu.e2e
                  start=$(date +%s); trap 'echo "Capture-only duration: $(($(date +%s) - ${start}))s"' EXIT; timeout 300s pnpm --filter @suuudokuuu/app-tests screenshots:capture --platform=android --serial="$ANDROID_SERIAL" --app-id=com.vitaliiyehorov.suuudokuuu.e2e --locales=en --appearances=dark --scenes=hero-board,hell,themes,editor,rival,replay,settings,home,stats,scoring,history,challenge-live,infinity --status-bar=real --verify --output-dir=artifacts/store-capture-smoke/raw --report-dir=artifacts/store-capture-smoke

            - name: Stop the Android capture emulator
              if: always()
              uses: rnw-community/mobile-ci/actions/android-emulator@240cad0f6ba43da17e42f9aefc8637567941cb58 # v4.3.0
              with:
                  mode: stop

            - name: Upload capture diagnostics
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: android-store-capture-smoke
                  path: tests/app-tests/artifacts/store-capture-smoke
                  if-no-files-found: error
