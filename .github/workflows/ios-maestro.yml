name: iOS Maestro

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]

env:
  MAESTRO_VERSION: '2.6.1'
  EAS_CLI_VERSION: '20.5.1'
  EXPO_REPACK_VERSION: '0.7.2'
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
  MAESTRO_CLI_NO_ANALYTICS: true
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true

jobs:
  build:
    name: Build embedded iOS E2E app
    runs-on: [self-hosted, macOS, ARM64, macos-builder]
    timeout-minutes: 90
    env:
      APP_VARIANT: e2e
      RCT_USE_PREBUILT_RNCORE: '1'
      RCT_USE_RN_DEP: '1'
      IOS_DERIVED_DATA: ${{ github.workspace }}/.ci-cache/DerivedData/suuudokuuu-e2e
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: ${{ env.EAS_CLI_VERSION }}
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Generate native fingerprint
        id: fingerprint
        working-directory: packages/app
        shell: bash
        run: |
          set -euo pipefail
          eas fingerprint:generate \
            --build-profile e2e \
            --platform ios \
            --json \
            --non-interactive > "$RUNNER_TEMP/ios-fingerprint.json"
          hash=$(jq -er '.hash' "$RUNNER_TEMP/ios-fingerprint.json")
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Native fingerprint: $hash"

      - name: Restore fingerprinted native app
        id: native-app-cache
        uses: actions/cache/restore@v5
        with:
          path: .ci-cache/ios-native-app
          key: ios-native-v2-macos26-suuudokuuu-e2e-${{ runner.os }}-arm64-xcode26_4_1-17E202-${{ steps.fingerprint.outputs.hash }}

      - name: Repack cached native app
        id: repack
        if: steps.native-app-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        working-directory: packages/app
        shell: bash
        run: |
          set -euo pipefail
          output_app="$GITHUB_WORKSPACE/.ci-artifacts/repacked/Suuudokuuu.app"
          mkdir -p "$(dirname "$output_app")"
          source_app=$(find "$GITHUB_WORKSPACE/.ci-cache/ios-native-app" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$source_app"
          npx --yes "@expo/repack-app@$EXPO_REPACK_VERSION" . \
            --platform ios \
            --source-app "$source_app" \
            --output "$output_app" \
            --embed-bundle-assets
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$output_app/Info.plist")" = 'com.vitalyiegorov.suuudokuuu.e2e'
          if /usr/libexec/PlistBuddy -c 'Print :DEV_CLIENT_DEFAULT_LAUNCHER_URL' "$output_app/Info.plist" >/dev/null 2>&1; then
            echo '::error::Repacked E2E app unexpectedly contains a development-client launch URL.'
            exit 1
          fi
          find "$output_app" -name 'main.jsbundle' -type f -print -quit | grep -q .

      - name: Plan native build
        id: native-plan
        shell: bash
        run: |
          if [ "${{ steps.native-app-cache.outputs.cache-hit }}" != 'true' ] || \
             [ "${{ steps.repack.outcome }}" != 'success' ]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
            if [ "${{ steps.native-app-cache.outputs.cache-hit }}" = 'true' ]; then
              echo '::warning::Repack failed validation; falling back to a full native build.'
            fi
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode
        if: steps.native-plan.outputs.required == 'true'
        run: |
          xcode_app=/Applications/Xcode_26.4.1.app
          if [ ! -d "$xcode_app" ]; then
            echo '::error::Xcode 26.4.1 is not installed on this runner.'
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"
          xcode_version=$("$xcode_app/Contents/Developer/usr/bin/xcodebuild" -version)
          printf '%s\n' "$xcode_version"
          grep -qx 'Xcode 26.4.1' <<< "$xcode_version"
          grep -qx 'Build version 17E202' <<< "$xcode_version"

      - name: Restore CocoaPods cache
        if: steps.native-plan.outputs.required == 'true'
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-${{ runner.os }}-e2e-${{ hashFiles('yarn.lock', 'packages/app/package.json', 'packages/app/app.config.js') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Generate native project
        if: steps.native-plan.outputs.required == 'true'
        working-directory: packages/app
        run: npx expo prebuild -p ios --clean

      - name: Install pods
        if: steps.native-plan.outputs.required == 'true'
        working-directory: packages/app/ios
        run: pod install

      - name: Build native Release base
        if: steps.native-plan.outputs.required == 'true'
        working-directory: packages/app/ios
        run: |
          workspace=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          scheme=$(basename "$workspace" .xcworkspace)
          test -n "$workspace"
          xcodebuild build \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath "$IOS_DERIVED_DATA" \
            -destination 'generic/platform=iOS Simulator' \
            -jobs 5 \
            CODE_SIGN_IDENTITY='-' \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER='' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            EXCLUDED_ARCHS=x86_64

      - name: Package native base
        if: steps.native-plan.outputs.required == 'true'
        run: |
          set -euo pipefail
          app_path=$(find "$IOS_DERIVED_DATA" -name '*.app' -path '*Release-iphonesimulator*' -print -quit)
          test -n "$app_path"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")" = 'com.vitalyiegorov.suuudokuuu.e2e'
          if /usr/libexec/PlistBuddy -c 'Print :DEV_CLIENT_DEFAULT_LAUNCHER_URL' "$app_path/Info.plist" >/dev/null 2>&1; then
            echo '::error::Native E2E base unexpectedly contains a development-client launch URL.'
            exit 1
          fi
          find "$app_path" -name 'main.jsbundle' -type f -print -quit | grep -q .
          mkdir -p .ci-cache/ios-native-app
          ditto "$app_path" .ci-cache/ios-native-app/Base.app

      - name: Save fingerprinted native app
        if: steps.native-app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .ci-cache/ios-native-app
          key: ios-native-v2-macos26-suuudokuuu-e2e-${{ runner.os }}-arm64-xcode26_4_1-17E202-${{ steps.fingerprint.outputs.hash }}

      - name: Validate and package current app
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.repack.outcome }}" = 'success' ]; then
            app_path="$GITHUB_WORKSPACE/.ci-artifacts/repacked/Suuudokuuu.app"
          else
            app_path=$(find "$IOS_DERIVED_DATA" -name '*.app' -path '*Release-iphonesimulator*' -print -quit)
          fi
          test -d "$app_path"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")" = 'com.vitalyiegorov.suuudokuuu.e2e'
          if /usr/libexec/PlistBuddy -c 'Print :DEV_CLIENT_DEFAULT_LAUNCHER_URL' "$app_path/Info.plist" >/dev/null 2>&1; then
            echo '::error::E2E app unexpectedly contains a development-client launch URL.'
            exit 1
          fi
          find "$app_path" -name 'main.jsbundle' -type f -print -quit | grep -q .
          mkdir -p .ci-artifacts/ios-e2e-app
          tar -C "$(dirname "$app_path")" -czf ".ci-artifacts/ios-e2e-app/$(basename "$app_path").tar.gz" "$(basename "$app_path")"

      - uses: actions/upload-artifact@v6
        with:
          name: ios-e2e-app
          path: .ci-artifacts/ios-e2e-app/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  test:
    needs: build
    name: Maestro shard ${{ matrix.shard-number }}/2
    runs-on: [self-hosted, macOS, ARM64, macos-maestro]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard-index: 0
            shard-number: 1
          - shard-index: 1
            shard-number: 2
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          xcode_app=/Applications/Xcode_26.4.1.app
          test -d "$xcode_app"
          echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Start isolated simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid=$(python3 <<'PY'
          import json
          import subprocess

          simulator_metadata = json.loads(
              subprocess.check_output(['xcrun', 'simctl', 'list', '-j', 'devicetypes', 'runtimes'])
          )
          available_runtimes = [
              runtime
              for runtime in simulator_metadata['runtimes']
              if runtime.get('isAvailable')
              and runtime.get('identifier', '').startswith('com.apple.CoreSimulator.SimRuntime.iOS')
          ]
          available_runtimes.sort(
              key=lambda runtime: tuple(int(part) for part in runtime.get('version', '0').split('.')),
              reverse=True,
          )
          device_types_by_name = {
              device_type['name']: device_type['identifier']
              for device_type in simulator_metadata['devicetypes']
              if device_type.get('productFamily') == 'iPhone'
          }
          preferred_device_names = ['iPhone 17', 'iPhone Air', 'iPhone 16', 'iPhone 15']
          device_type_identifier = next(
              (
                  device_types_by_name[device_name]
                  for device_name in preferred_device_names
                  if device_name in device_types_by_name
              ),
              None,
          )

          if not available_runtimes or not device_type_identifier:
              raise SystemExit('No supported iOS runtime or iPhone simulator type is available.')

          print(
              subprocess.check_output(
                  [
                      'xcrun',
                      'simctl',
                      'create',
                      'Suuudokuuu E2E',
                      device_type_identifier,
                      available_runtimes[0]['identifier'],
                  ],
                  text=True,
              ).strip()
          )
          PY
          )
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v6
        with:
          name: ios-e2e-app
          path: .ci-artifacts/ios-e2e-app

      - name: Install embedded app
        run: |
          mkdir -p .ci-artifacts/ios-e2e-app/extracted
          tar -xzf "$(find .ci-artifacts/ios-e2e-app -name '*.tar.gz' -print -quit)" -C .ci-artifacts/ios-e2e-app/extracted
          app_path=$(find .ci-artifacts/ios-e2e-app/extracted -name '*.app' -print -quit)
          test -n "$app_path"
          xcrun simctl install "$SIMULATOR_UDID" "$app_path"

      - name: Install Maestro
        run: |
          maestro_bin="$HOME/.maestro/bin/maestro"
          if [ ! -x "$maestro_bin" ] || [ "$("$maestro_bin" --version 2>/dev/null | tail -n 1 | tr -d '\r' || true)" != "$MAESTRO_VERSION" ]; then
            curl -fsSL https://get.maestro.mobile.dev | env MAESTRO_VERSION="$MAESTRO_VERSION" bash
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run deterministic Maestro shard
        working-directory: tests/app-tests
        shell: bash
        env:
          APP_ID: com.vitalyiegorov.suuudokuuu.e2e
          MAESTRO_DEBUG_OUTPUT_DIRECTORY: ${{ github.workspace }}/tests/app-tests/artifacts/maestro-shard-${{ matrix.shard-index }}
          MAESTRO_OUTPUT_PATH: ${{ github.workspace }}/tests/app-tests/artifacts/maestro-shard-${{ matrix.shard-index }}/report.xml
          SHARD_INDEX: ${{ matrix.shard-index }}
        run: |
          set -euo pipefail
          flows=()
          while IFS= read -r flow; do
            flows+=("$flow")
          done < <(find flows -maxdepth 1 -type f -name '*.flow.yaml' | sort)
          selected=()
          for index in "${!flows[@]}"; do
            if (( index % 2 == SHARD_INDEX )); then
              selected+=("${flows[$index]}")
            fi
          done
          test "${#selected[@]}" -gt 0
          printf 'Shard %s flows:\n%s\n' "$SHARD_INDEX" "${selected[*]}"
          mkdir -p "./artifacts/maestro-shard-$SHARD_INDEX"
          ./scripts/run-maestro-suite.sh "${selected[@]}" \
            2>&1 | tee "./artifacts/maestro-shard-$SHARD_INDEX/console.log"

      - name: Capture final simulator state
        if: always()
        run: |
          mkdir -p "tests/app-tests/artifacts/simulator-shard-${{ matrix.shard-index }}"
          xcrun simctl io "$SIMULATOR_UDID" screenshot "tests/app-tests/artifacts/simulator-shard-${{ matrix.shard-index }}/final-screen.png" || true
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
          xcrun simctl delete "$SIMULATOR_UDID" || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: maestro-ios-shard-${{ matrix.shard-number }}
          include-hidden-files: true
          path: |
            tests/app-tests/artifacts/maestro-shard-${{ matrix.shard-index }}/**
            tests/app-tests/artifacts/simulator-shard-${{ matrix.shard-index }}/**
          if-no-files-found: warn
