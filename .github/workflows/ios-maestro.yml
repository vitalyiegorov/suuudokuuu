name: iOS Maestro

# Tests only: the embedded app is produced by mobile-build.yml so callers can
# gate every macOS test VM on "all mobile builds done" (see mobile-e2e.yml).
on:
  workflow_call:

env:
  MAESTRO_VERSION: '2.6.1'
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
  MAESTRO_CLI_NO_ANALYTICS: true
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true

jobs:
  test:
    name: Maestro shard ${{ matrix.shard-number }}/2
    runs-on: [self-hosted, macOS, ARM64, macos-maestro]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard-index: 0
            shard-number: 1
          - shard-index: 1
            shard-number: 2
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          xcode_app=/Applications/Xcode_26.4.1.app
          test -d "$xcode_app"
          echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Start prewarmed simulator
        shell: bash
        run: |
          set -euo pipefail
          # The maestro guest image ships two settled "iPhone 17 Pro" devices
          # (~/.budgie-ci/simulators.json); using one avoids the iOS 26
          # first-boot indexing storm that breaks the XCUITest driver.
          simulator_udid=$(python3 <<'PY'
          import json
          import subprocess

          inventory = json.loads(
              subprocess.check_output(['xcrun', 'simctl', 'list', '-j', 'devices', 'available'])
          )['devices']
          for runtime in sorted(inventory, reverse=True):
              for device in inventory[runtime]:
                  if device.get('name') == 'iPhone 17 Pro' and device.get('isAvailable', True):
                      print(device['udid'])
                      raise SystemExit(0)
          raise SystemExit('No prewarmed iPhone 17 Pro simulator is available in the guest image.')
          PY
          )
          for attempt in 1 2 3; do
            echo "Booting simulator $simulator_udid (attempt $attempt/3)"
            xcrun simctl boot "$simulator_udid" 2>/dev/null || true
            if xcrun simctl bootstatus "$simulator_udid" -b; then
              break
            fi
            xcrun simctl shutdown "$simulator_udid" 2>/dev/null || true
            test "$attempt" != 3
          done
          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v6
        with:
          name: ios-e2e-app
          path: .ci-artifacts/ios-e2e-app

      - name: Install embedded app
        run: |
          mkdir -p .ci-artifacts/ios-e2e-app/extracted
          tar -xzf "$(find .ci-artifacts/ios-e2e-app -name '*.tar.gz' -print -quit)" -C .ci-artifacts/ios-e2e-app/extracted
          app_path=$(find .ci-artifacts/ios-e2e-app/extracted -name '*.app' -print -quit)
          test -n "$app_path"
          xcrun simctl install "$SIMULATOR_UDID" "$app_path"

      - name: Install Maestro
        run: |
          maestro_bin="$HOME/.maestro/bin/maestro"
          if [ ! -x "$maestro_bin" ] || [ "$("$maestro_bin" --version 2>/dev/null | tail -n 1 | tr -d '\r' || true)" != "$MAESTRO_VERSION" ]; then
            curl -fsSL https://get.maestro.mobile.dev | env MAESTRO_VERSION="$MAESTRO_VERSION" bash
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run deterministic Maestro shard
        working-directory: tests/app-tests
        shell: bash
        env:
          APP_ID: com.vitalyiegorov.suuudokuuu.e2e
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true -Xmx1024m
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000' 
          MAESTRO_DEBUG_OUTPUT_DIRECTORY: ${{ github.workspace }}/tests/app-tests/artifacts/maestro-shard-${{ matrix.shard-index }}
          MAESTRO_OUTPUT_PATH: ${{ github.workspace }}/tests/app-tests/artifacts/maestro-shard-${{ matrix.shard-index }}/report.xml
          SHARD_INDEX: ${{ matrix.shard-index }}
        run: |
          set -euo pipefail
          flows=()
          while IFS= read -r flow; do
            flows+=("$flow")
          done < <(find flows -maxdepth 1 -type f -name '*.flow.yaml' | sort)
          selected=()
          for index in "${!flows[@]}"; do
            if (( index % 2 == SHARD_INDEX )); then
              selected+=("${flows[$index]}")
            fi
          done
          test "${#selected[@]}" -gt 0
          printf 'Shard %s flows:\n%s\n' "$SHARD_INDEX" "${selected[*]}"
          mkdir -p "./artifacts/maestro-shard-$SHARD_INDEX"
          ./scripts/run-maestro-suite.sh "${selected[@]}" \
            2>&1 | tee "./artifacts/maestro-shard-$SHARD_INDEX/console.log"

      - name: Publish Maestro timing summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          timing_file="tests/app-tests/artifacts/maestro-shard-${{ matrix.shard-index }}/flow-timings.tsv"
          if [ -f "$timing_file" ]; then
            {
              echo "### Maestro flow timings: shard ${{ matrix.shard-number }}"
              echo
              echo '| Flow | Status | Attempts | Seconds |'
              echo '| --- | --- | ---: | ---: |'
              tail -n +2 "$timing_file" |
                awk -F '\t' '{ printf "| `%s` | %s | %s | %s |\n", $2, $3, $4, $5 }'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Capture final simulator state
        if: always()
        run: |
          mkdir -p "tests/app-tests/artifacts/simulator-shard-${{ matrix.shard-index }}"
          xcrun simctl io "$SIMULATOR_UDID" screenshot "tests/app-tests/artifacts/simulator-shard-${{ matrix.shard-index }}/final-screen.png" || true
          xcrun simctl shutdown "$SIMULATOR_UDID" || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: maestro-ios-shard-${{ matrix.shard-number }}
          include-hidden-files: true
          path: |
            tests/app-tests/artifacts/maestro-shard-${{ matrix.shard-index }}/**
            tests/app-tests/artifacts/simulator-shard-${{ matrix.shard-index }}/**
          if-no-files-found: warn
          retention-days: 7
