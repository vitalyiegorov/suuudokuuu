# Fleet validation for mobile-ci feat/store-screenshots-locale-env-asc-dedupe
# (per-locale flow env + App Store Connect screenshot dedupe gate).
# Push-triggered: pushing this commit as branch ci/ssv-run/<preset> runs
# exactly that preset, one per push, so the fleet never carries more than one
# validation pipeline at a time. The pin is the mobile-ci branch head under
# validation, not a release tag.
name: Store screenshots locale-env + asc-dedupe validation

on:
    workflow_dispatch:
    push:
        branches:
            - ci/ssv-run/**

permissions:
    contents: read

jobs:
    r1-locale-env-ios:
        name: R1 iOS direct capture with per-locale env
        if: github.ref_name == 'ci/ssv-run/r1-locale-env-ios'
        uses: rnw-community/mobile-ci/.github/workflows/store-screenshots.yml@v1.8.0 # v1.8.0
        with:
            ios-target: >-
                {"name":"e2e","appDir":"packages/app","workspace":"suuudokuuuE2E.xcworkspace","scheme":"suuudokuuuE2E","appId":"com.vitalyiegorov.suuudokuuu.e2e","prebuildCommand":"npx expo prebuild -p ios --clean --no-install"}
            capture-manifest: >-
                [
                  {"platform":"ios","device":"iPhone 17 Pro","locales":[{"id":"en","env":{"LOCALE_IDENTIFIER":"en-US","OS_LANGUAGE_MODE":"true"}},{"id":"de","env":{"LOCALE_IDENTIFIER":"de-DE","OS_LANGUAGE_MODE":"true"}},{"id":"fr","env":{"LOCALE_IDENTIFIER":"fr-FR","OS_LANGUAGE_MODE":"true"}}],"appearances":["light"]}
                ]
            capture-mode: direct
            capture-scenes: >-
                [
                  {"name":"hero-board","deepLink":"suuudokuuu://game"},
                  {"name":"stats","deepLink":"suuudokuuu://history"},
                  {"name":"win","flow":"05.win.flow.yaml"}
                ]
            screenshots-dir: tests/app-tests/flows/screenshots
            seed-command: node tests/app-tests/scripts/ci-seed-scene.ts
            settle-seconds: '5'
            build-runner-labels: '["self-hosted","macOS","ARM64","macos-builder"]'
            capture-runner-labels: '["self-hosted","macOS","ARM64","macos-maestro"]'
            cache-profile: suuudokuuu-ios-v2
            repack-on-hit: true
            rct-use-prebuilt-rncore: true
            rct-use-rn-dep: true
            build-env: |
                APP_VARIANT=e2e

    r2-android-regression:
        name: R2 Android direct capture regression
        if: github.ref_name == 'ci/ssv-run/r2-android-regression'
        uses: rnw-community/mobile-ci/.github/workflows/store-screenshots.yml@v1.8.0 # v1.8.0
        with:
            android-target: >-
                {"name":"e2e","appDir":"packages/app","appId":"com.vitaliiyehorov.suuudokuuu.e2e","prebuildCommand":"npx expo prebuild -p android --clean --no-install"}
            capture-manifest: >-
                [{"platform":"android","device":"phone-6.7","width":1080,"height":2340,"density":440,"locales":["en"],"appearances":["light","dark"]}]
            capture-mode: direct
            capture-scenes: >-
                [
                  {"name":"themes","deepLink":"suuudokuuu://settings/themes"},
                  {"name":"settings","deepLink":"suuudokuuu://settings"},
                  {"name":"stats","deepLink":"suuudokuuu://history"}
                ]
            seed-command: node tests/app-tests/scripts/ci-seed-scene.ts
            settle-seconds: '5'
            build-runner-labels: '["self-hosted","macOS","ARM64","macos-builder"]'
            android-gradle-task: ':app:assembleRelease'
            android-gradle-args: '-x lint -x lintVitalAnalyzeRelease -x lintAnalyzeRelease -PreactNativeArchitectures=arm64-v8a'
            android-cache-profile: suuudokuuu-android-v1
            repack-on-hit: true
            redroid-prewarm-manifest-path: $HOME/.sudoku-ci/android-emulator.json
            redroid-memory: 6g
            redroid-cpus: '4'
            redroid-boot-timeout-seconds: '300'
            build-env: |
                APP_VARIANT=e2e
                JAVA_HOME=/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home
                ORG_GRADLE_PROJECT_reactNativeArchitectures=arm64-v8a

    r3-upload-dedupe-gate:
        name: R3 upload gate + App Store Connect dedupe
        if: github.ref_name == 'ci/ssv-run/r3-upload-dedupe-gate'
        uses: rnw-community/mobile-ci/.github/workflows/store-screenshots.yml@v1.8.0 # v1.8.0
        with:
            ios-target: >-
                {"name":"e2e","appDir":"packages/app","workspace":"suuudokuuuE2E.xcworkspace","scheme":"suuudokuuuE2E","appId":"com.vitalyiegorov.suuudokuuu.e2e","prebuildCommand":"npx expo prebuild -p ios --clean --no-install"}
            capture-manifest: >-
                [{"platform":"ios","device":"iPhone 17 Pro","locales":["en","de"],"appearances":["light"]}]
            capture-mode: direct
            capture-scenes: >-
                [
                  {"name":"hero-board","deepLink":"suuudokuuu://game"},
                  {"name":"stats","deepLink":"suuudokuuu://history"}
                ]
            screenshots-dir: tests/app-tests/flows/screenshots
            seed-command: node tests/app-tests/scripts/ci-seed-scene.ts
            settle-seconds: '5'
            build-runner-labels: '["self-hosted","macOS","ARM64","macos-builder"]'
            capture-runner-labels: '["self-hosted","macOS","ARM64","macos-maestro"]'
            # asc-dedupe-screenshots needs App Store Connect egress; the maestro capture pool is egress-restricted.
            upload-runner-labels: '["self-hosted","macOS","ARM64","macos-builder"]'
            cache-profile: suuudokuuu-ios-v2
            repack-on-hit: true
            rct-use-prebuilt-rncore: true
            rct-use-rn-dep: true
            build-env: |
                APP_VARIANT=e2e
            upload-screenshots: true
            upload-command: 'true'
            apple-screenshot-slots: >-
                {"1320x2868":"iPhone 6.9\"","1290x2796":"iPhone 6.9\"","1284x2778":"iPhone 6.5\"","1242x2688":"iPhone 6.5\"","1206x2622":"iPhone 6.3\"","1179x2556":"iPhone 6.1\"","2064x2752":"iPad 13\"","2752x2064":"iPad 13\"","2048x2732":"iPad 12.9\"","2732x2048":"iPad 12.9\""}
            asc-dedupe-screenshots: true
            asc-dedupe-app-id: com.vitalyiegorov.suuudokuuu
            # v0.1.459 shipped; no editable version exists - audit the live listing instead.
            asc-dedupe-version-state: READY_FOR_SALE
            # live listing currently carries duplicates; audit-only for this validation
            asc-fail-on-duplicates: false
        secrets:
            ASC_API_KEY: ${{ secrets.EXPO_IOS_ASC_API_KEY }}
            ASC_KEY_ID: ${{ secrets.EXPO_IOS_ASC_KEY_ID }}
            ASC_ISSUER_ID: ${{ secrets.EXPO_IOS_ASC_ISSUER_ID }}

    r4-config-path:
        # PR #107 validation, run 2: deep-link foreground fix (Open-in-app
        # sheet dismissal + --device on flow-backed maestro invocations +
        # the required per-scene readySelector added after run 1).
        #
        # Run 1 (33380247574) went green while BOTH stats cells captured a
        # byte-identical SpringBoard home screen: assertNotVisible on the
        # sheet title is equally true of a bare home screen, so nothing
        # noticed the app was not foreground. mobile-ci now requires a
        # readySelector per deep-link scene, asserted visible immediately
        # before the screencap; the selectors below are this repo's own
        # screen roots. GameScreenSelectors.Root / HistoryScreenSelectors.Root
        # are used rather than .Score, which is conditional on calm mode.
        #
        # Re-scoped to the v1.12.0 release candidate (mobile-ci main
        # 93356e2, PRs #107 + #110 + #111) in the config-path form the
        # consumer will actually use: every app-shaped value lives in
        # .github/store-screenshots.validation.config.json, only the
        # plan-time runner labels stay in with:. The config file also
        # carries a top-level "$schema" key (must be tolerated by
        # load-consumer-config, #111) and "launch-settle-seconds": "2"
        # (the new 33rd loadable key, must resolve from the file).
        # ONE self-reference is still branch-pinned inside mobile-ci at this
        # SHA (capture-screenshots-ios@fade644, the #111 head) - the release
        # PR normalizes it to @v1.12.0.
        # Device is iPhone 17 Pro Max (plain 'iPhone 17 Pro' has a
        # same-runtime clone on part of the pool per #105's validation -
        # fails closed by design, not what this run is testing).
        #
        # 'win' (05.win.flow.yaml) dropped for THIS run: two prior attempts
        # (this validation and the original #103 one) both failed 2/2 at
        # `Assert that id: HomeScreenSelectors.Root is visible` inside
        # subflows/reset-app.flow.yaml, which EVERY flow-backed scene in
        # this repo depends on as its first step (grep confirms no
        # exceptions) - so no flow swap avoids it. It is a pre-existing
        # consumer-side flow issue unrelated to #107 (reset-app.flow.yaml
        # already carries its own '^Open$' dismissal logic for the same
        # sheet, predating this PR). Because the capture step has no
        # `if: always()` guard on its own artifact-upload step, that one
        # failing cell was losing the OTHER 4 already-successful deep-link
        # captures too (no artifact was uploaded at all in that run) -
        # dropping it here to actually get the primary deep-link pixel
        # evidence downloadable. The --device flow-backed fix still has
        # partial evidence from that failed run's own log (see PR comment).
        name: R4 v1.12.0 release-candidate validation (config-path form)
        if: github.ref_name == 'ci/ssv-run/config-path'
        uses: rnw-community/mobile-ci/.github/workflows/store-screenshots.yml@93356e236270cf7434c05f554210ba53edc1ccd9 # main release-candidate (v1.12.0)
        with:
            config-path: .github/store-screenshots.validation.config.json
            build-runner-labels: '["self-hosted","macOS","ARM64","macos-builder"]'
            capture-runner-labels: '["self-hosted","macOS","ARM64","macos-maestro"]'
        secrets:
            ASC_API_KEY: ${{ secrets.EXPO_IOS_ASC_API_KEY }}
            ASC_KEY_ID: ${{ secrets.EXPO_IOS_ASC_KEY_ID }}
            ASC_ISSUER_ID: ${{ secrets.EXPO_IOS_ASC_ISSUER_ID }}
