name: PR closed cleanup

on:
    pull_request:
        types: [closed]

permissions:
    actions: write

jobs:
    cleanup:
        name: Cancel queued/in-progress runs for the closed PR branch
        permissions:
            actions: write
        uses: rnw-community/mobile-ci/.github/workflows/pr-closed-cleanup-reusable.yml@443067982b184fe16ceef20a8ff2e36d5af286b6 # v4.6.0
        with:
            control-runner-labels: '["self-hosted","trf-linux-amd64-2x4"]'
            ota-preview-cleanup-runner-labels: '["self-hosted","trf-linux-amd64-2x4"]'

    eas-channel-cleanup:
        name: Delete the closed PR's EAS Update channel
        if: github.event.pull_request.head.repo.full_name == github.repository
        needs: [cleanup]
        permissions:
            contents: read
        uses: rnw-community/mobile-ci/.github/workflows/eas-channel-cleanup-reusable.yml@443067982b184fe16ceef20a8ff2e36d5af286b6 # v4.6.0
        with:
            app-dir: packages/app
            runner-labels: '["self-hosted","trf-linux-amd64-2x4"]'
            install-command: corepack enable && pnpm install --frozen-lockfile
        secrets:
            EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
