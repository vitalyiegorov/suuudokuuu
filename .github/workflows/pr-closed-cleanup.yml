name: PR closed cleanup

on:
    pull_request:
        types: [closed]

permissions:
    actions: write

jobs:
    cleanup:
        name: Cancel queued/in-progress runs for the closed PR branch
        permissions:
            actions: write
        uses: rnw-community/mobile-ci/.github/workflows/pr-closed-cleanup-reusable.yml@7ee29bef4965a29e10f20396ec7b56da15218f45 # v4.11.0
        with:
            control-runner-labels: '["self-hosted","linux-portable-2x4"]'
            ota-preview-cleanup-runner-labels: '["self-hosted","linux-portable-2x4"]'

    eas-channel-cleanup:
        name: Delete the closed PR's EAS Update channel
        if: github.event.pull_request.head.repo.full_name == github.repository
        needs: [cleanup]
        permissions:
            contents: read
        uses: rnw-community/mobile-ci/.github/workflows/eas-channel-cleanup-reusable.yml@7ee29bef4965a29e10f20396ec7b56da15218f45 # v4.11.0
        with:
            app-dir: packages/app
            runner-labels: '["self-hosted","linux-portable-2x4"]'
            project-id: 4a70028a-5f9e-4ab6-9389-82d8b8b6c833
            project-slug: suuudokuuu
        secrets:
            EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
