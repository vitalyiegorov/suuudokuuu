name: PR closed cleanup

on:
    pull_request:
        types: [closed]

permissions:
    actions: write

jobs:
    cleanup:
        name: Cancel queued/in-progress runs for the closed PR branch
        permissions:
            actions: write
        uses: rnw-community/mobile-ci/.github/workflows/pr-closed-cleanup-reusable.yml@85f0985c18f295f0e380a91370130905eeef997e # v4.2.0

    eas-channel-cleanup:
        name: Delete the closed PR's EAS Update channel
        if: github.event.pull_request.head.repo.full_name == github.repository
        needs: [cleanup]
        permissions:
            contents: read
        uses: rnw-community/mobile-ci/.github/workflows/eas-channel-cleanup-reusable.yml@85f0985c18f295f0e380a91370130905eeef997e # v4.2.0
        with:
            app-dir: packages/app
            install-command: corepack enable && pnpm install --frozen-lockfile
        secrets:
            EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
