name: 'CodeQL'

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']
        # Docs, reports, store metadata and the landing site never reach the app
        # bundle; main pushes and the weekly schedule still scan all of it.
        paths-ignore:
            - 'docs/**'
            - 'reports/**'
            - '**/*.md'
            - 'packages/landing/**'
            - 'packages/app/fastlane/**'
    schedule:
        - cron: '38 4 * * 0'

concurrency:
    group: codeql-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    analyze:
        name: Analyze
        runs-on: [self-hosted, trf-linux-amd64-2x4]
        timeout-minutes: 30
        permissions:
            actions: read
            contents: read
            security-events: write

        strategy:
            fail-fast: false
            matrix:
                language: [actions, javascript-typescript]

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node
              if: matrix.language == 'javascript-typescript'
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22.x

            # A container sees the host's memory and CPUs, not its 2 CPU / 4 GiB
            # quota, so CodeQL is told the shape it has.
            - name: Initialize CodeQL
              uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none
                  ram: 3072
                  threads: 2

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
              with:
                  category: '/language:${{ matrix.language }}'
                  ram: 3072
                  threads: 2
