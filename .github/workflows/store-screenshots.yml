name: Store screenshots

# Captures localized App Store screenshots for the production variant via
# rnw-community/mobile-ci's store-screenshots reusable workflow, validates
# them against the listing's slot resolutions, uploads them through the
# existing fastlane deliver lane, and dedupes the editable App Store Connect
# version afterwards (deliver retries are known to double-upload).
#
# Dispatch-only: capturing overwrites nothing until upload-screenshots runs,
# but it does contact App Store Connect - run deliberately, not on push.
#
# App-shaped config (targets, capture manifest/scenes, upload command, ASC
# dedupe settings, ...) lives in .github/store-screenshots.config.json,
# loaded via config-path. Only plan-time runner labels stay as inputs here.
on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    screenshots:
        uses: rnw-community/mobile-ci/.github/workflows/store-screenshots.yml@v1.11.0 # v1.11.0
        with:
            config-path: .github/store-screenshots.config.json
            build-runner-labels: '["self-hosted","macOS","ARM64","macos-builder"]'
            capture-runner-labels: '["self-hosted","macOS","ARM64","macos-maestro"]'
            upload-runner-labels: '["self-hosted","macOS","ARM64","macos-builder"]'
        secrets:
            ASC_API_KEY: ${{ secrets.EXPO_IOS_ASC_API_KEY }}
            ASC_KEY_ID: ${{ secrets.EXPO_IOS_ASC_KEY_ID }}
            ASC_ISSUER_ID: ${{ secrets.EXPO_IOS_ASC_ISSUER_ID }}
