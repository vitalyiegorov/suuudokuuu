# Submits the uploaded iOS build for App Review and promotes the Android internal release to production; dry run by default.
name: Release to Stores

on:
    workflow_dispatch:
        inputs:
            platforms:
                description: 'Stores to release'
                type: choice
                options:
                    - ios,android
                    - ios
                    - android
                default: ios,android
            dry_run:
                description: 'Only print the plan; change nothing in the stores'
                type: boolean
                default: true
            ios_version:
                description: 'iOS marketing version to submit (empty reads packages/app/package.json; set it when the last native build predates later OTA-only version bumps)'
                type: string
                default: ''
            android_rollout:
                description: 'Google Play rollout fraction (1 completes the release)'
                type: string
                default: '1'

permissions:
    contents: read

concurrency:
    group: suuudokuuu-store-release
    cancel-in-progress: false

jobs:
    release:
        name: Release
        permissions:
            contents: read
        uses: rnw-community/mobile-ci/.github/workflows/store-release.yml@a9fac576ef1c8a9a565d03851f2624502a868214 # v4.4.1
        with:
            control-runner-labels: '["self-hosted","trf-linux-amd64-2x4"]'
            platforms: ${{ inputs.platforms }}
            dry-run: ${{ inputs.dry_run }}
            version-file: packages/app/package.json
            ios-app-id: '6449440933'
            ios-version: ${{ inputs.ios_version }}
            ios-release-type: AFTER_APPROVAL
            android-package: com.vitaliiyehorov.suuudokuuu
            android-from-track: internal
            android-to-track: production
            android-rollout: ${{ inputs.android_rollout }}
        secrets:
            ASC_API_KEY: ${{ secrets.EXPO_IOS_ASC_API_KEY }}
            ASC_KEY_ID: ${{ secrets.EXPO_IOS_ASC_KEY_ID }}
            ASC_ISSUER_ID: ${{ secrets.EXPO_IOS_ASC_ISSUER_ID }}
            GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
