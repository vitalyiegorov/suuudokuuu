name: Build Development build

on:
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: development-build-release
    cancel-in-progress: false

jobs:
    dev-release:
        name: Development build and release
        permissions:
            contents: write
        uses: rnw-community/mobile-ci/.github/workflows/native-dev-release.yml@v4.0.0 # v4.0.0
        with:
            install-command: pnpm install --frozen-lockfile
            app-dir: packages/app
            enable-ios: false
            enable-android: true
            ios-runner-labels: '["self-hosted","macOS","ARM64","macos-builder"]'
            node-version: 22.x
            build-profile: development
            eas-cli-version: '20.5.1'
            tag-prefix: fleet-verify-mci149
            keep-releases: '5'
            ios-pre-build-command: node scripts/preflight-development-build.ts
            ios-verify-embedded-build-number: true
            android-runner-labels: '["self-hosted","trf-linux-amd64-4x8"]'
            android-pre-build-command: |
                echo "node --version: $(node --version)"
                echo "memory.max: $(cat /sys/fs/cgroup/memory.max)"
                echo "memory.swap.max: $(cat /sys/fs/cgroup/memory.swap.max)"
                echo "cpu.max: $(cat /sys/fs/cgroup/cpu.max)"
                echo "nproc: $(nproc)"
                echo "memory.peak before build: $(cat /sys/fs/cgroup/memory.peak)"
                cat /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.swap.events
                gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
                mkdir -p "$gradle_user_home"
                printf '%s\n' \
                  'org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8' \
                  'kotlin.compiler.execution.strategy=in-process' \
                  'org.gradle.workers.max=2' \
                  'org.gradle.parallel=false' \
                  'expo.useLegacyPackaging=true' > "$gradle_user_home/gradle.properties"
                cat "$gradle_user_home/gradle.properties"
                mkdir -p "$gradle_user_home/init.d"
                cat > "$gradle_user_home/init.d/mci149.gradle" <<'GRADLE'
                gradle.beforeProject { project ->
                    if (project == project.rootProject) {
                        println("mci149 heap_max_bytes=${Runtime.getRuntime().maxMemory()} processors=${Runtime.getRuntime().availableProcessors()} workers=${gradle.startParameter.maxWorkerCount} kotlin_strategy=${project.findProperty('kotlin.compiler.execution.strategy')}")
                    }
                    ['com.android.application', 'com.android.library'].each { plugin ->
                        project.pluginManager.withPlugin(plugin) {
                            project.extensions.getByName('androidComponents').finalizeDsl { android ->
                                android.defaultConfig.externalNativeBuild.cmake.arguments.addAll([
                                    '-DCMAKE_JOB_POOLS=mci_compile=2;mci_link=1',
                                    '-DCMAKE_JOB_POOL_COMPILE=mci_compile',
                                    '-DCMAKE_JOB_POOL_LINK=mci_link'
                                ])
                            }
                        }
                    }
                }
                GRADLE
                date +%s > "$RUNNER_TEMP/mci149-start"
                nohup sh -c 'while :; do printf "%s %s %s %s\n" "$(date +%s)" "$(cat /sys/fs/cgroup/memory.current)" "$(awk "\$1==\"anon\"{print \$2}" /sys/fs/cgroup/memory.stat)" "$(ps -eo rss= | awk "{s+=\$1} END {print s*1024}")" >> "$1"; sleep 5; done' sampler "$RUNNER_TEMP/mci149-mem.log" >/dev/null 2>&1 &
            android-post-build-command: |
                python3 - <<'PY'
                import os
                import re
                import zipfile
                from pathlib import Path

                artifact = Path(os.environ['ARTIFACT_PATH'])
                with zipfile.ZipFile(artifact) as apk:
                    entries = apk.infolist()
                    names = {entry.filename for entry in entries}
                    if 'AndroidManifest.xml' not in names or 'BundleConfig.pb' in names:
                        raise SystemExit('Expected an APK manifest and no app bundle configuration')
                    if not any(re.fullmatch(r'classes[0-9]*\.dex', name) for name in names):
                        raise SystemExit('APK contains no classes dex file')
                    libraries = [entry for entry in entries if entry.filename.startswith('lib/') and entry.filename.endswith('.so')]
                    abis = {entry.filename.split('/')[1] for entry in libraries}
                    if abis != {'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'}:
                        raise SystemExit('APK must retain exactly arm64-v8a, armeabi-v7a, x86, x86_64 native libraries')
                    if any(entry.file_size == 0 or entry.compress_type != zipfile.ZIP_DEFLATED for entry in libraries):
                        raise SystemExit('Every APK native library must be nonempty and ZIP_DEFLATED')
                    print(f'apk_bytes={artifact.stat().st_size} native_uncompressed_bytes={sum(entry.file_size for entry in libraries)} native_compressed_bytes={sum(entry.compress_size for entry in libraries)} abis={",".join(sorted(abis))}')
                PY
                wall=$(( $(date +%s) - $(cat "$RUNNER_TEMP/mci149-start") ))
                peak=$(cat /sys/fs/cgroup/memory.peak 2>&1) || true
                maxcur=$(sort -k2,2n "$RUNNER_TEMP/mci149-mem.log" | tail -1 | cut -d' ' -f2)
                maxanon=$(sort -k3,3n "$RUNNER_TEMP/mci149-mem.log" | tail -1 | cut -d' ' -f3)
                maxrss=$(sort -k4,4n "$RUNNER_TEMP/mci149-mem.log" | tail -1 | cut -d' ' -f4)
                samples=$(wc -l < "$RUNNER_TEMP/mci149-mem.log")
                events=$(tr '\n' ' ' < /sys/fs/cgroup/memory.events 2>&1) || true
                limits="memory.max=$(cat /sys/fs/cgroup/memory.max 2>&1) cpu.max=$(cat /sys/fs/cgroup/cpu.max 2>&1) nproc=$(nproc)"
                size=$(du -h "$ARTIFACT_PATH" | cut -f1)
                msg="node=$(node --version) wall_s=$wall memory.peak=$peak max_sampled_current=$maxcur max_sampled_anon=$maxanon max_sampled_sum_rss=$maxrss samples=$samples events=[$events] $limits apk=$size"
                echo "::notice title=mci149 eas build --local measurement::$msg"
                echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            publish-env: |
                EXPO_NO_TELEMETRY=1
                LANG=en_US.UTF-8
                LC_ALL=en_US.UTF-8
                APP_VARIANT=development
                EXPO_APPLE_TEAM_ID=3R8589YV24
                EXPO_APPLE_TEAM_TYPE=INDIVIDUAL
                EXPO_USE_PRECOMPILED_MODULES=1
                RCT_USE_PREBUILT_RNCORE=1
                RCT_USE_RN_DEP=1
        secrets:
            EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
            ASC_API_KEY: ${{ secrets.EXPO_IOS_ASC_API_KEY }}
            ASC_KEY_ID: ${{ secrets.EXPO_IOS_ASC_KEY_ID }}
            ASC_ISSUER_ID: ${{ secrets.EXPO_IOS_ASC_ISSUER_ID }}

    verify-apk:
        name: Verify the published APK installs
        needs: dev-release
        runs-on: [self-hosted, trf-linux-amd64-4x8]
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - name: Download and verify the published development APK
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  RELEASE_TAG: fleet-verify-mci149-android-${{ github.run_number }}
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p "$RUNNER_TEMP/install-verification"
                  gh release download "$RELEASE_TAG" --repo "$REPOSITORY" \
                    --pattern app.apk --pattern SHA256SUMS --pattern build-meta.json \
                    --dir "$RUNNER_TEMP/install-verification"
                  cd "$RUNNER_TEMP/install-verification"
                  sha256sum --check SHA256SUMS
                  jq -e '.platform == "android" and .assetName == "app.apk"' build-meta.json
            - name: Start a clean test device
              id: emulator
              uses: rnw-community/mobile-ci/actions/android-emulator@v4.0.0 # v4.0.0
              with:
                  mode: start
                  profile: Nexus 4
                  avd-name: mobile-ci-dev-release-install
                  emulator-slots-dir: /var/lib/mobile-ci/emulator-slots
                  wipe-data: 'true'
            - name: Install the actual release asset
              env:
                  ANDROID_SERIAL: ${{ steps.emulator.outputs.android-serial }}
                  APP_ID: com.vitaliiyehorov.suuudokuuu.dev
              shell: bash
              run: |
                  set -euo pipefail
                  adb -s "$ANDROID_SERIAL" install "$RUNNER_TEMP/install-verification/app.apk"
                  adb -s "$ANDROID_SERIAL" shell pm path "$APP_ID" | grep '^package:'
                  launch_output="$(adb -s "$ANDROID_SERIAL" shell am start -W -n "$APP_ID/.MainActivity" | tr -d '\r')"
                  printf '%s\n' "$launch_output"
                  printf '%s\n' "$launch_output" | grep '^Status: ok$'
                  test -n "$(adb -s "$ANDROID_SERIAL" shell pidof "$APP_ID" | tr -d '\r')"
                  adb -s "$ANDROID_SERIAL" exec-out screencap -p > "$RUNNER_TEMP/install-verification/installed.png"
                  echo "Published app.apk checksum verified and installed as $APP_ID on $ANDROID_SERIAL." >> "$GITHUB_STEP_SUMMARY"
            - name: Retain installation evidence
              if: always()
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: mci149-apk-installation
                  path: |
                      ${{ runner.temp }}/install-verification/installed.png
                      ${{ runner.temp }}/install-verification/build-meta.json
                      ${{ runner.temp }}/install-verification/SHA256SUMS
            - name: Release the test device
              if: always()
              uses: rnw-community/mobile-ci/actions/android-emulator@v4.0.0 # v4.0.0
              with:
                  mode: stop
