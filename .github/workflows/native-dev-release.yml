name: Build Development build

on:
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: development-build-release
    cancel-in-progress: false

jobs:
    dev-release:
        name: Development build and release
        permissions:
            contents: write
        uses: rnw-community/mobile-ci/.github/workflows/native-dev-release.yml@b9502c1c3ea1c933485b3e657b47574072ed7ddf # v3.3.1
        with:
            install-command: pnpm install --frozen-lockfile
            app-dir: packages/app
            enable-ios: false
            enable-android: true
            ios-runner-labels: '["self-hosted","macOS","ARM64","macos-builder"]'
            node-version: 22.x
            build-profile: development
            eas-cli-version: '20.5.1'
            tag-prefix: fleet-scratch-mci149
            keep-releases: '5'
            # eas.json pins cli.appVersionSource=remote for the store profiles, so the
            # dev build must be flipped to local or EAS ignores the run-derived
            # ios.buildNumber that app.config.js sets from DEVELOPMENT_BUILD_NUMBER.
            ios-pre-build-command: node scripts/preflight-development-build.ts
            # app.config.js sets ios.buildNumber from DEVELOPMENT_BUILD_NUMBER (made
            # effective by the preflight above); fail before publishing if the .ipa
            # carries anything else.
            ios-verify-embedded-build-number: true
            android-runner-labels: '["self-hosted","trf-linux-amd64-4x8"]'
            android-pre-build-command: |
                echo "node --version: $(node --version)"
                echo "memory.max: $(cat /sys/fs/cgroup/memory.max 2>&1)"; echo "cpu.max: $(cat /sys/fs/cgroup/cpu.max 2>&1)"; echo "nproc: $(nproc)"
                echo "memory.peak before build: $(cat /sys/fs/cgroup/memory.peak 2>&1)"
                date +%s > "$RUNNER_TEMP/mci149-start"
                nohup sh -c 'while :; do printf "%s %s\n" "$(date +%s)" "$(cat /sys/fs/cgroup/memory.current)" >> "$1"; sleep 5; done' sampler "$RUNNER_TEMP/mci149-mem.log" >/dev/null 2>&1 &
            android-post-build-command: |
                echo "eas build wall seconds: $(( $(date +%s) - $(cat "$RUNNER_TEMP/mci149-start") ))"
                echo "memory.peak: $(cat /sys/fs/cgroup/memory.peak 2>&1)"
                echo "max sampled memory.current: $(sort -k2 -n "$RUNNER_TEMP/mci149-mem.log" | tail -1)"
                echo "samples: $(wc -l < "$RUNNER_TEMP/mci149-mem.log")"
                echo "memory.events:"; cat /sys/fs/cgroup/memory.events 2>&1 || true
                echo "artifact: $ARTIFACT_PATH ($(du -h "$ARTIFACT_PATH" | cut -f1)) versionCode=$EMBEDDED_BUILD_NUMBER"
            publish-env: |
                EXPO_NO_TELEMETRY=1
                LANG=en_US.UTF-8
                LC_ALL=en_US.UTF-8
                APP_VARIANT=development
                EXPO_APPLE_TEAM_ID=3R8589YV24
                EXPO_APPLE_TEAM_TYPE=INDIVIDUAL
                EXPO_USE_PRECOMPILED_MODULES=1
                RCT_USE_PREBUILT_RNCORE=1
                RCT_USE_RN_DEP=1
        secrets:
            EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
            ASC_API_KEY: ${{ secrets.EXPO_IOS_ASC_API_KEY }}
            ASC_KEY_ID: ${{ secrets.EXPO_IOS_ASC_KEY_ID }}
            ASC_ISSUER_ID: ${{ secrets.EXPO_IOS_ASC_ISSUER_ID }}
