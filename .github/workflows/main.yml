name: Deploy production
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
  EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
  EXPO_NO_TELEMETRY: '1'
  GH_TOKEN: ${{ secrets.PUSH_TO_PROTECTED_TOKEN }}
  TURBO_TEAM: vitalyiegorov
  TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Publish a release
    runs-on: [self-hosted, linux-burst]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Setup Git user
        run: |
          git config user.name "Vitalii Yehorov"
          git config user.email "vitalyiegorov@gmail.com"
          git remote rm origin
          git remote add origin https://vitalyiegorov:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git fetch
          git branch --set-upstream-to=origin/main main

      - name: Install dependencies
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: true
        run: yarn install

      - name: Sync Lingui catalogs
        run: yarn i18n:sync

      - name: Commit Lingui catalog changes
        run: |
          if git diff --quiet HEAD -- packages/app/src/i18n/locales; then
            echo "Lingui catalogs are up to date."
            exit 0
          fi

          git add packages/app/src/i18n/locales
          git commit -m "chore: sync lingui catalogs [skip ci]"
          git push origin HEAD:main

      - name: Publish a release
        run: yarn release

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PUSH_TO_PROTECTED_TOKEN }}

  web-deploy:
    name: Vercel deploy Web
    needs: release
    runs-on: [self-hosted, linux-burst]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install dependencies
        run: yarn install

      - name: Build expo web
        working-directory: packages/app
        run: npx expo export --platform=web

      - name: Deploy to Vercel
        working-directory: packages/app/dist
        run: |
          echo "!node_modules" > .vercelignore
          cp ../vercel.json .
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
