name: Deploy production
env:
    VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
    EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
    EXPO_NO_TELEMETRY: '1'
    GH_TOKEN: ${{ secrets.PUSH_TO_PROTECTED_TOKEN }}
    TURBO_TEAM: vitalyiegorov
    TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}

on:
    workflow_dispatch:
    push:
        branches:
            - main
    schedule:
        - cron: '10 0 * * *'

permissions:
    contents: read

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    release:
        name: Publish a release
        if: github.event_name != 'schedule'
        runs-on: [self-hosted, linux-portable-2x4]
        timeout-minutes: 20
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  persist-credentials: false
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22.x
                  cache: pnpm

            - name: Setup Git user
              run: |
                  git config user.name "Vitalii Yehorov"
                  git config user.email "vitalyiegorov@gmail.com"
                  git remote rm origin
                  git remote add origin "https://vitalyiegorov:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
                  git fetch --force --prune --tags origin +refs/heads/main:refs/remotes/origin/main
                  git checkout -B main origin/main

            - name: Verify release source
              run: |
                  if [ "$(git branch --show-current)" != "main" ]; then
                    echo "Release must run from main."
                    exit 1
                  fi

                  if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
                    echo "Release checkout does not match origin/main."
                    exit 1
                  fi

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Sync Lingui catalogs
              run: pnpm i18n:sync

            - name: Commit Lingui catalog changes
              run: |
                  if git diff --quiet HEAD -- packages/app/src/i18n/locales packages/landing/src/i18n/locales; then
                    echo "Lingui catalogs are up to date."
                    exit 0
                  fi

                  git add packages/app/src/i18n/locales packages/landing/src/i18n/locales
                  git commit -m "chore: sync lingui catalogs [skip ci]"
                  git push origin HEAD:main

            - name: Rebase onto the latest main
              run: |
                  git fetch --force origin +refs/heads/main:refs/remotes/origin/main
                  git rebase origin/main

            - name: Publish a release
              run: pnpm release

    web-deploy:
        name: Vercel deploy Web
        needs: release
        if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
        runs-on: [self-hosted, linux-portable-2x4]
        timeout-minutes: 20
        permissions:
            contents: read
        env:
            VERCEL_CLI_VERSION: '64.2.0'
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: main

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22.x
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build expo web
              run: pnpm turbo run export:web --filter=@suuudokuuu/app

            - name: Resolve the landing build date
              run: echo "LANDING_BUILD_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

            - name: Build landing export
              env:
                  INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
              run: pnpm turbo run build --filter=@suuudokuuu/landing

            - name: Check landing hreflang clusters
              run: pnpm --filter @suuudokuuu/landing check:hreflang

            - name: Pull Vercel project settings
              working-directory: packages/app
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="$VERCEL_TOKEN"

            - name: Build Vercel output
              working-directory: packages/app
              run: pnpm build:vercel

            - name: Deploy to Vercel
              working-directory: packages/app
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --token="$VERCEL_TOKEN"

            - name: Submit changed pages to IndexNow
              env:
                  INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
                  INDEXNOW_MODE: ${{ github.event_name == 'schedule' && '--daily' || '' }}
              run: pnpm --filter @suuudokuuu/landing submit:indexnow ${INDEXNOW_MODE:+"$INDEXNOW_MODE"}
