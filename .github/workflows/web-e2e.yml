name: Web E2E

on:
    workflow_call:
    workflow_dispatch:
    push:
        branches: [main]
        # The web export and the landing site together pull in every workspace
        # package, so only non-code paths (docs, reports, agent files) are left out.
        paths:
            - 'packages/**'
            - 'tests/web-tests/**'
            - 'patches/**'
            - 'types/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'tsconfig*.json'
            - 'turbo.json'
            - '.github/workflows/web-e2e.yml'

permissions:
    contents: read

concurrency:
    group: web-e2e-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'push' }}

env:
    TURBO_TEAM: vitalyiegorov
    TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    EXPO_NO_TELEMETRY: '1'

jobs:
    playwright:
        name: Playwright web E2E
        runs-on: [self-hosted, linux-portable-4x8]
        timeout-minutes: 20
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22.x
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Export Expo web build
              run: pnpm turbo run export:web --filter=@suuudokuuu/app

            - name: Build landing export
              run: pnpm turbo run build --filter=@suuudokuuu/landing

            - name: Check landing hreflang clusters
              run: pnpm --filter @suuudokuuu/landing check:hreflang

            - name: Install Playwright browsers
              run: pnpm --filter @suuudokuuu/web-tests exec playwright install --with-deps chromium webkit

            - name: Run Playwright web E2E
              run: pnpm --filter @suuudokuuu/web-tests test:e2e

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report
                  path: |
                      tests/web-tests/playwright-report
                      tests/web-tests/test-results
                  retention-days: 7
