name: Web E2E

on:
    workflow_call:
    workflow_dispatch:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: web-e2e-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'push' }}

env:
    TURBO_TEAM: vitalyiegorov
    TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    EXPO_NO_TELEMETRY: '1'

jobs:
    playwright:
        name: Playwright web E2E
        runs-on: [self-hosted, trf-linux-amd64-4x8]
        timeout-minutes: 20
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22.x
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Export Expo web build
              run: pnpm turbo run export:web --filter=@suuudokuuu/app

            - name: Build landing export
              run: pnpm turbo run build --filter=@suuudokuuu/landing

            - name: Resolve Playwright version
              id: playwright-version
              shell: bash
              run: |
                  set -euo pipefail
                  version=$(pnpm --filter @suuudokuuu/web-tests exec node -p "require('@playwright/test/package.json').version")
                  echo "Playwright version: $version"
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

            - name: Install Playwright browsers
              run: pnpm --filter @suuudokuuu/web-tests exec playwright install --with-deps chromium webkit

            - name: Run Playwright web E2E
              run: pnpm --filter @suuudokuuu/web-tests test:e2e

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: |
                      tests/web-tests/playwright-report
                      tests/web-tests/test-results
                  retention-days: 7
