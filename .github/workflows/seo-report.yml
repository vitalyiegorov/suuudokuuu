name: SEO report

on:
    schedule:
        - cron: '0 6 * * 1'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: seo-report
    cancel-in-progress: false

jobs:
    report:
        name: Weekly Search Console and CrUX snapshot
        runs-on: [self-hosted, linux-portable-2x4]
        timeout-minutes: 20
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  token: ${{ secrets.PUSH_TO_PROTECTED_TOKEN }}

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22.x
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate the SEO report
              env:
                  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
                  CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
              run: pnpm --filter @suuudokuuu/landing seo:report

            - name: Commit the snapshot
              run: |
                  set -euo pipefail

                  if [ ! -d reports/seo ]; then
                    echo "No report was written, so there is nothing to commit."
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add reports/seo

                  if git diff --cached --quiet; then
                    echo "No new snapshot to commit."
                    exit 0
                  fi

                  git commit -m "chore: weekly seo snapshot $(date -u +%Y-%m-%d) [skip ci]"
                  git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
                  git push origin "HEAD:${GITHUB_REF_NAME}"
