flows:
  - "flows/*"

platform:
  ios:
    snapshotKeyHonorModalViews: false
    disableAnimations: true
  android:
    disableAnimations: true

onFlowStart:
  - startRecording: 'run-recording'
  - runFlow:
      when:
        visible: 'Open in "suuudokuuu (Preview)"'
      commands:
        - tapOn: Open
onFlowComplete:
  - stopRecording
