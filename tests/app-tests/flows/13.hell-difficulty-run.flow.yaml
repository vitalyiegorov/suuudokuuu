appId: ${APP_ID}
---
- startRecording:
      path: '13.hell-difficulty-run'
      optional: true

- runFlow: subflows/navigation/launch-home.flow.yaml
- tapOn:
      id: 'DifficultyComplexityOptionSelectors.Option.Hell'
- scrollUntilVisible:
      element:
          text: 'Minimum clues'
      direction: DOWN
      timeout: 3000
- assertVisible: 'Minimum clues'
- scrollUntilVisible:
      element:
          id: 'HomeScreenStartButtonEmberSelectors\.(AnimatedRoot|StaticRoot)'
      direction: DOWN
      timeout: 3000
- assertVisible:
      id: 'HomeScreenStartButtonEmberSelectors\.(AnimatedRoot|StaticRoot)'
- runFlow: subflows/game/start-new-game.flow.yaml
- runFlow: subflows/game/quit-current-game.flow.yaml
- scrollUntilVisible:
      element:
          text: 'Minimum clues'
      direction: DOWN
      timeout: 3000
- assertVisible: 'Minimum clues'
- scrollUntilVisible:
      element:
          id: 'HomeScreenStartButtonEmberSelectors\.(AnimatedRoot|StaticRoot)'
      direction: DOWN
      timeout: 3000
- assertVisible:
      id: 'HomeScreenStartButtonEmberSelectors\.(AnimatedRoot|StaticRoot)'
- stopApp
