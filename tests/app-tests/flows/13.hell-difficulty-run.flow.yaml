appId: ${APP_ID}
---
- startRecording:
      path: '13.hell-difficulty-run'
      optional: true

- runFlow: subflows/navigation/launch-home.flow.yaml
# A warm Home keeps its scroll position, so bring the difficulty slider back
# above the fold before tapping (a no-op when it is already visible).
- scrollUntilVisible:
      element:
          id: 'DifficultyComplexityOptionSelectors.Option.Hell'
      direction: UP
      timeout: 3000
- tapOn:
      id: 'DifficultyComplexityOptionSelectors.Option.Hell'
- scrollUntilVisible:
      element:
          id: 'HomeScreenStartButtonEmberSelectors\.(AnimatedRoot|StaticRoot)'
      direction: DOWN
      visibilityPercentage: 50
      timeout: 3000

- runFlow: subflows/game/start-new-game.flow.yaml
# The level+rating pill was removed from the game screen entirely; it now only shows on the
# pause screen and result/history surfaces, so pause the run to see it.
- assertNotVisible:
      id: 'GameScreenSelectors.Level'
- runFlow: subflows/game/pause-current-game.flow.yaml
# Hell puzzles always carry a computed rating, so the pause pill composes it into the level text.
- assertVisible:
      id: 'PauseScreenSelectors.DetailsValue'
      text: '.*Hell · [0-9]+\.[0-9].*'
- tapOn:
      id: 'PauseScreenSelectors.ResumeButton'
- extendedWaitUntil:
      visible:
          id: 'GameScreenSelectors.Root'
      timeout: 10000
- runFlow: subflows/game/quit-current-game.flow.yaml

- scrollUntilVisible:
      element:
          id: 'HomeScreenStartButtonEmberSelectors\.(AnimatedRoot|StaticRoot)'
      direction: DOWN
      visibilityPercentage: 50
      timeout: 3000
