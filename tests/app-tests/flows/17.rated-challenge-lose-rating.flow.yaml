appId: ${APP_ID}
---
- startRecording:
      path: '17.rated-challenge-lose-rating'
      optional: true

# losingSharedChallengeEncodedConstant's field/timeline re-encoded with a real rating trailer (see
# tests/web-tests/AGENTS.md's ratedLosingSharedChallengeEncodedConstant fixture note), so the rival
# state carries a rating and the badge renders on a loss too.
- runFlow: subflows/navigation/launch-home.flow.yaml
- runFlow:
      file: subflows/shared/open-shared-challenge.flow.yaml
      env:
          SHARED_CHALLENGE_LINK: suuudokuuu://shared/_OQP3__7X7_7r____zMOSjkyv8nqM0LfkydkEBSLStwgSBis7M6rv28ZIIAIiAZAgAAEKAA
- runFlow: subflows/shared/accept-shared-challenge.flow.yaml
- assertVisible:
      id: 'ChallengeRaceHudSelectors.Root'
# Cell 0-4's answer is not 4 in this fixture, so entering 4 three times
# registers three mistakes (deterministic, well under the challenge timer).
- tapOn:
      id: 'CellSelectors.Cell.0-4'
- tapOn:
      id: 'AvailableValueItemSelectors.Button.4'
- extendedWaitUntil:
      visible: '1/3'
      timeout: 3000
- tapOn:
      id: 'AvailableValueItemSelectors.Button.4'
- assertVisible: '2/3'
- tapOn:
      id: 'AvailableValueItemSelectors.Button.4'
- extendedWaitUntil:
      visible:
          id: 'ChallengeResultScreenSelectors.Root'
      timeout: 5000
# The outcome pill now composes "{flavor} · {level} · {rating} · {mistakes type}" as plain text
# instead of rendering a separate rating badge next to it.
- assertVisible:
      id: 'ChallengeResultScreenSelectors.OutcomeValue'
      text: '.* · [0-9]+\.[0-9]\+? · .*'
- tapOn:
      id: 'ChallengeTryAgainButtonSelectors.Root'
- extendedWaitUntil:
      visible:
          id: 'GameScreenSelectors.Root'
      timeout: 5000
- runFlow: subflows/game/quit-current-game.flow.yaml
- stopApp
