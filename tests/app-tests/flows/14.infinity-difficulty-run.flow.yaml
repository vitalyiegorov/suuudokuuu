appId: ${APP_ID}
---
- startRecording:
      path: '14.infinity-difficulty-run'
      optional: true

# 1. Picking Infinity on the Home difficulty slider serves a curated
# world-record puzzle (Everest/Platinum Blonde/AI Escargot class), which
# always carries an exact, non-ceiling SE rating - unlike Hell's clamped one.
- runFlow: subflows/navigation/launch-home.flow.yaml
- tapOn:
      id: 'DifficultyComplexityOptionSelectors.Option.Infinity'
# The description lives in the preview card below the mistake grid, which starts
# below the fold on a 720x1280 Android viewport: it lays out past y=1184, exactly
# where com.android.systemui:id/navigation_bar_frame begins, so it never enters
# the accessibility hierarchy and no wait can make it appear. Scroll it into view
# the way a player would, the same way flows/13 reaches the start button.
- scrollUntilVisible:
      element:
          text: 'World-record puzzles'
      direction: DOWN
      visibilityPercentage: 50
      timeout: 3000
- runFlow: subflows/game/start-new-game.flow.yaml
# The level+rating pill was removed from the game screen entirely; it now only shows on the
# pause screen and result/history surfaces, so pause the run to see it. This also means the
# rating explainer is no longer reachable from the in-game flow: the game screen no longer has
# a rating control, and the pause screen's level pill is plain text. The explainer stays
# reachable from the Stats screen's hardest-solve hero (see flows/15).
- assertNotVisible:
      id: 'GameScreenSelectors.Level'
- runFlow: subflows/game/pause-current-game.flow.yaml
# Curated Infinity puzzles carry an exact SE rating (occasionally beyond the display ceiling,
# which adds a "+" suffix), so the exact number and ceiling suffix vary with the puzzle drawn.
- assertVisible:
      id: 'PauseScreenSelectors.DetailsValue'
      text: '.*Infinity · [0-9]+\.[0-9]\+? • .*'
- tapOn:
      id: 'PauseScreenSelectors.ResumeButton'
- extendedWaitUntil:
      visible:
          id: 'GameScreenSelectors.Root'
      timeout: 10000
- runFlow: subflows/game/quit-current-game.flow.yaml

# 2. Shared Infinity links round-trip the rating end to end. The fixture
# below is a Puzzle-kind share of a real Infinity corpus puzzle (21 clues)
# with the encoder's explicit difficulty trailer set to Infinity, proving it
# decodes as Infinity instead of colliding with Nightmare's blank-count
# inference, and that the curated rating survives the share/open round trip.
- openLink:
      link: 'suuudokuuu://shared/_MAMJlEGYQgogQQwoQHLAZUKyZ9jOXdg'
- extendedWaitUntil:
      visible:
          id: 'SharedScreenSelectors.Root'
      timeout: 10000
- assertVisible:
      id: 'SharedScreenSelectors.Meta'
- assertVisible: 'Infinity · 11.9'
- tapOn:
      id: 'SharedScreenSelectors.ConfirmButton'
- extendedWaitUntil:
      visible:
          id: 'GameScreenSelectors.Root'
      timeout: 10000
- assertNotVisible:
      id: 'GameScreenSelectors.Level'
- runFlow: subflows/game/pause-current-game.flow.yaml
- assertVisible:
      id: 'PauseScreenSelectors.DetailsValue'
      text: '.*Infinity · 11\.9.*'
- tapOn:
      id: 'PauseScreenSelectors.ResumeButton'
- extendedWaitUntil:
      visible:
          id: 'GameScreenSelectors.Root'
      timeout: 10000
- runFlow: subflows/game/quit-current-game.flow.yaml

- stopApp
