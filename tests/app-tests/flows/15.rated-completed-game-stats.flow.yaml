appId: ${APP_ID}
---
- startRecording:
      path: '15.rated-completed-game-stats'
      optional: true

# This fixture is winningSharedChallengeEncodedConstant's field/timeline re-encoded with a real
# rating trailer (see tests/web-tests/AGENTS.md's ratedWinningSharedChallengeEncodedConstant fixture
# note), so completing it produces a genuinely rated Newbie completed game.
- runFlow: subflows/navigation/launch-home.flow.yaml
- runFlow:
      file: subflows/shared/complete-winning-shared-challenge.flow.yaml
      env:
          SHARED_CHALLENGE_LINK: suuudokuuu://shared/_OWP________9____qXF6FFdMjBWGhJIN-CMqSm5omCUw0KFUm6-t2HxLUAuYMARgH-IAABCg
- scrollUntilVisible:
      element:
          id: 'ChallengeResultFooterSelectors.HomeButton'
      direction: DOWN
      timeout: 10000
- tapOn:
      id: 'ChallengeResultFooterSelectors.HomeButton'
- extendedWaitUntil:
      visible:
          id: 'HomeScreenSelectors.Root'
      timeout: 10000
- tapOn:
      id: 'MainTabSelectors.Stats'
- extendedWaitUntil:
      visible:
          id: 'HistoryScreenSelectors.Root'
      timeout: 10000
- assertVisible:
      id: 'HistoryTechniquesSelectors.Root'
- assertVisible:
      id: 'HistoryTechniquesSelectors.BestTechnique'
- scrollUntilVisible:
      element:
          text: '.*games? played.*'
      direction: DOWN
# The scroll above stops as soon as the row's subtitle line appears, while its
# tappable centre still sits under the floating tab bar, so scroll once more to
# lift the row clear of the bar before tapping it.
- scroll
- tapOn:
      id: 'HistoryDifficultySelectors.Card.Newbie'
- extendedWaitUntil:
      visible:
          id: 'HistoryGamesScreenSelectors.Root'
      timeout: 10000
# The completed-game row composes its rating into the difficulty text instead of rendering a
# separate badge next to it.
- assertVisible:
      id: 'CompletedGameItemSelectors.DifficultyValue'
      text: '.* · [0-9]+\.[0-9].*'
- tapOn:
      id: 'HeaderBackButtonSelectors.Root'
- extendedWaitUntil:
      visible:
          id: 'HistoryScreenSelectors.Root'
      timeout: 10000
- scrollUntilVisible:
      element:
          id: 'HistorySolverProfileSelectors.HardestSolve'
      direction: DOWN
- scrollUntilVisible:
      element:
          id: 'HistorySolverProfileSelectors.Spectrum'
      direction: DOWN
- openLink:
      link: 'suuudokuuu://'
- extendedWaitUntil:
      visible:
          id: 'HomeScreenSelectors.Root'
      timeout: 10000
