appId: ${APP_ID}
tags:
    - seed-rated-history
---
- startRecording:
      path: '15.rated-completed-game-stats'
      optional: true

- runFlow: subflows/navigation/launch-home.flow.yaml
- runFlow: subflows/navigation/open-history.flow.yaml
- assertVisible:
      id: 'HistoryTechniquesSelectors.Root'
- assertVisible:
      id: 'HistoryTechniquesSelectors.BestTechnique'
- scrollUntilVisible:
      element:
          text: '.*games? played.*'
      direction: DOWN
# The scroll above stops as soon as the row's subtitle line appears, while its
# tappable centre still sits under the floating tab bar, so scroll once more to
# lift the row clear of the bar before tapping it.
- scroll
- tapOn:
      id: 'HistoryDifficultySelectors.Card.Newbie'
- extendedWaitUntil:
      visible:
          id: 'HistoryGamesScreenSelectors.Root'
      timeout: 10000
# The completed-game row composes its rating into the difficulty text instead of rendering a
# separate badge next to it.
- assertVisible:
      id: 'CompletedGameItemSelectors.DifficultyValue'
      text: '.* · [0-9]+\.[0-9].*'
- tapOn:
      id: 'HeaderBackButtonSelectors.Root'
- extendedWaitUntil:
      visible:
          id: 'HistoryScreenSelectors.Root'
      timeout: 10000
- scrollUntilVisible:
      element:
          id: 'HistorySolverProfileSelectors.HardestSolve'
      direction: DOWN
- scrollUntilVisible:
      element:
          id: 'HistorySolverProfileSelectors.Spectrum'
      direction: DOWN
- openLink:
      link: 'suuudokuuu://'
- extendedWaitUntil:
      visible:
          id: 'HomeScreenSelectors.Root'
      timeout: 10000
