appId: ${APP_ID}
---
- startRecording:
    path: '02.game-screen-win'
    optional: true

- repeat:
    times: 3
    while:
      notVisible: 'Open puzzle'
    commands:
      - openLink:
          link: suuudokuuu://shared/_IGP________9____qXF6FFdMjBWGhJIN-CMqSm5omCUw0KFUm6-t2HxLUAuYMA
      - runFlow:
          when:
            visible: 'Open in.*'
          commands:
            - tapOn: 'Open'
      - waitForAnimationToEnd:
          timeout: 3000

- extendedWaitUntil:
    visible: 'Open puzzle'
    timeout: 10000
- tapOn: 'Open puzzle'
- tapOn:
    id: 'CellSelectors.Root'
    index: 54
- tapOn:
    id: 'AvailableValueItemSelectors.Button'
    index: 0
- assertVisible: Winners-winner, .*
- assertVisible: You have scored.*
- assertVisible: Help Ukraine win!
- tapOn: 'Play again'
- assertVisible: 'Start new'
