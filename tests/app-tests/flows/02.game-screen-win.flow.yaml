appId: ${APP_ID}
---
- startRecording:
      path: '02.game-screen-win'
      optional: true

- runFlow: subflows/navigation/launch-home.flow.yaml
- runFlow:
      file: subflows/shared/complete-winning-shared-challenge.flow.yaml
      env:
          SHARED_CHALLENGE_LINK: suuudokuuu://shared/_KGP________9____qXF6FFdMjBWGhJIN-CMqSm5omCUw0KFUm6-t2HxLUAuYMCP-
- assertVisible:
      id: 'ChallengeResultScreenSelectors.YourTimeValue'
- assertVisible:
      id: 'ChallengeResultScreenSelectors.OpponentTimeValue'
- assertVisible: '.*You beat your rival.*'
- assertVisible:
      id: 'ChallengeResultScreenSelectors.MarginValue'
# The result screen's trophy medallion used to pulse forever
# (CelebrationPulse's withRepeat(..., -1)), and a continuously-animating
# Reanimated view makes every XCUITest accessibility-snapshot poll slower,
# independent of runner load, which could starve scrollUntilVisible's
# check-then-swipe loop before it ever reached this element. The pulse is
# now bounded (CelebrationPulseRepeatCount) and settles a few seconds after
# the screen mounts, well before this step runs, so the timeout below is a
# scroll-distance budget, not an animation-settle budget.
- scrollUntilVisible:
      element:
          id: 'ChallengeResultScreenSelectors.UkraineSupportCta'
      direction: DOWN
      visibilityPercentage: 50
      timeout: 30000
      waitToSettleTimeoutMs: 500
- tapOn:
      id: 'ChallengeResultFooterSelectors.HomeButton'
- extendedWaitUntil:
      visible:
          id: 'HomeScreenSelectors.Root'
      timeout: 3000
