appId: ${APP_ID}
---
- startRecording:
    path: '02.game-screen-win'
    optional: true

- launchApp
- openLink:
    link: suuudokuuu://shared/IzAMC4AAAKBEBQDAAHASfAwQAgM4AQAhgGQEUBoAQQASBWAcIAgBXrAE4BMAUgZICcAYgKpkAmAFdQAMQAGABYDZAYwBRYgPMBIAE8UAFAEMASAGIALFQCpAZEMA3AAoArgLL2A1ReUAWgOoApAGfpABr9VABmW34AFfl5AECcADoARIAdgB4AcwAqgE%2BAfYASgDAAIIAGgDiADAARgA8AZpqAYrq6bkMAMoBNIl6AWoAOAHOAWIAQcPAAGwAhAAGAJnAATjXgcGAgA
- runFlow:
    when:
      visible: 'Open in.*'
    commands:
      - tapOn: 'Open'

- extendedWaitUntil:
    visible: 'Open puzzle'
    timeout: 10000
- tapOn: 'Open puzzle'
- tapOn:
    id: 'CellSelectors.Root'
    index: 54
- tapOn:
    id: 'AvailableValueItemSelectors.Button'
    index: 0
- assertVisible: Winners-winner, .*
- assertVisible: You have scored.*
- assertVisible: Help Ukraine win!
- tapOn: 'Play again'
- assertVisible: 'Start new'
- stopApp
