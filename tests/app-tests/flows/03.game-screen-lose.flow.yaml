appId: ${APP_ID}
---
- startRecording:
    path: '03.game-screen-lose'
    optional: true

- runFlow: subflows/navigation/launch-home.flow.yaml
- runFlow:
    file: subflows/shared/open-shared-challenge.flow.yaml
    env:
      SHARED_CHALLENGE_LINK: suuudokuuu://shared/IwBmC4EAAAA0EQDBACAFQTAMOoIECQAggCIB0AY%2BAKoE4BxgRoAgAiAEwByAsgFLwDKAmhW4A2WgBUAzwHyAJHgAhARQBYASQBSASwC54ABQBQ5gEqAqgCaAQwC0A0oYL0RAGQCLAbYDUAdwAOAHIAhgALAN0A7EQAbwD6AMwAjzggAEYAyADCABIA0QAoAMf5PgAJAE4ASgDKdgCZAPEALADlACKJAAWd8eAAkMwAAxDxEMBAA
- runFlow: subflows/shared/accept-shared-challenge.flow.yaml
- assertVisible: '0/3'
- tapOn:
    id: 'CellSelectors.Root'
    index: 4
- tapOn:
    id: 'AvailableValueItemSelectors.Button'
    index: 0
- assertVisible: '1/3'
- tapOn:
    id: 'AvailableValueItemSelectors.Button'
    index: 0
- assertVisible: '2/3'
- tapOn:
    id: 'AvailableValueItemSelectors.Button'
    index: 0
- extendedWaitUntil:
    visible: 'Challenge lost!'
    timeout: 5000
- assertVisible: 'Better luck next time!'
- assertVisible:
    id: 'ChallengeTryAgainButtonSelectors.Root'
- tapOn:
    id: 'PlayAgainButtonSelectors.Root'
- extendedWaitUntil:
    visible:
      id: 'HomeScreenSelectors.Root'
    timeout: 3000
- stopApp
