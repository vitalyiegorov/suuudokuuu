appId: ${APP_ID}
---
- startRecording:
    path: '03.game-screen-lose'
    optional: true

- runFlow: subflows/navigation/launch-home.flow.yaml
- runFlow:
    file: subflows/shared/open-shared-challenge.flow.yaml
    env:
      SHARED_CHALLENGE_LINK: suuudokuuu://shared/IwBmC4EAAAA0EQDBACAFQTAMOoIECQAggCIB0AY%2BAKoE4BxgRoAgAiAEwByAsgFLwDKAmhW4A2WgBUAzwHyAJHgAhARQBYASQBSASwC54ABQBQ5gEqAqgCaAQwC0A0oYL0RAGQCLAbYDUAdwAOAHIAhgALAN0A7EQAbwD6AMwAjzggAEYAyADCABIA0QAoAMf5PgAJAE4ASgDKdgCZAPEALADlACKJAAWd8eAAkMwAAxDxEMBAA
- runFlow: subflows/shared/accept-shared-challenge.flow.yaml
- assertVisible: '0/3'
# Cell 0-4's answer is not 4 in this fixture, so entering 4 three times
# registers three mistakes (deterministic, well under the challenge timer).
- tapOn:
    id: 'CellSelectors.Cell.0-4'
- tapOn:
    id: 'AvailableValueItemSelectors.Button.4'
- extendedWaitUntil:
    visible: '1/3'
    timeout: 3000
- tapOn:
    id: 'AvailableValueItemSelectors.Button.4'
- assertVisible: '2/3'
- tapOn:
    id: 'AvailableValueItemSelectors.Button.4'
- extendedWaitUntil:
    visible:
      id: 'ChallengeResultScreenSelectors.Root'
    timeout: 5000
- assertVisible:
    id: 'ChallengeResultScreenSelectors.YourTimeValue'
- assertVisible:
    id: 'ChallengeResultScreenSelectors.OpponentTimeValue'
- assertVisible:
    id: 'ChallengeResultScreenSelectors.ScoreValue'
- scrollUntilVisible:
    element:
      id: 'ChallengeTryAgainButtonSelectors.Root'
    direction: DOWN
    timeout: 3000
- assertVisible:
    id: 'ChallengeTryAgainButtonSelectors.Root'
- scrollUntilVisible:
    element:
      id: 'PlayAgainButtonSelectors.Root'
    direction: DOWN
    timeout: 3000
- tapOn:
    id: 'PlayAgainButtonSelectors.Root'
- extendedWaitUntil:
    visible:
      id: 'HomeScreenSelectors.Root'
    timeout: 3000
- stopApp
