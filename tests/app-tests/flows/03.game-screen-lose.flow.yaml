appId: ${APP_ID}
---
- startRecording:
      path: '03.game-screen-lose'
      optional: true

- runFlow: subflows/navigation/launch-home.flow.yaml
- runFlow:
      file: subflows/shared/open-shared-challenge.flow.yaml
      env:
          SHARED_CHALLENGE_LINK: suuudokuuu://shared/_KAP3__7X7_7r____zMOSjkyv8nqM0LfkydkEBSLStwgSBis7M6rv28ZIIBEZAA
- runFlow: subflows/shared/accept-shared-challenge.flow.yaml
- assertVisible:
      id: 'ChallengeRaceHudSelectors.Root'
- assertVisible: '0/3'
# Cell 0-4's answer is not 4 in this fixture, so entering 4 three times
# registers three mistakes (deterministic, well under the challenge timer).
- tapOn:
      id: 'CellSelectors.Cell.0-4'
- tapOn:
      id: 'AvailableValueItemSelectors.Button.4'
- extendedWaitUntil:
      visible: '1/3'
      timeout: 3000
- tapOn:
      id: 'AvailableValueItemSelectors.Button.4'
- extendedWaitUntil:
      visible: '2/3'
      timeout: 3000
- tapOn:
      id: 'AvailableValueItemSelectors.Button.4'
# Assert the OutcomeValue pill instead of the screen's own Root: on iOS a
# parent .Root testID can fail to register in the accessibility snapshot even
# once the screen is fully mounted and visible, while a child element in the
# same render commit reliably does (see the store-media skill's environment
# gotchas).
- extendedWaitUntil:
      visible:
          id: 'ChallengeResultScreenSelectors.OutcomeValue'
      timeout: 5000
- assertVisible:
      id: 'ChallengeResultScreenSelectors.YourTimeValue'
- assertVisible:
      id: 'ChallengeResultScreenSelectors.OpponentTimeValue'
- assertVisible: '.*Out of mistakes.*'
- assertVisible: 'Did not finish the board'
- assertVisible:
      id: 'ChallengeTryAgainButtonSelectors.Root'
- tapOn:
      id: 'ChallengeTryAgainButtonSelectors.Root'
- extendedWaitUntil:
      visible:
          id: 'GameScreenSelectors.Root'
      timeout: 5000
- runFlow: subflows/game/quit-current-game.flow.yaml
- stopApp
