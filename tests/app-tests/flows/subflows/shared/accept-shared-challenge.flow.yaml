appId: ${APP_ID}
---
# On a warm app the challenge-accept screen arrives through an animated JS
# transition, and an accept tap that lands mid-transition is reported as
# tapped yet never reaches the button (CI run 33361500366, flows 02 and 03) —
# retryTapIfNoChange does not cover it. Retry the handoff once, the same way
# subflows/shared/open-shared-handoff.flow.yaml retries its confirm.
- retry:
    maxRetries: 1
    commands:
        - tapOn:
              id: 'ChallengeAcceptScreenSelectors.AcceptButton'
              retryTapIfNoChange: true
        - extendedWaitUntil:
              visible:
                  id: 'GameScreenSelectors.Root'
              timeout: 10000
