appId: ${APP_ID}
---
- retry:
      maxRetries: 1
      commands:
          - openLink:
                link: ${SHARED_HANDOFF_LINK}
          - extendedWaitUntil:
                visible:
                    id: 'SharedScreenSelectors.Root'
                timeout: 10000
- tapOn:
      id: 'SharedScreenSelectors.ConfirmButton'
- extendedWaitUntil:
      visible:
          id: 'GameScreenSelectors.Root'
      timeout: 10000
