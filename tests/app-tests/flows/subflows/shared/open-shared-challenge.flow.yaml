appId: ${APP_ID}
---
- retry:
    maxRetries: 1
    commands:
      - openLink:
          link: ${SHARED_CHALLENGE_LINK}
      - runFlow:
          when:
            visible: 'Open in.*'
          commands:
            - tapOn: 'Open'
      - extendedWaitUntil:
          visible:
            id: 'ChallengeAcceptScreenSelectors.AcceptButton'
          timeout: 10000
