appId: ${APP_ID}
---
# Every scenario ends at Home (the Home teardown contract) and no scenario
# stops the app any more, so the warm app is usually already exactly where
# this subflow must deliver. Cold-launch through the landing screen only when
# Home is absent: the shard's very first session, or after a recovery reset.
- evalScript: ${output.homeVisible = false}
- runFlow:
      when:
          visible:
              id: 'HomeScreenSelectors.Root'
      commands:
          - evalScript: ${output.homeVisible = true}
- runFlow:
      when:
          true: ${!output.homeVisible}
      commands:
          - launchApp:
                clearState: false
          - tapOn: 'Play'
          - extendedWaitUntil:
                visible:
                    id: 'HomeScreenSelectors.Root'
                timeout: 15000
- assertVisible:
      id: 'HomeScreenSelectors.Root'
