appId: ${APP_ID}
---
- extendedWaitUntil:
    visible: 'There was a problem loading the project.'
    timeout: 3000
    optional: true
- runFlow:
    when:
      visible: 'There was a problem loading the project.'
    commands:
      - runFlow: accept-open-link-prompt.flow.yaml
- runFlow:
    when:
      visible: 'There was a problem loading the project.'
    commands:
      - tapOn: 'Reload'
      - waitForAnimationToEnd
      - runFlow: accept-open-link-prompt.flow.yaml
