appId: ${APP_ID}
tags:
    - seed-rated-result
---
- startRecording:
      path: '16.rated-challenge-win-rating'
      optional: true

- runFlow: subflows/navigation/launch-home.flow.yaml
- openLink:
      link: 'suuudokuuu://challenge-won'
- extendedWaitUntil:
      visible:
          id: 'ChallengeResultScreenSelectors.OutcomeValue'
      timeout: 15000
# The outcome pill now composes "{flavor} · {level} · {rating} · {mistakes type}" as plain text
# instead of rendering a separate rating badge next to it.
- assertVisible:
      id: 'ChallengeResultScreenSelectors.OutcomeValue'
      text: '.* · [0-9]+\.[0-9]\+? · .*'
- scrollUntilVisible:
      element:
          id: 'ChallengeResultFooterSelectors.HomeButton'
      direction: DOWN
      timeout: 10000
- tapOn:
      id: 'ChallengeResultFooterSelectors.HomeButton'
- extendedWaitUntil:
      visible:
          id: 'HomeScreenSelectors.Root'
      timeout: 10000
