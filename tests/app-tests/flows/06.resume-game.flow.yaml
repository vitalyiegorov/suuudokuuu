appId: ${APP_ID}
---
- startRecording:
    path: '06.resume-game'
    optional: true

- runFlow: subflows/navigation/launch-home.flow.yaml
- runFlow: subflows/game/start-new-game.flow.yaml
- runFlow: subflows/game/open-settings-from-game.flow.yaml
- tapOn:
    id: 'HeaderBackButtonSelectors.Root'
- extendedWaitUntil:
    visible:
      id: 'PauseScreenSelectors.Root'
    timeout: 3000
- assertVisible:
    id: 'PauseScreenSelectors.ProgressValue'
- assertVisible:
    id: 'PauseScreenSelectors.TimeValue'
- copyTextFrom:
    id: 'PauseScreenSelectors.TimeValue'
- evalScript: ${output.firstPausedSeconds = Number(maestro.copiedText.split(':')[0]) * 60 + Number(maestro.copiedText.split(':')[1])}
- extendedWaitUntil:
    visible:
      id: 'ResumeGameSelectors.IntentionalWaitTarget'
    timeout: 2000
    optional: true
- copyTextFrom:
    id: 'PauseScreenSelectors.TimeValue'
- evalScript: ${output.secondPausedSeconds = Number(maestro.copiedText.split(':')[0]) * 60 + Number(maestro.copiedText.split(':')[1])}
- assertTrue:
    condition: ${output.secondPausedSeconds === output.firstPausedSeconds}
    label: Timer stays unchanged while paused
- assertVisible:
    id: 'PauseScreenSelectors.ScoreValue'
- assertVisible:
    id: 'PauseScreenSelectors.QuitButton'
- assertNotVisible:
    id: 'CellSelectors.Root'
- tapOn:
    id: 'PauseScreenSelectors.ResumeButton'
- extendedWaitUntil:
    visible:
      id: 'GameScreenSelectors.Root'
    timeout: 3000
- assertVisible:
    id: 'CellSelectors.Root'
- extendedWaitUntil:
    visible:
      id: 'ResumeGameSelectors.IntentionalWaitTarget'
    timeout: 2000
    optional: true
- runFlow: subflows/game/open-settings-from-game.flow.yaml
- tapOn:
    id: 'HeaderBackButtonSelectors.Root'
- extendedWaitUntil:
    visible:
      id: 'PauseScreenSelectors.Root'
    timeout: 3000
- copyTextFrom:
    id: 'PauseScreenSelectors.TimeValue'
- evalScript: ${output.resumedSeconds = Number(maestro.copiedText.split(':')[0]) * 60 + Number(maestro.copiedText.split(':')[1])}
- assertTrue:
    condition: ${output.resumedSeconds > output.firstPausedSeconds}
    label: Timer advances after resuming gameplay
- stopApp
- runFlow: subflows/navigation/relaunch-home.flow.yaml
- assertVisible:
    id: 'HomeScreenSelectors.ResumeButton'
- tapOn:
    id: 'HomeScreenSelectors.ResumeButton'
- extendedWaitUntil:
    visible:
      id: 'GameScreenSelectors.Root'
    timeout: 30000
- runFlow: subflows/navigation/close-dev-menu-if-visible.flow.yaml
- runFlow: subflows/navigation/move-dev-tools-button-away-if-visible.flow.yaml
- assertVisible:
    id: 'CellSelectors.Root'
- assertVisible:
    id: 'AvailableValueItemSelectors.Button'
- runFlow: subflows/game/quit-current-game.flow.yaml
- stopApp
