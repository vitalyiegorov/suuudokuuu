appId: ${APP_ID}
---
- startRecording:
      path: '14.hint-flow'
      optional: true

- runFlow: subflows/navigation/launch-home.flow.yaml
- runFlow:
      file: subflows/shared/open-shared-handoff.flow.yaml
      env:
          SHARED_HANDOFF_LINK: suuudokuuu://shared/_MANQGaciM0yz__9dFFCq5FGCkeArJsaswTCLjQ9JvkaI
- tapOn:
      id: 'HintButtonSelectors.Root'
- extendedWaitUntil:
      visible:
          id: 'HintPanelSelectors.Root'
      timeout: 10000
- assertVisible:
      id: 'HintStepNarrationSelectors.Technique'
- assertVisible:
      id: 'HintStepNarrationSelectors.Narration'
- assertNotVisible:
      id: 'HintPanelSelectors.Progress'
- tapOn:
      id: 'HintPanelSelectors.ShowMoreButton'
- assertNotVisible:
      id: 'HintPanelSelectors.Progress'
- tapOn:
      id: 'HintPanelSelectors.ShowMoreButton'
- assertVisible:
      id: 'HintPanelSelectors.Progress'
- tapOn:
      id: 'HintPanelSelectors.NextButton'
- tapOn:
      id: 'HintPanelSelectors.BackButton'
- tapOn:
      id: 'HintPanelSelectors.NextButton'
- tapOn:
      id: 'HintPanelSelectors.RevealButton'
- extendedWaitUntil:
      visible:
          id: 'HintStepNarrationSelectors.Technique'
          text: 'Reveal'
      timeout: 3000
- tapOn:
      id: 'HintPanelSelectors.DismissButton'
- tapOn:
      id: 'HintButtonSelectors.Root'
- repeat:
      times: 2
      commands:
          - tapOn:
                id: 'HintPanelSelectors.ShowMoreButton'
- tapOn:
      id: 'HintPanelSelectors.NextButton'
- tapOn:
      id: 'HintPanelSelectors.ApplyButton'
- assertNotVisible:
      id: 'HintPanelSelectors.Root'
- assertVisible:
      id: 'CellSelectors.Cell.2.1'
      text: 'Row 3, column 2, 4'
- runFlow: subflows/game/quit-current-game.flow.yaml
- runFlow:
      file: subflows/shared/open-shared-handoff.flow.yaml
      env:
          SHARED_HANDOFF_LINK: suuudokuuu://shared/_MANQGaciM0yz__9dFFCq5FGCkeArJsaswTCLjQ9JvkaI
- tapOn:
      id: 'HintButtonSelectors.Root'
- repeat:
      times: 2
      commands:
          - tapOn:
                id: 'HintPanelSelectors.ShowMoreButton'
- repeat:
      times: 3
      commands:
          - tapOn:
                id: 'HintPanelSelectors.NextButton'
- tapOn:
      id: 'HintPanelSelectors.RevealButton'
- extendedWaitUntil:
      visible:
          id: 'HintStepNarrationSelectors.Technique'
          text: 'Reveal'
      timeout: 3000
- tapOn:
      id: 'HintPanelSelectors.NextButton'
- tapOn:
      id: 'HintPanelSelectors.ApplyButton'
- assertNotVisible:
      id: 'HintPanelSelectors.Root'
- runFlow: subflows/game/quit-current-game.flow.yaml
