appId: ${APP_ID}
---
- startRecording:
      path: '10.themes-screen'
      optional: true

- runFlow: subflows/navigation/launch-home.flow.yaml
# Retry the tab handoff once: on the warm app the first tap after a flow
# lands at Home is occasionally consumed without reaching the tab bar (CI run
# 33395276746: Settings never mounted after a reported tap), the same
# mid-transition swallow the shared accept/confirm subflows already retry.
- retry:
      maxRetries: 1
      commands:
          - tapOn:
                id: 'MainTabSelectors.Settings'
          - extendedWaitUntil:
                visible:
                    id: 'SettingsScreenSelectors.Root'
                timeout: 10000
# Center the row so it clears both the collapsed header band and the floating
# tab bar: an edge row registers the tap on whichever chrome overlaps it.
- scrollUntilVisible:
      element:
          id: 'SettingsScreenSelectors.ThemeOption'
      direction: DOWN
      centerElement: true
      visibilityPercentage: 100
- tapOn:
      id: 'SettingsScreenSelectors.ThemeOption'
- extendedWaitUntil:
      visible:
          id: 'themes-screen'
      timeout: 10000
- assertVisible: 'Presets'
- extendedWaitUntil:
      visible:
          id: 'themes-screen-create-button'
      timeout: 10000
- tapOn:
      id: 'themes-screen-create-button'
- extendedWaitUntil:
      visible:
          id: 'theme-editor-screen'
      timeout: 10000
- tapOn:
      id: 'theme-editor-screen-name-input'
- eraseText
- inputText: 'Maestro theme'
# The soft keyboard covers the sticky-footer Save button on both platforms
# (proven by identical iOS/Android failures), so dismiss it before asserting
# footer chrome.
- hideKeyboard
- extendedWaitUntil:
      visible:
          id: 'theme-editor-screen-save-button'
      timeout: 10000
- tapOn:
      id: 'theme-editor-screen-save-button'
- extendedWaitUntil:
      visible:
          id: 'themes-screen'
      timeout: 10000
# The created theme lists below the presets, past the fold on the shorter
# Android viewport, so scroll it into view instead of asserting in place.
- scrollUntilVisible:
      element:
          text: 'Maestro theme'
      direction: DOWN
- tapOn:
      id: 'HeaderBackButtonSelectors.Root'
- extendedWaitUntil:
      visible:
          id: 'SettingsScreenSelectors.Root'
      timeout: 10000
- scrollUntilVisible:
      element:
          text: 'Maestro theme'
      direction: DOWN
- scrollUntilVisible:
      element:
          id: 'MainTabSelectors.Play'
      direction: UP
      timeout: 10000
- tapOn:
      id: 'MainTabSelectors.Play'
- extendedWaitUntil:
      visible:
          id: 'HomeScreenSelectors.Root'
      timeout: 10000
