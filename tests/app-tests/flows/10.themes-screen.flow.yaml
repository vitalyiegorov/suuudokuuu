appId: ${APP_ID}
---
- startRecording:
      path: '10.themes-screen'
      optional: true

- runFlow: subflows/navigation/launch-home.flow.yaml
# Retry the tab handoff once: on the warm app the first tap after a flow
# lands at Home is occasionally consumed without reaching the tab bar (CI run
# 33395276746: Settings never mounted after a reported tap), the same
# mid-transition swallow the shared accept/confirm subflows already retry.
- retry:
      maxRetries: 1
      commands:
          - tapOn: 'Settings'
          - extendedWaitUntil:
                visible:
                    id: 'SettingsScreenSelectors.Root'
                timeout: 5000
- scrollUntilVisible:
      element:
          id: 'SettingsScreenSelectors.ThemeOption'
      direction: DOWN
# Overscroll past the target so the row sits above the floating tab bar;
# a bottom-edge row registers the tap on the bar's blur surface on Android.
# Target the Animations row by id: iOS merges the row into one accessibility
# element whose label is "title, description", so its bare title text never
# matches there.
- scrollUntilVisible:
      element:
          id: 'SettingsScreenSelectors.MotionOption'
      direction: DOWN
- tapOn:
      id: 'SettingsScreenSelectors.ThemeOption'
- extendedWaitUntil:
      visible:
          id: 'themes-screen'
      timeout: 3000
- assertVisible: 'Presets'
- extendedWaitUntil:
      visible:
          id: 'themes-screen-create-button'
      timeout: 3000
- tapOn:
      id: 'themes-screen-create-button'
- extendedWaitUntil:
      visible:
          id: 'theme-editor-screen'
      timeout: 3000
- tapOn:
      id: 'theme-editor-screen-name-input'
- eraseText
- inputText: 'Maestro theme'
# The soft keyboard covers the sticky-footer Save button on both platforms
# (proven by identical iOS/Android failures), so dismiss it before asserting
# footer chrome.
- hideKeyboard
- extendedWaitUntil:
      visible:
          id: 'theme-editor-screen-save-button'
      timeout: 3000
- tapOn:
      id: 'theme-editor-screen-save-button'
- extendedWaitUntil:
      visible:
          id: 'themes-screen'
      timeout: 3000
# The created theme lists below the presets, past the fold on the shorter
# Android viewport, so scroll it into view instead of asserting in place.
- scrollUntilVisible:
      element:
          text: 'Maestro theme'
      direction: DOWN
- tapOn:
      id: 'HeaderBackButtonSelectors.Root'
- extendedWaitUntil:
      visible:
          id: 'SettingsScreenSelectors.Root'
      timeout: 3000
- scrollUntilVisible:
      element:
          text: 'Maestro theme'
      direction: DOWN
- tapOn:
      id: 'HeaderBackButtonSelectors.Root'
- extendedWaitUntil:
      visible:
          id: 'HomeScreenSelectors.Root'
      timeout: 3000
