appId: ${APP_ID}
---
- startRecording:
    path: '05.settings-screen'
    optional: true

- runFlow: subflows/navigation/launch-home.flow.yaml
- tapOn: 'Settings'
- extendedWaitUntil:
    visible:
      id: 'SettingsScreenSelectors.Root'
    timeout: 3000
- assertVisible: 'Game'
- assertVisible: 'Language.*'
- assertVisible: 'Number size.*'
- assertVisible: 'Cell spacing.*'
- assertVisible: 'Display'
- assertVisible: 'Dark mode'
- tapOn:
    id: 'SettingsScreenSelectors.CellSpacingOption'
- extendedWaitUntil:
    visible:
      id: 'SettingsOptionSheetSelectors.Root'
    timeout: 3000
# A blind swipe-down races the sheet animation and sometimes leaves the sheet
# open, blocking every later scroll. Dismiss it explicitly and wait until gone.
- tapOn:
    id: 'PopoverDismissRegion'
- extendedWaitUntil:
    notVisible:
      id: 'SettingsOptionSheetSelectors.Root'
    timeout: 3000
- scrollUntilVisible:
    element:
      id: 'SettingsAppFooterSelectors.PrivacyPolicyLink'
    direction: DOWN
- assertVisible:
    id: 'SettingsAppFooterSelectors.ReportBugLink'
- assertVisible:
    id: 'SettingsAppFooterSelectors.PrivacyPolicyLink'
- tapOn:
    id: 'SettingsAppFooterSelectors.PrivacyPolicyLink'
- extendedWaitUntil:
    visible: 'Privacy policy'
    timeout: 3000
- tapOn:
    id: 'HeaderBackButtonSelectors.Root'
- extendedWaitUntil:
    visible:
      id: 'SettingsScreenSelectors.Root'
    timeout: 3000
- tapOn:
    id: 'HeaderBackButtonSelectors.Root'
- extendedWaitUntil:
    visible:
      id: 'HomeScreenSelectors.Root'
    timeout: 3000
- stopApp
