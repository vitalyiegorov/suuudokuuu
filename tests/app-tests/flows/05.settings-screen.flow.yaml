appId: ${APP_ID}
---
- startRecording:
      path: '05.settings-screen'
      optional: true

- runFlow: subflows/navigation/launch-home.flow.yaml
# Retry the tab handoff once: on the warm app the first tap after a flow
# lands at Home is occasionally consumed without reaching the tab bar (CI run
# 33395276746: Settings never mounted after a reported tap), the same
# mid-transition swallow the shared accept/confirm subflows already retry.
- retry:
      maxRetries: 1
      commands:
          - tapOn: 'Settings'
          - extendedWaitUntil:
                visible:
                    id: 'SettingsScreenSelectors.Root'
                timeout: 5000
- assertVisible: 'Game'
- assertVisible: 'Language.*'
- assertVisible: 'Number size.*'
- assertVisible: 'Cell spacing.*'
# Scroll-tolerant: the Android viewport shows fewer rows than the iPhone,
# so below-the-fold entries need a scroll (no-op when already visible).
- scrollUntilVisible:
      element:
          text: 'Display'
      direction: DOWN
- scrollUntilVisible:
      element:
          text: 'Dark mode'
      direction: DOWN
- tapOn:
      id: 'SettingsScreenSelectors.CellSpacingOption'
# Dismiss the option sheet deterministically by re-selecting the current
# value (closes on both platforms; a blind swipe races the animation), then
# scroll to the footer instead of counting swipes — viewports differ.
- extendedWaitUntil:
      visible:
          id: 'SettingsOptionSheetSelectors.Root'
      timeout: 3000
- tapOn:
      text: 'Spacious.*'
- extendedWaitUntil:
      notVisible:
          id: 'SettingsOptionSheetSelectors.Root'
      timeout: 3000
# The Android floating tab bar overlays the scroll content, so a link that is
# merely on screen can still sit under the bar and lose the tap to it. Scrolling
# once more settles the content at its end, where the reserved bottom inset
# clears the bar.
- scrollUntilVisible:
      element:
          id: 'SettingsAppFooterSelectors.PrivacyPolicyLink'
      direction: DOWN
- scroll
- assertVisible:
      id: 'SettingsAppFooterSelectors.ReportBugLink'
- assertVisible:
      id: 'SettingsAppFooterSelectors.PrivacyPolicyLink'
- tapOn:
      id: 'SettingsAppFooterSelectors.PrivacyPolicyLink'
- extendedWaitUntil:
      visible:
          id: 'PrivacyPolicyScreenSelectors.Root'
      timeout: 10000
- tapOn:
      id: 'HeaderBackButtonSelectors.Root'
- extendedWaitUntil:
      visible:
          id: 'SettingsScreenSelectors.Root'
      timeout: 10000
- tapOn:
      id: 'HeaderBackButtonSelectors.Root'
- extendedWaitUntil:
      visible:
          id: 'HomeScreenSelectors.Root'
      timeout: 3000
