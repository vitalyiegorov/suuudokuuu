appId: ${APP_ID}
---
- startRecording:
      path: '25.import-puzzle'
      optional: true

- runFlow: subflows/navigation/launch-home.flow.yaml
- scrollUntilVisible:
      element:
          id: 'HomeScreenSelectors.ImportLink'
      direction: DOWN
      timeout: 10000
- tapOn:
      id: 'HomeScreenSelectors.ImportLink'
- extendedWaitUntil:
      visible:
          id: 'ImportScreenSelectors.Root'
      timeout: 3000
- assertVisible:
      id: 'ImportScreenSelectors.Status'
      text: 'Paste a puzzle or open a link'

- tapOn:
      id: 'ImportScreenSelectors.Cell.0-0'
- tapOn:
      id: 'ImportScreenSelectors.PadValue.5'
- extendedWaitUntil:
      visible:
          id: 'ImportScreenSelectors.Status'
          text: 'More than one solution'
      timeout: 3000
- tapOn:
      id: 'ImportScreenSelectors.Cell.0-1'
- tapOn:
      id: 'ImportScreenSelectors.PadValue.5'
- extendedWaitUntil:
      visible:
          id: 'ImportScreenSelectors.Status'
          text: 'These cells conflict'
      timeout: 3000
- assertVisible:
      id: 'ImportScreenSelectors.PlayButton'
      enabled: false
- tapOn:
      id: 'ImportScreenSelectors.ClearButton'
- extendedWaitUntil:
      visible:
          id: 'ImportScreenSelectors.Status'
          text: 'More than one solution'
      timeout: 3000

- tapOn:
      id: 'ImportScreenSelectors.Input'
- eraseText:
      charactersToErase: 100
- inputText: '003020600900305001001806400008102900700000008006708200002609500800203009005010300'
- extendedWaitUntil:
      visible:
          id: 'ImportScreenSelectors.Status'
          text: 'Exactly one solution · SE 2\.3 · Newbie'
      timeout: 5000
- scrollUntilVisible:
      element:
          id: 'ImportScreenSelectors.PlayButton'
      direction: DOWN
      timeout: 5000
- tapOn:
      id: 'ImportScreenSelectors.PlayButton'
- extendedWaitUntil:
      visible:
          id: 'GameScreenSelectors.Root'
      timeout: 10000
- runFlow: subflows/game/pause-current-game.flow.yaml
- assertVisible:
      id: 'PauseScreenSelectors.DetailsValue'
      text: '.*Newbie · 2\.3.*'
- tapOn:
      id: 'PauseScreenSelectors.ResumeButton'
- extendedWaitUntil:
      visible:
          id: 'GameScreenSelectors.Root'
      timeout: 10000
- runFlow: subflows/game/quit-current-game.flow.yaml

- openLink:
      link: 'suuudokuuu://import?puzzle=003020600900305001001806400008102900700000008006708200002609500800203009005010300'
- extendedWaitUntil:
      visible:
          id: 'ImportScreenSelectors.Status'
          text: 'Exactly one solution · SE 2\.3 · Newbie'
      timeout: 10000
- assertVisible:
      id: 'ImportScreenSelectors.PlayButton'
      enabled: true
- scrollUntilVisible:
      element:
          id: 'ImportScreenSelectors.CancelButton'
      direction: DOWN
      timeout: 5000
- tapOn:
      id: 'ImportScreenSelectors.CancelButton'
- extendedWaitUntil:
      visible:
          id: 'HomeScreenSelectors.Root'
      timeout: 3000
