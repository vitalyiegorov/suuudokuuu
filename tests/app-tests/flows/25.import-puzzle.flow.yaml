appId: ${APP_ID}
---
- startRecording:
      path: '25.import-puzzle'
      optional: true

- runFlow: subflows/navigation/launch-home.flow.yaml
- tapOn:
      id: 'MainTabSelectors.Play'
- scrollUntilVisible:
      element:
          id: 'HomeScreenSelectors.ImportLink'
      direction: DOWN
      visibilityPercentage: 100
      timeout: 10000
- scroll
- tapOn:
      id: 'HomeScreenSelectors.ImportLink'
- extendedWaitUntil:
      visible:
          id: 'ImportScreenSelectors.Status'
          text: 'Paste a puzzle or tap a cell to type it'
      timeout: 3000

- tapOn:
      id: 'ImportScreenSelectors.Cell.0-0'
- tapOn:
      id: 'ImportScreenSelectors.PadValue.5'
- extendedWaitUntil:
      visible:
          id: 'ImportScreenSelectors.Status'
          text: '1 clue · more than one solution'
      timeout: 3000
- tapOn:
      id: 'ImportScreenSelectors.PadValue.5'
- extendedWaitUntil:
      visible:
          id: 'ImportScreenSelectors.Status'
          text: 'Two 5s in row 1'
      timeout: 3000
- assertVisible:
      id: 'ImportScreenSelectors.PlayButton'
      enabled: false
- tapOn:
      id: 'ImportScreenSelectors.Cell.0-1'
- tapOn:
      id: 'ImportScreenSelectors.ClearButton'
- extendedWaitUntil:
      visible:
          id: 'ImportScreenSelectors.Status'
          text: '1 clue · more than one solution'
      timeout: 3000
- tapOn:
      id: 'ImportScreenSelectors.ResetButton'
- extendedWaitUntil:
      visible:
          id: 'ImportScreenSelectors.PasteButton'
      timeout: 3000
- swipe:
      from:
          id: 'ImportScreenSelectors.Title'
      direction: DOWN
- extendedWaitUntil:
      notVisible:
          id: 'ImportScreenSelectors.Root'
      timeout: 3000
- assertVisible:
      id: 'HomeScreenSelectors.Root'

- openLink:
      link: 'suuudokuuu://import?puzzle=003020600900305001001806400008102900700000008006708200002609500800203009005010300'
- extendedWaitUntil:
      visible:
          id: 'ImportScreenSelectors.Status'
          text: 'One solution · Newbie · SE 2\.3'
      timeout: 10000
- tapOn:
      id: 'ImportScreenSelectors.PlayButton'
- extendedWaitUntil:
      visible:
          id: 'GameScreenSelectors.Root'
      timeout: 10000
- runFlow: subflows/game/pause-current-game.flow.yaml
- assertVisible:
      id: 'PauseScreenSelectors.DetailsValue'
      text: '.*Newbie · 2\.3.*'
- tapOn:
      id: 'PauseScreenSelectors.ResumeButton'
- extendedWaitUntil:
      visible:
          id: 'GameScreenSelectors.Root'
      timeout: 10000

- openLink:
      link: 'suuudokuuu://import?puzzle=003020600900305001001806400008102900700000008006708200002609500800203009005010300'
- extendedWaitUntil:
      visible:
          id: 'ImportScreenSelectors.Status'
          text: 'One solution · Newbie · SE 2\.3'
      timeout: 10000
- tapOn:
      id: 'ImportScreenSelectors.PlayButton'
- extendedWaitUntil:
      visible: 'Stop current run\?'
      timeout: 3000
- tapOn: 'OK'
- extendedWaitUntil:
      visible:
          id: 'GameScreenSelectors.Root'
      timeout: 10000
- runFlow: subflows/game/quit-current-game.flow.yaml
