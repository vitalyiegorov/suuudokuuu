appId: ${APP_ID}
---
- startRecording:
      path: '03.game-screen-loose'
      optional: true

- openLink:
      link: suuudokuuu://shared/IwBmC4EAAAA0EQDBACAFQTAMOoIECQAggCIB0AY%2BAKoE4BxgRoAgAiAEwByAsgFLwDKAmhW4A2WgBUAzwHyAJHgAhARQBYASQBSASwC54ABQBQ5gEqAqgCaAQwC0A0oYL0RAGQCLAbYDUAdwAOAHIAhgALAN0A7EQAbwD6AMwAjzggAEYAyADCABIA0QAoAMf5PgAJAE4ASgDKdgCZAPEALADlACKJAAWd8eAAkMwAAxDxEMBAA
- runFlow:
      when:
          visible: 'Open in.*'
      commands:
          - tapOn: 'Open'

- extendedWaitUntil:
      visible: 'Open puzzle'
      timeout: 10000
- tapOn: 'Open puzzle'
- assertVisible:
      id: 'GameScreenSelectors.Root'
- assertVisible:
      id: 'AvailableValueItemSelectors.Button'
- tapOn:
      id: 'CellSelectors.Root'
      index: 28
- tapOn:
      id: 'AvailableValueItemSelectors.Button'
      index: 0
- assertVisible:
      below: 'Mistakes'
      text: '1/3'
- tapOn:
      id: 'AvailableValueItemSelectors.Button'
      index: 0
- assertVisible:
      below: 'Mistakes'
      text: '2/3'
- tapOn:
      id: 'AvailableValueItemSelectors.Button'
      index: 0
- assertVisible: 'Better luck next time!.*'
- assertVisible: 'Help Ukraine win!'
- tapOn: 'Play again'
- assertVisible:
      below: 'Best score'
      text: '[0-9]+'
- assertVisible:
      below: 'Best time'
      text: '[0-9]{2}:[0-9]{2}'
- tapOn: 'Start new'
- assertVisible: 'Newbie'
- stopApp
