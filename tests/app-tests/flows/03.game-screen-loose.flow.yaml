appId: ${APP_ID}
---
- startRecording:
      path: '03.game-screen-loose'
      optional: true

- openLink:
      link: suuudokuuu://shared/_IAP3__7X7_7r____zMOSjkyv8nqM0LfkydkEBSLStwgSBis7M6rv28ZIIA
- runFlow:
      when:
          visible: 'Open in.*'
      commands:
          - tapOn: 'Open'

- extendedWaitUntil:
      visible: 'Open puzzle'
      timeout: 10000
- tapOn: 'Open puzzle'
- assertVisible:
      id: 'GameScreenSelectors.Root'
- assertVisible:
      id: 'AvailableValueItemSelectors.Button'
- tapOn:
      id: 'CellSelectors.Root'
      index: 28
- tapOn:
      id: 'AvailableValueItemSelectors.Button'
      index: 0
- assertVisible:
      below: 'Mistakes'
      text: '1/3'
- tapOn:
      id: 'AvailableValueItemSelectors.Button'
      index: 0
- assertVisible:
      below: 'Mistakes'
      text: '2/3'
- tapOn:
      id: 'AvailableValueItemSelectors.Button'
      index: 0
- assertVisible: 'Better luck next time!.*'
- assertVisible: 'Help Ukraine win!'
- tapOn: 'Play again'
- assertVisible: 'Start new'
- tapOn: 'Start new'
- assertVisible: 'Newbie'
- stopApp
