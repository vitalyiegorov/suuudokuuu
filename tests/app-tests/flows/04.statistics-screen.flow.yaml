appId: ${APP_ID}
---
- startRecording:
      path: '04.statistics-screen'
      optional: true

- runFlow: subflows/navigation/launch-home.flow.yaml
- runFlow:
      file: subflows/shared/complete-winning-shared-challenge.flow.yaml
      env:
          SHARED_CHALLENGE_LINK: suuudokuuu://shared/_KGP________9____qXF6FFdMjBWGhJIN-CMqSm5omCUw0KFUm6-t2HxLUAuYMCP-
- scrollUntilVisible:
      element:
          id: 'ChallengeResultFooterSelectors.HomeButton'
      direction: DOWN
      timeout: 3000
- tapOn:
      id: 'ChallengeResultFooterSelectors.HomeButton'
- extendedWaitUntil:
      visible:
          id: 'HomeScreenSelectors.Root'
      timeout: 3000
- tapOn: 'Stats'
- extendedWaitUntil:
      visible:
          id: 'HistoryScreenSelectors.Root'
      timeout: 3000
# Scroll-tolerant: the difficulty ladder sits below the fold on the Android
# viewport, so scroll to its deepest line before asserting the title above it.
- scrollUntilVisible:
      element:
          text: '.*completed game.*'
      direction: DOWN
- assertVisible: 'Newbie.*'
# The arsenal and other editorial sections pushed the difficulty ladder to the end of a
# much taller scroll, so the scroll above stops as soon as the row's title line
# appears and its tappable centre still sits under the floating tab bar. Scrolling
# once more settles the content at its end, where the reserved bottom inset clears
# the bar.
- scroll
- tapOn:
      id: 'HistoryDifficultySelectors.Card.Newbie'
- extendedWaitUntil:
      visible:
          id: 'CompletedGameItemSelectors.ReplayButton'
      timeout: 3000
- assertVisible:
      id: 'HistoryGamesSummaryBandSelectors.Root'
- assertVisible: 'Score'
- assertVisible: 'Time'
- assertVisible: 'Mistakes'
# This fixture predates the rating trailer, so it decodes with an unknown rating: the history
# row must show the plain difficulty text with no "· rating" suffix rather than a fake 0.
- assertVisible:
      id: 'CompletedGameItemSelectors.DifficultyValue'
      text: 'Newbie'
# The compact technique summary derives lazily from the decoded replay after the card mounts.
- extendedWaitUntil:
      visible:
          id: 'CompletedGameTechniqueSummarySelectors.Root'
      timeout: 5000
- tapOn:
      id: 'CompletedGameItemSelectors.ReplayButton'
- extendedWaitUntil:
      visible:
          id: 'ReplayControlsSelectors.Root'
      timeout: 3000
# Same old-link fixture: the replay header's level metric must stay plain, with no rating suffix.
- assertVisible:
      id: 'ReplayHeaderSelectors.Level'
      text: 'Newbie'
# Every step rebuilds the board and reclassifies the move through the technique
# engine while rendering, so the meta row can lag the tap on the slower Android
# emulator. Previous is disabled at step 0, so tapping it before the Next render
# lands is a silent no-op that strands the replay on step 1. Gate each interaction
# on the step it produces instead of firing the taps back to back.
- tapOn:
      id: 'ReplayControlsSelectors.NextButton'
- extendedWaitUntil:
      visible: 'Move 1 / 1'
      timeout: 3000
- tapOn:
      id: 'ReplayControlsSelectors.PreviousButton'
- extendedWaitUntil:
      visible: 'Move 0 / 1'
      timeout: 3000
- swipe:
      from:
          id: 'ReplayScrubberSelectors.Root'
      direction: RIGHT
- extendedWaitUntil:
      visible: 'Move 1 / 1'
      timeout: 3000
- tapOn:
      id: 'ReplayControlsSelectors.PreviousButton'
- extendedWaitUntil:
      visible: 'Move 0 / 1'
      timeout: 3000
- assertVisible:
      id: 'ReplayShareActionSelectors.Button'
- tapOn:
      id: 'ReplayActionsSelectors.BackButton'
- extendedWaitUntil:
      visible:
          id: 'HistoryGamesScreenSelectors.Root'
      timeout: 3000
- tapOn:
      id: 'HeaderBackButtonSelectors.Root'
- extendedWaitUntil:
      visible:
          id: 'HistoryScreenSelectors.Root'
      timeout: 3000
- tapOn:
      id: 'HeaderBackButtonSelectors.Root'
- extendedWaitUntil:
      visible:
          id: 'HomeScreenSelectors.Root'
      timeout: 3000
- stopApp
