appId: ${APP_ID}
---
- startRecording:
      path: '04.statistics-screen'
      optional: true

- runFlow: subflows/navigation/launch-home.flow.yaml
- runFlow:
      file: subflows/shared/complete-winning-shared-challenge.flow.yaml
      env:
          SHARED_CHALLENGE_LINK: suuudokuuu://shared/_KGP________9____qXF6FFdMjBWGhJIN-CMqSm5omCUw0KFUm6-t2HxLUAuYMCP-
- scrollUntilVisible:
      element:
          id: 'ChallengeResultFooterSelectors.HomeButton'
      direction: DOWN
      timeout: 3000
- tapOn:
      id: 'ChallengeResultFooterSelectors.HomeButton'
- extendedWaitUntil:
      visible:
          id: 'HomeScreenSelectors.Root'
      timeout: 3000
- tapOn: 'Stats'
- extendedWaitUntil:
      visible:
          id: 'HistoryScreenSelectors.Root'
      timeout: 3000
# Scroll-tolerant: the difficulty card sits below the fold on the Android
# viewport, so scroll to its deepest line before asserting the title above it.
- scrollUntilVisible:
      element:
          text: '.*completed game.*'
      direction: DOWN
- assertVisible: 'Newbie.*'
- tapOn:
      id: 'HistoryDifficultySelectors.Card.Newbie'
- extendedWaitUntil:
      visible:
          id: 'CompletedGameItemSelectors.ReplayButton'
      timeout: 3000
- assertVisible: 'Score'
- assertVisible: 'Time'
- assertVisible: 'Mistakes'
- tapOn:
      id: 'CompletedGameItemSelectors.ReplayButton'
- extendedWaitUntil:
      visible:
          id: 'ReplayControlsSelectors.Root'
      timeout: 3000
# The replay board fills the shorter Android viewport, so the playback controls
# scroll below the fold; scroll the step buttons above the navigation bar before
# tapping (iOS passes only because its taller viewport keeps them on screen).
- scrollUntilVisible:
      element:
          id: 'ReplayControlsSelectors.NextButton'
      direction: DOWN
      timeout: 5000
- tapOn:
      id: 'ReplayControlsSelectors.NextButton'
- tapOn:
      id: 'ReplayControlsSelectors.PreviousButton'
- tapOn:
      id: 'ReplayTopBarSelectors.CloseButton'
- extendedWaitUntil:
      visible:
          id: 'HistoryGamesScreenSelectors.Root'
      timeout: 3000
- tapOn:
      id: 'HeaderBackButtonSelectors.Root'
- extendedWaitUntil:
      visible:
          id: 'HistoryScreenSelectors.Root'
      timeout: 3000
- tapOn:
      id: 'HeaderBackButtonSelectors.Root'
- extendedWaitUntil:
      visible:
          id: 'HomeScreenSelectors.Root'
      timeout: 3000
- stopApp
