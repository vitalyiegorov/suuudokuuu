appId: ${APP_ID}
---
- startRecording:
      path: '04.statistics-screen'
      optional: true

- runFlow: subflows/navigation/launch-home.flow.yaml
- runFlow:
      file: subflows/shared/complete-winning-shared-challenge.flow.yaml
      env:
          SHARED_CHALLENGE_LINK: suuudokuuu://shared/_KGP________9____qXF6FFdMjBWGhJIN-CMqSm5omCUw0KFUm6-t2HxLUAuYMCP-
- scrollUntilVisible:
      element:
          id: 'ChallengeResultFooterSelectors.HomeButton'
      direction: DOWN
      timeout: 3000
- tapOn:
      id: 'ChallengeResultFooterSelectors.HomeButton'
- extendedWaitUntil:
      visible:
          id: 'HomeScreenSelectors.Root'
      timeout: 3000
- tapOn: 'Stats'
- extendedWaitUntil:
      visible:
          id: 'HistoryScreenSelectors.Root'
      timeout: 3000
# Scroll-tolerant: the difficulty card sits below the fold on the Android
# viewport, so scroll to its deepest line before asserting the title above it.
- scrollUntilVisible:
      element:
          text: '.*completed game.*'
      direction: DOWN
- assertVisible: 'Newbie.*'
# The rating-band and technique sections pushed the difficulty card to the end of a
# much taller scroll, so the scroll above stops as soon as the card's title line
# appears and its tappable centre still sits under the floating tab bar. Scrolling
# once more settles the content at its end, where the reserved bottom inset clears
# the bar.
- scroll
- tapOn:
      id: 'HistoryDifficultySelectors.Card.Newbie'
- extendedWaitUntil:
      visible:
          id: 'CompletedGameItemSelectors.ReplayButton'
      timeout: 3000
- assertVisible: 'Score'
- assertVisible: 'Time'
- assertVisible: 'Mistakes'
# This fixture predates the rating trailer, so it decodes with an unknown rating: the history
# row must show the plain difficulty text with no "· rating" suffix rather than a fake 0.
- assertVisible:
      id: 'CompletedGameItemSelectors.DifficultyValue'
      text: 'Newbie'
- tapOn:
      id: 'CompletedGameItemSelectors.ReplayButton'
- extendedWaitUntil:
      visible:
          id: 'ReplayControlsSelectors.Root'
      timeout: 3000
# Same old-link fixture: the replay header's level metric must stay plain, with no rating suffix.
- assertVisible:
      id: 'ReplayHeaderSelectors.Level'
      text: 'Newbie'
# Game Review card: pace metrics and the techniques-used section (with its
# best-technique hero) always render once a run has at least one recorded
# step, regardless of whether the game itself carries a rating.
- assertVisible:
      id: 'ReplayMoveQualityStripSelectors.Root'
- assertVisible:
      id: 'ReplayRunReviewSelectors.Root'
- assertVisible:
      id: 'ReplayPaceMetricsSelectors.Root'
# The Game Review sits in its own height-capped scroll under the board, so on the
# shorter Android viewport the techniques section starts outside it. Swiping inside
# that scroll moves the review content rather than the page; iOS shows both without
# scrolling and the swipe is a no-op there.
- swipe:
      from:
          id: 'ReplayPaceMetricsSelectors.Root'
      direction: UP
- extendedWaitUntil:
      visible:
          id: 'HistoryTechniquesSelectors.Root'
      timeout: 5000
# The replay board fills the shorter Android viewport, so the playback controls
# scroll below the fold; scroll the step buttons above the navigation bar before
# tapping (iOS passes only because its taller viewport keeps them on screen).
- scrollUntilVisible:
      element:
          id: 'ReplayControlsSelectors.NextButton'
      direction: DOWN
      timeout: 5000
- tapOn:
      id: 'ReplayControlsSelectors.NextButton'
- tapOn:
      id: 'ReplayControlsSelectors.PreviousButton'
- assertVisible: 'Move 0 / 1'
- swipe:
      from:
          id: 'ReplayScrubberSelectors.Root'
      direction: RIGHT
- assertVisible: 'Move 1 / 1'
- tapOn:
      id: 'ReplayControlsSelectors.PreviousButton'
- assertVisible: 'Move 0 / 1'
# Pressing the hardest-moment chip seeks the scrubber straight to that step,
# the same destination the scrubber swipe above reached directly.
- assertVisible:
      id: 'ReplayHardestMomentSelectors.Root'
- tapOn:
      id: 'ReplayHardestMomentSelectors.Root'
- assertVisible: 'Move 1 / 1'
- scrollUntilVisible:
      element:
          id: 'ReplayShareActionSelectors.Button'
      direction: DOWN
      timeout: 3000
- assertVisible:
      id: 'ReplayShareActionSelectors.Button'
- tapOn:
      id: 'ReplayActionsSelectors.BackButton'
- extendedWaitUntil:
      visible:
          id: 'HistoryGamesScreenSelectors.Root'
      timeout: 3000
- tapOn:
      id: 'HeaderBackButtonSelectors.Root'
- extendedWaitUntil:
      visible:
          id: 'HistoryScreenSelectors.Root'
      timeout: 3000
- tapOn:
      id: 'HeaderBackButtonSelectors.Root'
- extendedWaitUntil:
      visible:
          id: 'HomeScreenSelectors.Root'
      timeout: 3000
- stopApp
