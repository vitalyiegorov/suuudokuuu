appId: ${APP_ID}
---
- runFlow: subflows/navigation/launch-home.flow.yaml
- runFlow:
      file: subflows/navigation/open-screen.flow.yaml
      env:
          SCREEN_LINK: suuudokuuu://daily
          SCREEN_ROOT_ID: DailyStreakPillSelectors.Root
- assertVisible:
      id: 'DailyScreenSelectors.ActionButton'
      text: '.*Play today.*'
- tapOn:
      id: 'DailyScreenSelectors.ActionButton'
- extendedWaitUntil:
      visible:
          id: 'GameScreenSelectors.Root'
      timeout: 15000
- runFlow: subflows/game/quit-current-game.flow.yaml
