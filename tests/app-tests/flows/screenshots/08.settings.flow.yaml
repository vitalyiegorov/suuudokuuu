appId: ${APP_ID}
tags:
    - screenshots
---
- runFlow: subflows/reset-app.flow.yaml
- runFlow:
      file: subflows/apply-language.flow.yaml
      env:
          LOCALE: ${LOCALE}
- runFlow:
      file: subflows/apply-appearance.flow.yaml
      env:
          APPEARANCE: ${APPEARANCE}

- openLink:
      link: 'suuudokuuu://settings'
- extendedWaitUntil:
      visible:
          id: 'SettingsScreenSelectors.Root'
      timeout: 5000

- takeScreenshot: '08-settings'
- stopApp
