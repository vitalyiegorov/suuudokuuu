appId: ${APP_ID}
---
# Selects ${LOCALE} from the language sheet by testID so this works
# regardless of which language currently renders the row labels. Returns to
# Home explicitly through the deep link instead of relying on where
# router.back() lands, since this flow opens the sheet directly instead of
# navigating from Settings.
- openLink:
      link: 'suuudokuuu://settings/language'
- extendedWaitUntil:
      visible:
          id: 'SettingsOptionSheetSelectors.Root'
      timeout: 5000
- scrollUntilVisible:
      element:
          id: 'SettingsOptionSheetSelectors.Option.${LOCALE}'
      direction: DOWN
      timeout: 5000
- tapOn:
      id: 'SettingsOptionSheetSelectors.Option.${LOCALE}'
- extendedWaitUntil:
      notVisible:
          id: 'SettingsOptionSheetSelectors.Root'
      timeout: 5000
- openLink:
      link: 'suuudokuuu://'
- extendedWaitUntil:
      visible:
          id: 'HomeScreenSelectors.Root'
      timeout: 5000
