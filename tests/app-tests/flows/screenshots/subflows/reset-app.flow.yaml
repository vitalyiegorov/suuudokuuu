appId: ${APP_ID}
---
- retry:
      maxRetries: 1
      commands:
          - launchApp:
                clearState: false
                arguments:
                    AppleLanguages: '(${LOCALE})'
                    AppleLocale: ${LOCALE_IDENTIFIER}
          - runFlow:
                when:
                    visible: '^Open$'
                commands:
                    - tapOn: '^Open$'
                    - extendedWaitUntil:
                          notVisible: '^Open$'
                          timeout: 10000
          - openLink:
                link: 'suuudokuuu://'
          - runFlow:
                when:
                    visible: '^Open$'
                commands:
                    - tapOn: '^Open$'
                    - extendedWaitUntil:
                          notVisible: '^Open$'
                          timeout: 10000
          - extendedWaitUntil:
                visible:
                    id: 'HomeScreenSelectors.Root'
                timeout: 15000
