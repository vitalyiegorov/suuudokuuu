appId: ${APP_ID}
tags:
    - screenshots
---
- runFlow: subflows/reset-app.flow.yaml
- runFlow:
      file: subflows/apply-appearance.flow.yaml
      env:
          APPEARANCE: ${APPEARANCE}

- runFlow: ../subflows/game/start-new-game.flow.yaml
- pressKey: Home
- runFlow:
      file: ../subflows/shared/wait-observation-window.flow.yaml
      env:
          WAIT_MILLISECONDS: 3000
- launchApp:
      stopApp: false
- extendedWaitUntil:
      visible:
          id: 'PauseScreenSelectors.TimeValue'
      timeout: 10000

- takeScreenshot: '11-pause'
- stopApp
