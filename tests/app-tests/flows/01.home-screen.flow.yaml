appId: ${APP_ID}
---
- startRecording:
      path: '01.home-screen'
      optional: true

- runFlow: subflows/navigation/launch-home.flow.yaml
- assertVisible: 'Difficulty'
- assertVisible: 'Newbie'
- assertVisible: 'Mistakes'
- runFlow: subflows/game/start-new-game.flow.yaml
- assertVisible:
      id: 'GameScreenSelectors.Score'
      text: '0'
- assertVisible: '0/3'
- assertVisible:
      id: 'GameScreenSelectors.Level'
      text: 'Easy'
# The game screen only shows a rating badge for Hell and Infinity, so an Easy run never
# has one to assert, regardless of the freshly generated puzzle carrying a computed SE rating.
- assertNotVisible:
      id: 'GameScreenSelectors.Rating'
- runFlow: subflows/game/quit-current-game.flow.yaml
# Quitting remounts Home at the top of its scroll content, so the start button
# sits below the fold on shorter viewports and has to be scrolled back into view.
- scrollUntilVisible:
      element:
          id: 'HomeScreenSelectors.StartButton'
      direction: DOWN
      timeout: 3000
- stopApp
