appId: ${APP_ID}
---
- startRecording:
    path: '01.home-screen'
    optional: true

- runFlow: subflows/navigation/launch-home.flow.yaml
- assertVisible: 'Difficulty'
- assertVisible: 'Newbie'
- assertVisible: 'Mistakes'
- runFlow: subflows/game/start-new-game.flow.yaml
- assertVisible:
    id: 'GameScreenSelectors.Score'
    text: '0'
- assertVisible: '0/3'
- runFlow: subflows/game/quit-current-game.flow.yaml
- assertVisible:
    id: 'HomeScreenSelectors.StartButton'
- stopApp
